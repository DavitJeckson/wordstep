    function recentReviewPlan(allProgress) {
      const availableWordIds = new Set(state.book.words.map(word => word.id));
      const eligible = allProgress.filter(progress => progress.learnedDate
        && progress.learnedDate < localDate()
        && !progress.relearnQueuedAt
        && !progress.skippedAt
        && availableWordIds.has(progress.wordId));
      const sourceDate = eligible.reduce((latest, progress) => progress.learnedDate > latest ? progress.learnedDate : latest, "");
      return {
        sourceDate: sourceDate || null,
        reviewIds: sourceDate ? eligible.filter(progress => progress.learnedDate === sourceDate).map(progress => progress.wordId) : []
      };
    }

    async function upgradeSession(session) {
      let changed = false;
      if (!Array.isArray(session.quizAnswers)) { session.quizAnswers = []; changed = true; }
      if (!session.quizOptions) { session.quizOptions = {}; changed = true; }
      if (!session.quizRetries) { session.quizRetries = {}; changed = true; }
      if (!session.spellingRetries) { session.spellingRetries = {}; changed = true; }
      if (!Array.isArray(session.freshIds)) { session.freshIds = [...(session.newIds || [])]; changed = true; }
      if (typeof session.spellingCorrect !== "number") { session.spellingCorrect = 0; changed = true; }
      if (typeof session.spellingWrong !== "number") { session.spellingWrong = 0; changed = true; }
      if (session.completed && session.quizVersion !== 2 && session.newIds?.length) {
        session.quizVersion = 2;
        session.quizMode = "spelling";
        session.quizQueue = [...session.newIds];
        session.quizIndex = 0;
        session.quizAnswers = session.quizAnswers.map(answer => ({ ...answer, type: answer.type || "choice" }));
        session.stage = "quiz";
        session.completed = false;
        delete session.completedAt;
        await remove("activity", session.id);
        changed = true;
      } else if (!session.completed && session.quizVersion !== 2) {
        session.quizVersion = 2;
        session.quizMode = session.quizMode || "choice";
        session.quizAnswers = session.quizAnswers.map(answer => ({ ...answer, type: answer.type || "choice" }));
        changed = true;
      }
      if (session.quizVersion === 2 && !session.quizMode) { session.quizMode = "choice"; changed = true; }
      if (!Object.prototype.hasOwnProperty.call(session, "reviewSourceDate")) {
        if (session.reviewIds?.length) {
          session.reviewSourceDate = localDate(-1);
          changed = true;
        } else {
          const untouched = (session.reviewIndex || 0) === 0
            && !(session.reviewDone || []).length
            && (session.learnIndex || 0) === 0
            && (session.quizIndex || 0) === 0
            && !(session.quizAnswers || []).length;
          const allProgress = untouched ? (await getAll("progress")).filter(progress => progress.bookId === state.book.id) : [];
          const reviewPlan = recentReviewPlan(allProgress);
          session.reviewSourceDate = reviewPlan.sourceDate;
          if (untouched && reviewPlan.reviewIds.length) {
            session.reviewIds = reviewPlan.reviewIds;
            if (session.completed) await remove("activity", session.id);
            session.stage = "review";
            session.completed = false;
            delete session.completedAt;
          }
          changed = true;
        }
      }
      if (changed) await put("sessions", session);
      return session;
    }

    async function getSession() {
      const id = `${state.book.id}:${localDate()}`;
      let session = await get("sessions", id);
      if (session) return upgradeSession(session);
      const allProgress = (await getAll("progress")).filter(p => p.bookId === state.book.id);
      const progressByWord = new Map(allProgress.map(p => [p.wordId, p]));
      const reviewPlan = recentReviewPlan(allProgress);
      const reviewIds = reviewPlan.reviewIds;
      const pendingWords = state.book.words.filter(word => {
        const progress = progressByWord.get(word.id);
        return !progress?.skippedAt && (!progress?.learnedDate || progress.relearnQueuedAt);
      });
      pendingWords.sort((a, b) => {
        const aQueued = progressByWord.get(a.id)?.relearnQueuedAt || 0;
        const bQueued = progressByWord.get(b.id)?.relearnQueuedAt || 0;
        if (Boolean(aQueued) !== Boolean(bQueued)) return aQueued ? 1 : -1;
        return aQueued && bQueued ? aQueued - bQueued : 0;
      });
      const newIds = pendingWords.slice(0, state.settings.dailyNew).map(w => w.id);
      const freshIds = newIds.filter(wordId => !progressByWord.get(wordId)?.learnedDate);
      session = {
        id, bookId: state.book.id, date: localDate(), reviewSourceDate: reviewPlan.sourceDate, reviewIds, newIds,
        stage: reviewIds.length ? "review" : newIds.length ? "learn" : "complete",
        reviewIndex: 0, reviewDone: [], reviewKnown: 0,
        learnQueue: [...newIds], learnIndex: 0, learnDone: [], freshIds, repeats: {},
        quizVersion: 2, quizMode: "choice", quizQueue: [], quizIndex: 0, quizCorrect: 0, quizWrong: 0, quizAnswers: [], quizOptions: {}, quizRetries: {}, spellingRetries: {}, spellingCorrect: 0, spellingWrong: 0,
        completed: !reviewIds.length && !newIds.length, createdAt: Date.now()
      };
      await put("sessions", session);
      if (session.completed) await saveActivity(session);
      return session;
    }

    function currentWord() {
      if (!state.session) return null;
      let id;
      if (state.session.stage === "review") id = state.session.reviewIds[state.session.reviewIndex];
      if (state.session.stage === "learn") id = state.session.learnQueue[state.session.learnIndex];
      if (state.session.stage === "quiz") id = state.session.quizQueue[state.session.quizIndex];
      return state.book.words.find(w => w.id === id) || null;
    }

    function sessionCounts() {
      const s = state.session;
      const review = s.reviewIds.length;
      const learn = s.newIds.length;
      const quiz = s.newIds.length * (s.quizVersion === 2 ? 2 : 1);
      const answeredBase = new Set((s.quizAnswers || []).map(answer => `${answer.type || "choice"}:${answer.wordId}`)).size;
      const total = review + learn + quiz;
      const done = Math.min(total, s.reviewDone.length + s.learnDone.length + Math.min(answeredBase, quiz));
      return { review, learn, quiz, total, done, percent: total ? Math.round(done / total * 100) : 100 };
    }

    async function refreshHeader() {
      $("#bookName").textContent = state.book.name;
      $("#streakCount").textContent = String(await getStreak());
    }

    async function getStreak() {
      const rows = (await getAll("activity")).filter(a => a.bookId === state.book.id && a.completed);
      const dates = new Set(rows.map(a => a.date));
      let offset = dates.has(localDate()) ? 0 : -1;
      let count = 0;
      while (dates.has(localDate(offset))) { count++; offset--; }
      return count;
    }

    function railHTML() {
      const s = state.session;
      const c = sessionCounts();
      const stages = [
        { id: "review", label: reviewStageLabel(), count: c.review },
        { id: "learn", label: "今日学习", count: c.learn },
        { id: "quiz", label: "今日测验", count: c.quiz }
      ];
      const order = { review: 0, learn: 1, quiz: 2, complete: 3 };
      return `<div class="stage-rail">${stages.map((x, i) => `<div class="stage-item ${s.stage === x.id ? "active" : ""} ${order[s.stage] > i ? "done" : ""}"><small>${x.label}</small><b>${x.count}</b></div>`).join("")}</div>`;
    }

    function render() {
      if (state.tab === "review") return renderReview();
      if (state.tab === "stats") return renderStats();
      if (state.tab === "plan") return renderPlan();
      if (state.flowOpen && !state.session.completed) return renderFlow();
      return renderToday();
    }

    function renderToday() {
      const c = sessionCounts();
      if (state.session.completed) return renderSummary();
      const action = c.done ? "继续今日任务" : "开始今日任务";
      const sourceDate = state.session.reviewSourceDate;
      const reviewTitle = sourceDate === localDate(-1) ? "复习昨天学过的词" : sourceDate ? "复习最近一次学过的词" : "复习最近学过的词";
      const reviewCopy = c.review && sourceDate ? `${dateLabel(sourceDate)} 学过的单词` : "还没有可复习的历史单词";
      main.innerHTML = `<section class="screen">
        <p class="eyebrow">DAILY ROUTINE</p>
        <div class="today-head"><div><h1>今日学习</h1><p class="sub">${dateLabel(localDate())} · 按节奏完成三步</p></div><div class="today-number"><strong>${c.done}</strong><span>/ ${c.total}</span></div></div>
        <div class="progress-track" aria-label="今日进度"><div class="progress-fill" style="width:${c.percent}%"></div></div>
        ${railHTML()}
        <div class="card dashboard-card">
          <div class="flow-row"><div class="flow-icon">↺</div><div><h3>${reviewTitle}</h3><p>${reviewCopy}</p></div><div class="flow-count">${c.review}</div></div>
          <div class="flow-row"><div class="flow-icon">Aa</div><div><h3>学习今天的新词</h3><p>详细解析、常用短语、例句、辨析与词源</p></div><div class="flow-count">${c.learn}</div></div>
          <div class="flow-row"><div class="flow-icon">✓</div><div><h3>完成当天测验</h3><p>释义选择 + 中文提示拼写</p></div><div class="flow-count">${c.quiz}</div></div>
          <button class="primary block start-button" type="button" id="startFlow">${action} · ${stageLabel(state.session.stage)}</button>
        </div>
      </section>`;
      $("#startFlow").addEventListener("click", () => { state.flowOpen = true; state.revealed = false; render(); });
    }

    function reviewStageLabel() {
      const sourceDate = state.session?.reviewSourceDate;
      if (sourceDate === localDate(-1)) return "昨日复习";
      return sourceDate ? `${dateLabel(sourceDate)} 复习` : "近期复习";
    }

    function stageLabel(stage) {
      if (stage === "review") return reviewStageLabel();
      return ({ learn: "今日学习", quiz: "今日测验", complete: "已完成" })[stage] || "继续";
    }

    function renderFlow() {
      if (state.session.stage === "quiz") return renderQuiz();
      const word = currentWord();
      if (!word) { advanceStage(); return; }
      const isReview = state.session.stage === "review";
      const current = isReview ? state.session.reviewIndex + 1 : state.session.learnIndex + 1;
      const total = isReview ? state.session.reviewIds.length : state.session.learnQueue.length;
      const c = sessionCounts();
      const showDetail = !isReview || state.revealed;
      main.innerHTML = `<section class="screen">
        <div class="today-head"><div><p class="eyebrow">${isReview ? "REVIEW" : "LEARN"}</p><h2>${stageLabel(state.session.stage)} <span class="sub">${current} / ${total}</span></h2></div><div class="completion">今日 ${c.percent}%</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${c.percent}%"></div></div>
        ${railHTML()}
        <article class="card study-card">
          <div class="study-top"><h1 class="word">${esc(word.word)}</h1><div class="pronunciation-row">${phoneticWithAudioHTML(word)}${hasRecordedAudio(word) ? `<button class="audio-btn" type="button" id="audioButton" aria-label="播放 ${esc(word.word)} 的录制发音">▶</button>` : ""}</div></div>
          ${showDetail ? wordDetailHTML(word) : `<div class="reveal-placeholder"><div><b>先回忆这个词的含义</b><p class="sub">想好后再显示答案</p></div></div>`}
        </article>
        ${isReview && !state.revealed ? `<div class="actions single"><button class="primary block" type="button" id="revealButton">显示答案</button></div>` : `<div class="actions"><button class="secondary" type="button" id="againButton">${isReview ? "还不熟" : "再看看"}</button><button class="primary" type="button" id="knowButton">${isReview ? "认识" : "记住了"}</button></div>`}
      </section>`;
      $("#audioButton")?.addEventListener("click", event => playAudio(word, event.currentTarget));
      if (isReview && !state.revealed) $("#revealButton").addEventListener("click", () => { state.revealed = true; render(); });
      else {
        $("#againButton").addEventListener("click", () => rateWord(false));
        $("#knowButton").addEventListener("click", () => rateWord(true));
      }
    }

    function phraseSectionHTML(word, compact = false) {
      const phrases = Array.isArray(word.phrases) ? word.phrases : [];
      if (!phrases.length) return compact ? "" : `<details class="info-section" open><summary>常用短语 · 0</summary><div class="detail-body"><span class="sub">暂无</span></div></details>`;
      const body = phrases.map(x => `<div class="phrase-item"><p>${highlightWord(x.en, word.word)}</p><small>${esc(x.zh)}</small></div>`).join("");
      return compact ? body : `<details class="info-section" open><summary>常用短语 · ${phrases.length}</summary><div class="detail-body">${body}</div></details>`;
    }

    function etymologySectionHTML(word, compact = false) {
      const source = word.etymology && typeof word.etymology === "object" ? word.etymology : {};
      const cognates = Array.isArray(source.cognates) ? source.cognates : [];
      if (!source.root && !source.explanation && !source.memory && !cognates.length) return compact ? "" : `<details class="info-section" open><summary>词源分析</summary><div class="detail-body"><span class="sub">暂无</span></div></details>`;
      const root = source.root ? `<p><b>词根 / 基础词：</b>${esc(source.root)}${source.rootMeaning ? `（${esc(source.rootMeaning)}）` : ""}</p>` : "";
      const explanation = source.explanation ? `<p><b>词源与构词：</b>${esc(source.explanation)}</p>` : "";
      const family = cognates.length ? `<div><b>同源词：</b><div class="word-family">${cognates.map(x => `<span class="family-word"><b>${esc(x.word)}</b>${x.meaning || x.note ? ` · ${esc(x.meaning || x.note)}` : ""}</span>`).join("")}</div></div>` : "";
      const memory = source.memory ? `<p><b>记忆提示：</b>${esc(source.memory)}</p>` : "";
      const body = `<div class="etymology-card">${root}${explanation}${family}${memory}</div>`;
      return compact ? body : `<details class="info-section" open><summary>词源分析</summary><div class="detail-body">${body}</div></details>`;
    }

    function analysisHTML(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      const segments = text.split(/(?=【[^】]+】)/).map(segment => segment.trim()).filter(Boolean);
      const hasLabels = segments.some(segment => /^【[^】]+】/.test(segment));
      if (!hasLabels) return `<p class="analysis">${esc(text)}</p>`;
      const body = segments.map(segment => {
        const match = segment.match(/^【([^】]+)】\s*([\s\S]*)$/);
        if (!match) return `<p>${esc(segment)}</p>`;
        return `<p><strong class="analysis-label">【${esc(match[1])}】</strong>${esc(match[2])}</p>`;
      }).join("");
      return `<div class="analysis analysis-sectioned">${body}</div>`;
    }

    function wordDetailHTML(word) {
      return `<div class="word-detail"><p class="meaning">${esc(word.meaning)}</p>${analysisHTML(word.analysis)}</div>
        ${phraseSectionHTML(word)}
        <details class="info-section" open><summary>例句 · ${word.examples.length}</summary><div class="detail-body">${word.examples.map(x => `<div class="example"><p>${highlightWord(x.en, word.word)}</p><small>${esc(x.zh)}</small></div>`).join("")}</div></details>
        <details class="info-section" open><summary>近义词</summary><div class="detail-body"><div class="chip-list">${word.synonyms.length ? word.synonyms.map(x => `<span class="chip"><b>${esc(x.word)}</b>${x.note ? ` · ${esc(x.note)}` : ""}</span>`).join("") : "暂无"}</div></div></details>
        <details class="info-section" open><summary>形似与易混词</summary><div class="detail-body"><div class="chip-list">${word.confusables.length ? word.confusables.map(x => `<span class="chip"><b>${esc(x.word)}</b>${x.note ? ` · ${esc(x.note)}` : ""}</span>`).join("") : "暂无"}</div></div></details>
        ${etymologySectionHTML(word)}`;
    }

    function highlightWord(sentence, word) {
      const safe = esc(sentence);
      const pattern = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp(`\\b(${pattern})\\b`, "ig"), `<strong style="color:var(--indigo)">$1</strong>`);
    }

    function stopPronunciationPlayback() {
      const current = playRemotePronunciation.current;
      if (!current) return;
      current.audio.onended = null;
      current.audio.onerror = null;
      current.audio.pause();
      current.button.classList.remove("playing");
      current.button.setAttribute("aria-pressed", "false");
      playRemotePronunciation.current = null;
    }

    async function playRemotePronunciation(word, requestedType, button) {
      const type = requestedType === 1 ? 1 : 2;
      const current = playRemotePronunciation.current;
      if (current?.button === button && !current.audio.paused) {
        stopPronunciationPlayback();
        return;
      }
      stopPronunciationPlayback();
      const voiceEndpoint = atob(VOICE_ENDPOINT_B64);
      const audio = new Audio(`${voiceEndpoint}${encodeURIComponent(word.word.trim())}&type=${type}`);
      audio.preload = "none";
      const finish = () => {
        if (playRemotePronunciation.current?.audio !== audio) return;
        button.classList.remove("playing");
        button.setAttribute("aria-pressed", "false");
        playRemotePronunciation.current = null;
      };
      audio.onended = finish;
      audio.onerror = () => {
        finish();
        toast(`${type === 1 ? "英音" : "美音"}播放失败，请稍后重试`);
      };
      playRemotePronunciation.current = { audio, button };
      button.classList.add("playing");
      button.setAttribute("aria-pressed", "true");
      try {
        await audio.play();
      } catch (error) {
        finish();
        console.error("发音播放失败", error);
        toast(`${type === 1 ? "英音" : "美音"}播放失败，请检查网络后重试`);
      }
    }

    async function playAudio(word, button) {
      button.classList.add("playing");
      const fallback = () => {
        if ("speechSynthesis" in window) {
          speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(word.word);
          utterance.lang = "en-US";
          utterance.rate = .86;
          utterance.onend = () => button.classList.remove("playing");
          speechSynthesis.speak(utterance);
        } else { button.classList.remove("playing"); toast("当前浏览器无法播放发音"); }
      };
      const raw = word.audioBase64 || word.audio || "";
      if (!raw) return fallback();
      try {
        const src = raw.startsWith("data:audio/") ? raw : `data:audio/mpeg;base64,${raw}`;
        const audio = new Audio(src);
        audio.onended = () => button.classList.remove("playing");
        audio.onerror = fallback;
        await audio.play();
      } catch { fallback(); }
    }

    function scrollStudyCardToTop() {
      clearTimeout(scrollStudyCardToTop.timer);
      const align = () => {
        const card = $(".study-card");
        if (!card) return;
        const headerBottom = $(".header")?.getBoundingClientRect().bottom || 0;
        const gap = 10;
        const delta = card.getBoundingClientRect().top - headerBottom - gap;
        if (Math.abs(delta) > 1) {
          window.scrollTo({ top: Math.max(0, window.scrollY + delta), behavior: "auto" });
        }
      };
      requestAnimationFrame(() => {
        align();
        requestAnimationFrame(align);
      });
      // .screen has a short translate animation; correct once it has fully settled.
      scrollStudyCardToTop.timer = setTimeout(align, 220);
    }

    async function rateWord(known) {
      const word = currentWord();
      if (!word) return;
      const s = state.session;
      const shouldScrollToNextWord = (s.stage === "learn" && known)
        || (s.stage === "review" && s.reviewIndex + 1 >= s.reviewIds.length && s.newIds.length > 0);
      const key = `${state.book.id}:${word.id}`;
      const progress = await get("progress", key) || { key, bookId: state.book.id, wordId: word.id, reviewCount: 0, exposures: 0, correct: 0, wrong: 0 };
      progress.lastSeen = localDate();
      progress.exposures = (progress.exposures || 0) + 1;
      if (s.stage === "review") {
        progress.reviewCount = (progress.reviewCount || 0) + 1;
        progress.lastReviewDate = localDate();
        if (known) s.reviewKnown++;
        else {
          progress.wrong = (progress.wrong || 0) + 1;
          markForConsolidation(progress, "fuzzy");
        }
        if (!s.reviewDone.includes(word.id)) s.reviewDone.push(word.id);
        s.reviewIndex++;
      } else {
        if (!progress.learnedDate || progress.relearnQueuedAt) progress.learnedDate = localDate();
        delete progress.relearnQueuedAt;
        delete progress.skippedAt;
        if (!s.learnDone.includes(word.id)) s.learnDone.push(word.id);
        if (!known && !s.repeats[word.id]) {
          s.repeats[word.id] = 1;
          s.learnQueue.push(word.id);
        }
        s.learnIndex++;
      }
      await put("progress", progress);
      if (s.stage === "learn") await saveActivity(s, false);
      state.revealed = false;
      await advanceStage();
      if (shouldScrollToNextWord) scrollStudyCardToTop();
    }

    async function advanceStage() {
      const s = state.session;
      if (s.stage === "review" && s.reviewIndex >= s.reviewIds.length) {
        s.stage = s.newIds.length ? "learn" : "complete";
      }
      if (s.stage === "learn" && s.learnIndex >= s.learnQueue.length) {
        s.quizMode = "choice";
        s.quizQueue = [...s.newIds];
        s.quizIndex = 0;
        s.stage = s.quizQueue.length ? "quiz" : "complete";
      }
      if (s.stage === "quiz" && s.quizIndex >= s.quizQueue.length) {
        if (s.quizVersion === 2 && s.quizMode === "choice") {
          s.quizMode = "spelling";
          s.quizQueue = [...s.newIds];
          s.quizIndex = 0;
        } else {
          s.stage = "complete";
        }
      }
      if (s.stage === "complete") {
        s.completed = true;
        s.completedAt = Date.now();
        state.flowOpen = false;
        await saveActivity(s);
        await refreshHeader();
      }
      await put("sessions", s);
      state.quizAnswered = false;
      state.selectedAnswer = null;
      render();
    }

    function getQuizOptions(word) {
      const s = state.session;
      const indexKey = `${s.quizIndex}:${word.id}`;
      if (s.quizOptions[indexKey]) return s.quizOptions[indexKey];
      const distractors = shuffle(state.book.words.filter(w => w.id !== word.id).map(w => w.meaning)).slice(0, 3);
      const fallback = ["逐渐减少；缩小", "明确表达；阐明", "相互依赖的；关联的"];
      while (distractors.length < 3) distractors.push(fallback[distractors.length]);
      s.quizOptions[indexKey] = shuffle([word.meaning, ...distractors]);
      put("sessions", s);
      return s.quizOptions[indexKey];
    }

    function renderQuiz() {
      if (state.session.quizVersion === 2 && state.session.quizMode === "spelling") return renderSpellingQuiz();
      const word = currentWord();
      if (!word) { advanceStage(); return; }
      const s = state.session;
      const options = getQuizOptions(word);
      const answered = state.quizAnswered;
      const isCorrect = state.selectedAnswer !== null && state.selectedAnswer === word.meaning;
      const c = sessionCounts();
      main.innerHTML = `<section class="screen">
        <div class="today-head"><div><p class="eyebrow">QUIZ · CHOICE</p><h2>释义选择 <span class="sub">${s.quizIndex + 1} / ${s.quizQueue.length}</span></h2></div><div class="completion">${s.quizIndex >= s.newIds.length ? "释义错题加练" : `今日 ${c.percent}%`}</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${c.percent}%"></div></div>
        ${railHTML()}
        <div class="quiz-title"><span class="quiz-kind">第一轮 · 认词</span><h1 class="word">${esc(word.word)}</h1><p>请选择最准确的中文含义</p></div>
        <div class="options">${options.map(option => {
          let cls = "";
          if (answered && option === word.meaning) cls = "correct";
          else if (answered && option === state.selectedAnswer) cls = "wrong";
          return `<button class="option ${cls}" type="button" data-option="${esc(option)}" ${answered ? "disabled" : ""}>${esc(option)}</button>`;
        }).join("")}<button class="option unknown-option ${answered && state.selectedAnswer === null ? "wrong" : ""}" type="button" id="unknownChoice" ${answered ? "disabled" : ""} aria-label="我不知道，按错误答案记录">我不知道</button></div>
        ${answered ? `<div class="answer-note"><b>${isCorrect ? "回答正确" : "正确答案"}</b>：${esc(word.meaning)}${!isCorrect ? "<br>这个词已加入本轮加练。" : ""}</div><div class="actions single"><button class="primary block" type="button" id="nextQuestion">${s.quizIndex + 1 >= s.quizQueue.length ? "完成今日学习" : "下一题"}</button></div>` : ""}
      </section>`;
      if (!answered) {
        $$("[data-option]").forEach(btn => btn.addEventListener("click", () => answerQuiz(btn.dataset.option)));
        $("#unknownChoice").addEventListener("click", () => answerQuiz(null));
      }
      else $("#nextQuestion").addEventListener("click", nextQuiz);
    }

    async function answerQuiz(answer) {
      if (state.quizAnswered) return;
      const word = currentWord();
      const correct = answer !== null && answer === word.meaning;
      state.quizAnswered = true;
      state.selectedAnswer = answer;
      const s = state.session;
      if (correct) s.quizCorrect++;
      else {
        s.quizWrong++;
        s.quizRetries[word.id] = (s.quizRetries[word.id] || 0) + 1;
        if (s.quizRetries[word.id] === 1) s.quizQueue.push(word.id);
      }
      s.quizAnswers.push({ type: "choice", wordId: word.id, answer: answer === null ? "unknown" : answer, unknown: answer === null, correct, at: Date.now() });
      const key = `${state.book.id}:${word.id}`;
      const progress = await get("progress", key) || { key, bookId: state.book.id, wordId: word.id, reviewCount: 0, exposures: 0, correct: 0, wrong: 0 };
      progress[correct ? "correct" : "wrong"] = (progress[correct ? "correct" : "wrong"] || 0) + 1;
      progress.lastTestDate = localDate();
      progress.lastTestAt = Date.now();
      if (!correct) markForConsolidation(progress, "fuzzy");
      progress.mastery = Math.max(0, Math.min(100, Math.round(((progress.correct || 0) * 2 + (progress.reviewCount || 0)) / Math.max(1, (progress.correct || 0) * 2 + (progress.reviewCount || 0) + (progress.wrong || 0) * 2) * 100)));
      await put("progress", progress);
      await put("sessions", s);
      renderQuiz();
    }

    function normalizeSpelling(value) {
      return String(value || "").trim().toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, " ");
    }

    function renderSpellingQuiz() {
      const word = currentWord();
      if (!word) { advanceStage(); return; }
      const s = state.session;
      const answered = state.quizAnswered;
      const isCorrect = normalizeSpelling(state.selectedAnswer) === normalizeSpelling(word.word);
      const c = sessionCounts();
      main.innerHTML = `<section class="screen">
        <div class="today-head"><div><p class="eyebrow">QUIZ · SPELLING</p><h2>拼写测验 <span class="sub">${s.quizIndex + 1} / ${s.quizQueue.length}</span></h2></div><div class="completion">${s.quizIndex >= s.newIds.length ? "拼写错题加练" : `今日 ${c.percent}%`}</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${c.percent}%"></div></div>
        ${railHTML()}
        <div class="card spelling-card">
          <span class="quiz-kind">第二轮 · 拼写</span>
          <p class="spelling-hint">根据中文意思写出英文单词</p>
          <div class="spelling-meaning">${esc(word.meaning)}</div>
          <div class="spelling-hint spelling-meta"><span>${word.word.length} 个字母</span>${word.phonetic ? phoneticWithAudioHTML(word, true) : ""}</div>
          <form class="spelling-form" id="spellingForm">
            <input class="spelling-input ${answered ? (isCorrect ? "correct" : "wrong") : ""}" id="spellingInput" name="spelling" type="text" value="${esc(state.selectedAnswer || "")}" placeholder="输入英文单词" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" ${answered ? "disabled" : ""} aria-label="输入对应英文单词">
          </form>
          ${answered ? `<div class="spelling-answer">${isCorrect ? "拼写正确" : `正确拼写是 <b>${esc(word.word)}</b>${state.selectedAnswer ? `<br>你的答案：${esc(state.selectedAnswer)}` : ""}`}${word.phonetic ? phoneticWithAudioHTML(word, true) : ""}</div>` : ""}
        </div>
        ${answered ? `<div class="actions single"><button class="primary block" type="button" id="nextQuestion">${s.quizIndex + 1 >= s.quizQueue.length ? "完成今日学习" : "下一题"}</button></div>` : `<div class="actions"><button class="secondary" type="button" id="skipSpelling">不会</button><button class="primary" type="submit" form="spellingForm">提交拼写</button></div>`}
      </section>`;
      if (answered) {
        $("#nextQuestion").addEventListener("click", nextQuiz);
      } else {
        $("#spellingForm").addEventListener("submit", event => { event.preventDefault(); answerSpelling($("#spellingInput").value); });
        $("#skipSpelling").addEventListener("click", () => answerSpelling(""));
        requestAnimationFrame(() => $("#spellingInput")?.focus());
      }
    }

    async function answerSpelling(answer) {
      if (state.quizAnswered) return;
      const word = currentWord();
      const correct = normalizeSpelling(answer) === normalizeSpelling(word.word);
      state.quizAnswered = true;
      state.selectedAnswer = String(answer || "").trim();
      const s = state.session;
      if (correct) {
        s.quizCorrect++;
        s.spellingCorrect++;
      } else {
        s.quizWrong++;
        s.spellingWrong++;
        s.spellingRetries[word.id] = (s.spellingRetries[word.id] || 0) + 1;
        if (s.spellingRetries[word.id] === 1) s.quizQueue.push(word.id);
      }
      s.quizAnswers.push({ type: "spelling", wordId: word.id, answer: state.selectedAnswer, correct, at: Date.now() });
      const key = `${state.book.id}:${word.id}`;
      const progress = await get("progress", key) || { key, bookId: state.book.id, wordId: word.id, reviewCount: 0, exposures: 0, correct: 0, wrong: 0 };
      progress[correct ? "correct" : "wrong"] = (progress[correct ? "correct" : "wrong"] || 0) + 1;
      progress[correct ? "spellingCorrect" : "spellingWrong"] = (progress[correct ? "spellingCorrect" : "spellingWrong"] || 0) + 1;
      progress.lastTestDate = localDate();
      progress.lastTestAt = Date.now();
      if (!correct) markForConsolidation(progress, "spelling");
      progress.mastery = Math.max(0, Math.min(100, Math.round(((progress.correct || 0) * 2 + (progress.reviewCount || 0)) / Math.max(1, (progress.correct || 0) * 2 + (progress.reviewCount || 0) + (progress.wrong || 0) * 2) * 100)));
      await put("progress", progress);
      await put("sessions", s);
      renderSpellingQuiz();
    }

    async function nextQuiz() {
      state.session.quizIndex++;
      state.quizAnswered = false;
      state.selectedAnswer = null;
      await advanceStage();
    }

    async function saveActivity(s, completed = true) {
      const id = `${s.bookId}:${s.date}`;
      const freshIds = new Set(s.freshIds || s.newIds || []);
      const learned = [...new Set(s.learnDone || [])].filter(wordId => freshIds.has(wordId)).length;
      await put("activity", { id, bookId: s.bookId, date: s.date, completed: Boolean(completed), reviewed: s.reviewDone.length, learned, quizCorrect: s.quizCorrect, quizWrong: s.quizWrong, spellingCorrect: s.spellingCorrect || 0, spellingWrong: s.spellingWrong || 0, updatedAt: Date.now(), completedAt: completed ? (s.completedAt || Date.now()) : null });
    }

    function renderSummary() {
      const s = state.session;
      const totalQuiz = s.quizCorrect + s.quizWrong;
      const accuracy = totalQuiz ? Math.round(s.quizCorrect / totalQuiz * 100) : 100;
      main.innerHTML = `<section class="screen">
        <p class="eyebrow">DAILY COMPLETE</p>
        <div class="card summary-card">
          <div class="summary-mark">✓</div><h1>今天完成了</h1><p class="sub">复习、学习、测验全部结束。下次学习会先复习最近一次学过的词。</p>
          <div class="score-grid"><div class="score-item"><b>${s.reviewDone.length}</b><small>已复习</small></div><div class="score-item"><b>${s.learnDone.length}</b><small>新学词</small></div><div class="score-item"><b>${accuracy}%</b><small>综合正确率</small></div></div>
          <button class="primary block" type="button" id="viewStats">查看学习统计</button>
        </div>
      </section>`;
      $("#viewStats").addEventListener("click", () => { state.tab = "stats"; $$(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === "stats")); render(); });
    }

    async function renderReview() {
      const progress = (await getAll("progress")).filter(p => p.bookId === state.book.id);
      const progressByWord = new Map(progress.map(p => [p.wordId, p]));
      let words;
      if (state.reviewFilter === "consolidate") {
        words = state.book.words.filter(word => {
          const item = progressByWord.get(word.id);
          return item && !item.skippedAt && consolidationTypes(item).length > 0;
        });
        words.sort((a, b) => consolidationTime(progressByWord.get(b.id)) - consolidationTime(progressByWord.get(a.id)) || a.word.localeCompare(b.word));
      } else if (state.reviewFilter === "unlearned") {
        words = state.book.words.filter(word => {
          const item = progressByWord.get(word.id);
          return !item?.skippedAt && (!item?.learnedDate || item.relearnQueuedAt);
        });
        words.sort((a, b) => {
          const aQueued = progressByWord.get(a.id)?.relearnQueuedAt || 0;
          const bQueued = progressByWord.get(b.id)?.relearnQueuedAt || 0;
          if (Boolean(aQueued) !== Boolean(bQueued)) return aQueued ? 1 : -1;
          return aQueued && bQueued ? aQueued - bQueued : 0;
        });
      } else {
        words = state.book.words.filter(word => {
          const item = progressByWord.get(word.id);
          return item?.learnedDate && !item.relearnQueuedAt && !item.skippedAt;
        });
        words.sort((a, b) => progressByWord.get(b.id).learnedDate.localeCompare(progressByWord.get(a.id).learnedDate) || a.word.localeCompare(b.word));
      }
      const emptyCopy = state.reviewFilter === "consolidate"
        ? { title: "暂时没有需要巩固的单词", body: "复习时没记住、释义选择错误或拼写错误的词会出现在这里。" }
        : state.reviewFilter === "learned"
          ? { title: "还没有已学单词", body: "完成学习后，可以在这里回顾并安排再次学习。" }
          : { title: "没有待学习单词", body: "词书中的单词已学完，或已设为不再学习。" };
      main.innerHTML = `<section class="screen">
        <div class="section-head"><div><p class="eyebrow">LOOK BACK</p><h1>回顾单词</h1></div><span class="review-result-count" id="reviewResultCount">${words.length} 个词</span></div>
        <div class="review-controls">
          <div class="review-tabs" role="tablist" aria-label="回顾单词范围">
            <button class="review-filter ${state.reviewFilter === "consolidate" ? "active" : ""}" type="button" data-review-filter="consolidate">巩固</button>
            <button class="review-filter ${state.reviewFilter === "learned" ? "active" : ""}" type="button" data-review-filter="learned">已学</button>
            <button class="review-filter ${state.reviewFilter === "unlearned" ? "active" : ""}" type="button" data-review-filter="unlearned">未学</button>
          </div>
          <input class="review-search" id="reviewSearch" type="search" value="${esc(state.reviewQuery)}" placeholder="搜索单词或中文释义" aria-label="搜索当前单词列表">
        </div>
        <div class="review-list" id="reviewList">${words.length ? words.map(word => {
          const p = progressByWord.get(word.id);
          const types = consolidationTypes(p);
          const learnedStatus = p?.learnedDate ? (p.learnedDate === localDate() ? "今天学过" : `${dateLabel(p.learnedDate)} 学过`) : "学习日期未知";
          const statusLabel = state.reviewFilter === "consolidate"
            ? learnedStatus
            : state.reviewFilter === "unlearned"
            ? (p?.relearnQueuedAt ? "已排到末尾" : "待学习")
            : learnedStatus;
          const action = state.reviewFilter === "consolidate"
            ? `<div class="review-action-group"><button class="review-action remember" type="button" data-consolidated-word="${esc(word.id)}" aria-label="将 ${esc(word.word)} 标记为已记住">记住了</button><button class="review-action relearn" type="button" data-relearn-word="${esc(word.id)}" aria-label="将 ${esc(word.word)} 排到待学习列表末尾">再学</button></div>`
            : state.reviewFilter === "learned"
            ? `<button class="review-action relearn" type="button" data-relearn-word="${esc(word.id)}" aria-label="将 ${esc(word.word)} 排到待学习列表末尾">再学</button>`
            : state.reviewFilter === "unlearned"
              ? `<button class="review-action skip" type="button" data-skip-word="${esc(word.id)}" aria-label="不再学习 ${esc(word.word)}">不学</button>`
              : "";
          const wordLength = Array.from(word.word).length;
          const wordSizeClass = wordLength >= 22 ? "is-very-long" : wordLength >= 16 ? "is-long" : "";
          const typeTags = state.reviewFilter === "consolidate" ? `<div class="review-tags">${types.map(type => `<span class="review-tag ${type}">${type === "spelling" ? "拼写错误" : "记忆模糊"}</span>`).join("")}</div>` : "";
          const searchText = `${word.word} ${word.phonetic} ${word.meaning} ${word.analysis} ${(word.phrases || []).map(x => `${x.en} ${x.zh}`).join(" ")} ${word.etymology?.root || ""} ${word.etymology?.explanation || ""}`.toLowerCase();
          return `<details class="review-card" data-review-search="${esc(searchText)}">
            <summary><div><div class="review-word"><b class="${wordSizeClass}">${esc(word.word)}</b>${word.phonetic ? phoneticWithAudioHTML(word, true) : ""}</div><p class="review-meaning">${esc(word.meaning)}</p>${typeTags}</div><div class="review-meta">${hasRecordedAudio(word) ? `<button class="mini-audio" type="button" data-review-audio="${esc(word.id)}" aria-label="播放 ${esc(word.word)} 的录制发音">▶</button>` : ""}${action}<span>${statusLabel}</span></div></summary>
            <div class="review-detail">${analysisHTML(word.analysis)}${phraseSectionHTML(word, true)}${word.examples.map(x => `<div class="example"><p>${highlightWord(x.en, word.word)}</p><small>${esc(x.zh)}</small></div>`).join("")}<div class="chip-list">${word.synonyms.map(x => `<span class="chip"><b>${esc(x.word)}</b>${x.note ? ` · ${esc(x.note)}` : ""}</span>`).join("")}${word.confusables.map(x => `<span class="chip"><b>${esc(x.word)}</b>${x.note ? ` · ${esc(x.note)}` : ""}</span>`).join("")}</div>${etymologySectionHTML(word, true)}</div>
          </details>`;
        }).join("") : `<div class="card empty"><h2>${emptyCopy.title}</h2><p>${emptyCopy.body}</p>${state.reviewFilter === "unlearned" ? "" : `<button class="primary small-button" type="button" id="goStudy">去今日学习</button>`}</div>`}</div>
      </section>`;
      $$("[data-review-filter]").forEach(btn => btn.addEventListener("click", () => { state.reviewFilter = btn.dataset.reviewFilter; state.reviewQuery = ""; renderReview(); }));
      $$("[data-review-audio]").forEach(btn => btn.addEventListener("click", event => {
        event.preventDefault(); event.stopPropagation();
        const word = state.book.words.find(item => item.id === btn.dataset.reviewAudio);
        if (word) playAudio(word, btn);
      }));
      $$("[data-relearn-word]").forEach(btn => btn.addEventListener("click", async event => {
        event.preventDefault(); event.stopPropagation();
        btn.disabled = true;
        await queueWordForRelearning(btn.dataset.relearnWord);
      }));
      $$("[data-skip-word]").forEach(btn => btn.addEventListener("click", async event => {
        event.preventDefault(); event.stopPropagation();
        btn.disabled = true;
        await skipWord(btn.dataset.skipWord);
      }));
      $$("[data-consolidated-word]").forEach(btn => btn.addEventListener("click", async event => {
        event.preventDefault(); event.stopPropagation();
        btn.disabled = true;
        await clearConsolidation(btn.dataset.consolidatedWord);
      }));
      const search = $("#reviewSearch");
      search.addEventListener("input", () => {
        state.reviewQuery = search.value;
        const query = search.value.trim().toLowerCase();
        let visible = 0;
        $$("[data-review-search]").forEach(card => { const show = !query || card.dataset.reviewSearch.includes(query); card.classList.toggle("hidden", !show); if (show) visible++; });
        $("#reviewResultCount").textContent = `${visible} 个词`;
      });
      if (state.reviewQuery) search.dispatchEvent(new Event("input"));
      const goStudy = $("#goStudy");
      if (goStudy) goStudy.addEventListener("click", () => { state.tab = "today"; $$(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === "today")); render(); });
    }

    async function clearConsolidation(wordId) {
      const word = state.book.words.find(item => item.id === wordId);
      const key = `${state.book.id}:${wordId}`;
      const progress = await get("progress", key);
      if (!word || !progress) return;
      progress.consolidation = {};
      progress.consolidationClearedAt = Date.now();
      await put("progress", progress);
      await renderReview();
      toast(`“${word.word}”已移出巩固列表`);
    }

    async function queueWordForRelearning(wordId) {
      const word = state.book.words.find(item => item.id === wordId);
      if (!word) return;
      const key = `${state.book.id}:${wordId}`;
      const progress = await get("progress", key);
      if (!progress?.learnedDate) return;
      progress.relearnQueuedAt = Date.now();
      delete progress.skippedAt;
      if (consolidationTypes(progress).length) {
        progress.consolidation = {};
        progress.consolidationRelearnedAt = Date.now();
      }
      await put("progress", progress);
      await renderReview();
      toast(`“${word.word}”已排到待学习列表末尾`);
    }

    function withoutFutureWord(items, index, wordId) {
      return [...items.slice(0, index), ...items.slice(index).filter(id => id !== wordId)];
    }

    async function skipWord(wordId) {
      const word = state.book.words.find(item => item.id === wordId);
      if (!word) return;
      const key = `${state.book.id}:${wordId}`;
      const progress = await get("progress", key) || { key, bookId: state.book.id, wordId, reviewCount: 0, exposures: 0, correct: 0, wrong: 0 };
      progress.skippedAt = Date.now();
      delete progress.relearnQueuedAt;
      await put("progress", progress);

      const s = state.session;
      const previous = JSON.stringify([s.newIds, s.reviewIds, s.learnQueue, s.quizQueue]);
      s.newIds = s.newIds.filter(id => id !== wordId);
      s.reviewIds = withoutFutureWord(s.reviewIds, s.reviewIndex, wordId);
      s.learnQueue = withoutFutureWord(s.learnQueue, s.learnIndex, wordId);
      s.quizQueue = withoutFutureWord(s.quizQueue, s.quizIndex, wordId);
      const changed = previous !== JSON.stringify([s.newIds, s.reviewIds, s.learnQueue, s.quizQueue]);
      if (changed) await put("sessions", s);

      const queueEnded = (s.stage === "review" && s.reviewIndex >= s.reviewIds.length)
        || (s.stage === "learn" && s.learnIndex >= s.learnQueue.length)
        || (s.stage === "quiz" && s.quizIndex >= s.quizQueue.length);
      if (queueEnded && !s.completed) await advanceStage();
      else await renderReview();
      toast(`“${word.word}”已从学习计划中移除`);
    }

    function shiftMonth(monthKey, delta) {
      const [year, month] = monthKey.split("-").map(Number);
      const next = new Date(year, month - 1 + delta, 1);
      return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthLabel(monthKey) {
      const [year, month] = monthKey.split("-").map(Number);
      return `${year}年${month}月`;
    }

    function learningCalendarHTML(activity) {
      const [year, month] = state.statsMonth.split("-").map(Number);
      const firstWeekday = (new Date(year, month - 1, 1).getDay() + 6) % 7;
      const days = new Date(year, month, 0).getDate();
      const learnedByDate = new Map(activity.map(row => [row.date, row.learned || 0]));
      const cells = Array.from({ length: firstWeekday }, () => `<div class="calendar-day blank" aria-hidden="true"></div>`);
      for (let day = 1; day <= days; day++) {
        const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const count = learnedByDate.get(date) || 0;
        cells.push(`<div class="calendar-day ${date === localDate() ? "today" : ""} ${count ? "has-learning" : ""}" aria-label="${month}月${day}日，新学 ${count} 个词"><span>${day}</span>${count ? `<b>${count}</b><small>新词</small>` : `<small>—</small>`}</div>`);
      }
      return cells.join("");
    }

    function statsQuizOptions(word, sourceWords = state.book.words) {
      const meanings = [...new Set(sourceWords.map(item => item.meaning).filter(Boolean))];
      const distractors = shuffle(meanings.filter(meaning => meaning !== word.meaning)).slice(0, 3);
      const fallback = ["逐渐减少；缩小", "明确表达；阐明", "相互依赖的；关联的", "谨慎而有条理地处理"];
      for (const meaning of fallback) {
        if (distractors.length >= 3) break;
        if (meaning !== word.meaning && !distractors.includes(meaning)) distractors.push(meaning);
      }
      return shuffle([word.meaning, ...distractors.slice(0, 3)]);
    }

    async function startStatsQuiz(scope = "all") {
      if (state.statsQuiz) return;
      const bookId = state.book.id;
      let pool = state.book.words;
      if (scope === "learned") {
        const progress = (await getAll("progress")).filter(item => item.bookId === bookId);
        if (state.book.id !== bookId || state.statsQuiz) return;
        const learnedIds = new Set(progress.filter(item => item.learnedDate && !item.relearnQueuedAt && !item.skippedAt).map(item => item.wordId));
        pool = state.book.words.filter(word => learnedIds.has(word.id));
      }
      if (pool.length < 100) {
        toast(scope === "learned" ? `已学习 ${pool.length} 个单词，满 100 个后可用` : "当前词书不足 100 个单词，无法开始测验");
        return;
      }
      const words = shuffle(pool).slice(0, 100);
      state.statsQuiz = {
        id: `${state.book.id}:test:${Date.now()}`,
        bookId: state.book.id, scope,
        questions: words.map(word => ({ wordId: word.id, options: statsQuizOptions(word, pool) })),
        index: 0, correct: 0, answers: [], answered: false, selected: null, startedAt: Date.now(), completed: false
      };
      renderStatsQuiz();
    }

    function renderStatsQuiz() {
      const quiz = state.statsQuiz;
      if (!quiz) return renderStats();
      if (quiz.completed) {
        main.innerHTML = `<section class="screen">
          <p class="eyebrow">100-WORD TEST</p>
          <div class="card summary-card">
            <div class="summary-mark">✓</div><h1>测验完成</h1>
            <div class="test-result-score">${quiz.score}</div><p class="sub">${quiz.scope === "learned" ? "已学单词抽题" : "全词书抽题"} · 满分 100 分 · 答对 ${quiz.correct} 题 · 答错 ${quiz.questions.length - quiz.correct} 题</p>
            <div class="actions"><button class="secondary" type="button" id="restartStatsQuiz">再测一次</button><button class="primary" type="button" id="backToStats">返回统计</button></div>
          </div>
        </section>`;
        $("#restartStatsQuiz").addEventListener("click", () => { state.statsQuiz = null; startStatsQuiz(quiz.scope || "all"); });
        $("#backToStats").addEventListener("click", () => { state.statsQuiz = null; renderStats(); });
        return;
      }
      const question = quiz.questions[quiz.index];
      const word = state.book.words.find(item => item.id === question.wordId);
      if (!word) { quiz.index++; return renderStatsQuiz(); }
      const percent = Math.round((quiz.index + (quiz.answered ? 1 : 0)) / quiz.questions.length * 100);
      const isCorrect = quiz.selected !== null && quiz.selected === word.meaning;
      main.innerHTML = `<section class="screen">
        <div class="standalone-quiz-head"><div><p class="eyebrow">100-WORD TEST</p><h1>${quiz.scope === "learned" ? "已学单词测验" : "全词书测验"}</h1></div><button class="ghost" type="button" id="exitStatsQuiz">退出测验</button></div>
        <div class="today-head test-progress"><div><h2>第 ${quiz.index + 1} 题 <span class="sub">/ ${quiz.questions.length}</span></h2></div><div class="completion">当前答对 ${quiz.correct} 题</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
        <div class="quiz-title"><span class="quiz-kind">选择正确释义</span><h1 class="word">${esc(word.word)}</h1>${word.phonetic ? `<div class="quiz-phonetic">${phoneticWithAudioHTML(word, true)}</div>` : ""}</div>
        <div class="options">${question.options.map((option, optionIndex) => {
          let cls = "";
          if (quiz.answered && option === word.meaning) cls = "correct";
          else if (quiz.answered && option === quiz.selected) cls = "wrong";
          return `<button class="option ${cls}" type="button" data-stats-option-index="${optionIndex}" ${quiz.answered ? "disabled" : ""}>${esc(option)}</button>`;
        }).join("")}<button class="option unknown-option ${quiz.answered && quiz.selected === null ? "wrong" : ""}" type="button" id="unknownStatsChoice" ${quiz.answered ? "disabled" : ""} aria-label="我不知道，按错误答案记录">我不知道</button></div>
        ${quiz.answered ? `<div class="answer-note"><b>${isCorrect ? "回答正确" : "正确答案"}</b>：${esc(word.meaning)}</div><div class="actions single"><button class="primary block" type="button" id="nextStatsQuestion">${quiz.index + 1 >= quiz.questions.length ? "查看成绩" : "下一题"}</button></div>` : ""}
      </section>`;
      $$("[data-stats-option-index]").forEach(button => button.addEventListener("click", () => answerStatsQuiz(question.options[Number(button.dataset.statsOptionIndex)])));
      $("#unknownStatsChoice")?.addEventListener("click", () => answerStatsQuiz(null));
      $("#nextStatsQuestion")?.addEventListener("click", nextStatsQuizQuestion);
      $("#exitStatsQuiz").addEventListener("click", () => {
        if (!quiz.answers.length || confirm("退出后本次测验进度不会保存，确定退出吗？")) {
          state.statsQuiz = null;
          renderStats();
        }
      });
    }

    function answerStatsQuiz(answer) {
      const quiz = state.statsQuiz;
      if (!quiz || quiz.answered) return;
      const question = quiz.questions[quiz.index];
      const word = state.book.words.find(item => item.id === question.wordId);
      const correct = answer !== null && answer === word.meaning;
      quiz.answered = true;
      quiz.selected = answer;
      if (correct) quiz.correct++;
      quiz.answers.push({ wordId: word.id, unknown: answer === null, correct });
      renderStatsQuiz();
    }

    async function nextStatsQuizQuestion() {
      const quiz = state.statsQuiz;
      if (!quiz?.answered) return;
      if (quiz.index + 1 < quiz.questions.length) {
        quiz.index++;
        quiz.answered = false;
        quiz.selected = null;
        renderStatsQuiz();
        return;
      }
      quiz.completed = true;
      quiz.completedAt = Date.now();
      quiz.score = Math.round(quiz.correct / quiz.questions.length * 100);
      await put("quizResults", { id: quiz.id, bookId: quiz.bookId, scope: quiz.scope || "all", date: localDate(), score: quiz.score, total: 100, correct: quiz.correct, completedAt: quiz.completedAt });
      renderStatsQuiz();
    }

    async function renderStats() {
      if (state.statsQuiz) return renderStatsQuiz();
      const renderBookId = state.book.id;
      const progress = (await getAll("progress")).filter(p => p.bookId === renderBookId);
      const activity = (await getAll("activity")).filter(a => a.bookId === renderBookId);
      const quizResults = (await getAll("quizResults")).filter(result => result.bookId === renderBookId).sort((a, b) => b.completedAt - a.completedAt).slice(0, 5);
      if (state.tab !== "stats" || state.book.id !== renderBookId || state.statsQuiz) return;
      const learned = progress.filter(p => p.learnedDate && !p.relearnQueuedAt && !p.skippedAt).length;
      const skipped = progress.filter(p => p.skippedAt).length;
      const target = Math.max(0, state.book.words.length - skipped);
      const mastered = progress.filter(p => p.learnedDate && !p.relearnQueuedAt && !p.skippedAt && (p.mastery || 0) >= 75).length;
      const correct = progress.reduce((n, p) => n + (p.correct || 0), 0);
      const wrong = progress.reduce((n, p) => n + (p.wrong || 0), 0);
      const spellingCorrect = progress.reduce((n, p) => n + (p.spellingCorrect || 0), 0);
      const spellingWrong = progress.reduce((n, p) => n + (p.spellingWrong || 0), 0);
      const accuracy = correct + wrong ? Math.round(correct / (correct + wrong) * 100) : 0;
      const spellingAccuracy = spellingCorrect + spellingWrong ? Math.round(spellingCorrect / (spellingCorrect + spellingWrong) * 100) : 0;
      const currentMonth = localDate().slice(0, 7);
      main.innerHTML = `<section class="screen">
        <div class="section-head"><div><p class="eyebrow">PROGRESS</p><h1>学习统计</h1></div><span class="sub">${esc(state.book.name)}</span></div>
        <div class="stat-grid"><div class="stat-card"><b>${learned}</b><small>已学 / ${target}</small></div><div class="stat-card"><b>${mastered}</b><small>已掌握词</small></div><div class="stat-card"><b>${accuracy}%</b><small>综合正确率</small></div><div class="stat-card"><b>${spellingAccuracy}%</b><small>拼写正确率</small></div><div class="stat-card"><b>${spellingCorrect + spellingWrong}</b><small>累计拼写次数</small></div><div class="stat-card"><b>${activity.filter(a => a.completed).length}</b><small>完成天数</small></div></div>
        <div class="card calendar-card">
          <div class="calendar-head"><div><h2>学习日历</h2><p class="sub">每天新学单词数量</p></div><div class="month-switch"><button type="button" id="previousMonth" aria-label="上个月">‹</button><b>${monthLabel(state.statsMonth)}</b><button type="button" id="nextMonth" aria-label="下个月" ${state.statsMonth >= currentMonth ? "disabled" : ""}>›</button></div></div>
          <div class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="learning-calendar">${learningCalendarHTML(activity)}</div>
        </div>
        <div class="card stats-quiz-card">
          <div class="stats-quiz-head"><div><h2>100 词学习测验</h2><p class="sub">选择抽题范围，每题 1 分，满分 100 分。</p></div></div>
          <div class="quiz-source-options">
            <button class="quiz-source-option" type="button" data-quiz-scope="all" ${state.book.words.length < 100 ? "disabled" : ""}><span><b>从全词书抽 100 个</b><small>当前词书共 ${state.book.words.length} 个单词</small></span><span class="quiz-source-action">开始 ›</span></button>
            <button class="quiz-source-option" type="button" data-quiz-scope="learned" ${learned < 100 ? "disabled" : ""}><span><b>从已学习的单词抽 100 个</b><small>已学习 ${learned} 个${learned < 100 ? ` · 还差 ${100 - learned} 个可用` : " · 随机抽题"}</small></span><span class="quiz-source-action">${learned < 100 ? "暂不可用" : "开始 ›"}</span></button>
          </div>
          <div class="recent-scores"><h3>最近 5 次成绩</h3>${quizResults.length ? quizResults.map(result => `<div class="score-row"><span>${new Date(result.completedAt).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} · ${result.scope === "learned" ? "已学词" : "全词书"}</span><b>${result.score} / 100</b></div>`).join("") : `<p class="sub">完成测验后，成绩会显示在这里。</p>`}</div>
        </div>
      </section>`;
      $("#previousMonth").addEventListener("click", () => { state.statsMonth = shiftMonth(state.statsMonth, -1); renderStats(); });
      $("#nextMonth").addEventListener("click", () => { if (state.statsMonth < currentMonth) { state.statsMonth = shiftMonth(state.statsMonth, 1); renderStats(); } });
      $$("[data-quiz-scope]").forEach(button => button.addEventListener("click", () => startStatsQuiz(button.dataset.quizScope)));
    }

    async function renderPlan() {
      const progress = (await getAll("progress")).filter(p => p.bookId === state.book.id);
      const progressByWord = new Map(progress.map(p => [p.wordId, p]));
      const skipped = progress.filter(p => p.skippedAt).length;
      const target = Math.max(0, state.book.words.length - skipped);
      const learned = progress.filter(p => p.learnedDate && !p.relearnQueuedAt && !p.skippedAt).length;
      const remaining = state.book.words.filter(word => {
        const item = progressByWord.get(word.id);
        return !item?.skippedAt && (!item?.learnedDate || item.relearnQueuedAt);
      }).length;
      const days = Math.ceil(remaining / state.settings.dailyNew);
      const finish = new Date(); finish.setDate(finish.getDate() + days);
      const pct = target ? Math.round(learned / target * 100) : 100;
      main.innerHTML = `<section class="screen">
        <div class="section-head"><div><p class="eyebrow">PLAN</p><h1>学习计划</h1></div></div>
        <div class="card plan-card"><div class="plan-row"><div><h3>每天学习新词</h3><p>修改后从下一次生成当日任务起生效</p></div><div class="stepper"><button type="button" id="minusDaily" aria-label="减少每日词数">−</button><b>${state.settings.dailyNew}</b><button type="button" id="plusDaily" aria-label="增加每日词数">+</button></div></div>
          <div class="plan-row"><div><h3>预计完成</h3><p>剩余 ${remaining} 词，约 ${days} 天${skipped ? ` · 已设为不学 ${skipped} 词` : ""}</p></div><b>${finish.toLocaleDateString("zh-CN", { month: "short", day: "numeric" })}</b></div>
          <div class="plan-meter"><div class="plan-row"><span class="sub">整本进度</span><b>${pct}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        </div>
        <div class="card plan-card"><div class="plan-row"><div><h3>单词书管理</h3><p>导入、切换或查看 JSON 格式</p></div><button class="secondary small-button" type="button" id="manageBooks">管理</button></div>
          <div class="plan-row"><div><h3>导出学习数据</h3><p>备份当前词书的进度与历史</p></div><button class="ghost small-button" type="button" id="exportProgress">导出</button></div></div>
        <div class="card plan-card"><div class="plan-row"><div><h3>重置当前词书</h3><p>删除该词书的学习进度、测验成绩和每日记录</p></div><button class="danger small-button" type="button" id="resetProgress">重置</button></div></div>
      </section>`;
      $("#minusDaily").addEventListener("click", () => changeDaily(-1));
      $("#plusDaily").addEventListener("click", () => changeDaily(1));
      $("#manageBooks").addEventListener("click", openBooks);
      $("#exportProgress").addEventListener("click", exportProgress);
      $("#resetProgress").addEventListener("click", resetProgress);
    }

    async function changeDaily(delta) {
      state.settings.dailyNew = Math.max(1, Math.min(50, state.settings.dailyNew + delta));
      await put("meta", state.settings);
      renderPlan();
    }

    async function openBooks() {
      state.books = await getBookCatalog();
      $("#bookList").innerHTML = state.books.map(book => `<button class="book-item ${book.id === state.book.id ? "active" : ""}" type="button" data-book-id="${esc(book.id)}"><div><h3>${esc(book.name)}</h3><p>${book.wordCount} 个词 · ${esc(book.description)}</p></div>${book.id === state.book.id ? `<span class="check">✓</span>` : ""}</button>`).join("");
      $$("[data-book-id]").forEach(btn => btn.addEventListener("click", () => switchBook(btn.dataset.bookId)));
      bookDialog.showModal();
    }

    async function switchBook(id) {
      if (id === state.book.id) { bookDialog.close(); return; }
      const catalogBook = state.books.find(book => book.id === id);
      if (!catalogBook) return;
      const previousBook = state.book;
      const previousSession = state.session;
      const previousActiveBookId = state.settings.activeBookId;
      const buttons = $$("[data-book-id]");
      buttons.forEach(button => { button.disabled = true; });
      bookDialog.close();
      setLoading(true, `正在加载《${catalogBook.name}》`);
      await waitForPaint();
      let loadFailed = false;
      try {
        const book = await loadBookById(id);
        state.book = book;
        state.settings.activeBookId = id;
        await put("meta", state.settings);
        state.session = await getSession();
        state.tab = "today"; state.flowOpen = false; state.revealed = false; state.statsQuiz = null; state.statsMonth = localDate().slice(0, 7);
        $$(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === "today"));
        await refreshHeader();
        render();
        toast(`已切换到《${book.name}》`);
      } catch (error) {
        loadFailed = true;
        console.error(error);
        state.book = previousBook;
        state.session = previousSession;
        state.settings.activeBookId = previousActiveBookId;
        try { await put("meta", state.settings); } catch (restoreError) { console.error("无法恢复原词书设置", restoreError); }
        buttons.forEach(button => { button.disabled = false; });
        toast(`无法载入《${catalogBook.name}》`);
      } finally {
        setLoading(false);
      }
      if (loadFailed) {
        const dialogTitle = $("#bookDialog .dialog-head h2");
        dialogTitle.textContent = `《${catalogBook.name}》加载失败，请重试`;
        bookDialog.showModal();
        setTimeout(() => { dialogTitle.textContent = "切换单词书"; }, 2600);
      }
    }

    function normalizeBook(raw) {
      if (!raw || typeof raw !== "object" || !Array.isArray(raw.words) || !raw.words.length) throw new Error("JSON 中缺少 words 数组");
      const id = String(raw.id || `book-${Date.now()}`).replace(/[^a-zA-Z0-9_-]/g, "-");
      const words = raw.words.map((item, index) => {
        if (!item || !item.word) throw new Error(`第 ${index + 1} 个单词缺少 word 字段`);
        const list = value => Array.isArray(value) ? value.map(x => typeof x === "string" ? { word: x, note: "" } : { word: x.word || x.term || "", note: x.note || x.meaning || "" }).filter(x => x.word) : [];
        const examples = Array.isArray(item.examples) ? item.examples.map(x => typeof x === "string" ? { en: x, zh: "" } : { en: x.en || x.sentence || "", zh: x.zh || x.translation || "" }).filter(x => x.en) : [];
        const phrases = Array.isArray(item.phrases || item.commonPhrases) ? (item.phrases || item.commonPhrases).map(x => typeof x === "string" ? { en: x, zh: "" } : { en: x.en || x.phrase || x.text || "", zh: x.zh || x.translation || x.explanation || "" }).filter(x => x.en) : [];
        const origin = item.etymology || item.wordOrigin || {};
        const etymology = typeof origin === "string" ? { root: "", rootMeaning: "", explanation: origin, cognates: [], memory: "" } : {
          root: String(origin.root || origin.base || ""), rootMeaning: String(origin.rootMeaning || origin.baseMeaning || ""),
          explanation: String(origin.explanation || origin.origin || ""), cognates: list(origin.cognates || origin.relatedWords), memory: String(origin.memory || origin.memoryTip || "")
        };
        return {
          id: String(item.id || item.word.toLowerCase()).replace(/\s+/g, "-"), word: String(item.word),
          phonetic: String(item.phonetic || item.ipa || ""), audioBase64: String(item.audioBase64 || item.audio || ""),
          meaning: String(item.meaning || item.definition || item.translation || ""),
          analysis: String(item.analysis || item.explanation || ""), phrases, examples, synonyms: list(item.synonyms), confusables: list(item.confusables || item.similarWords), etymology
        };
      });
      const ids = new Set();
      words.forEach(w => { if (ids.has(w.id)) w.id = `${w.id}-${ids.size}`; ids.add(w.id); });
      return { id, name: String(raw.name || raw.title || "导入的单词书"), description: String(raw.description || "自定义 JSON 词书"), builtin: false, importedAt: Date.now(), words };
    }

    async function importBook(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      try {
        const raw = JSON.parse(await file.text());
        const book = normalizeBook(raw);
        const existing = await get("books", book.id);
        if (existing && !confirm(`词书 ID“${book.id}”已存在，是否覆盖？`)) return;
        await put("books", book);
        await saveCustomBookMetadata(book);
        state.books = await getBookCatalog();
        await switchBook(book.id);
        toast(`已导入 ${book.words.length} 个单词`);
      } catch (error) { toast(`导入失败：${error.message || "JSON 格式不正确"}`); }
    }

    function downloadFile(name, data, type = "application/json") {
      const blob = new Blob([data], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadTemplate() {
      const sample = { id: "my-wordbook", name: "我的单词书", description: "JSON 格式样例", words: [{ id: "resilient", word: "resilient", phonetic: "/rɪˈzɪliənt/", audioBase64: "在这里填写MP3文件的Base64字符串", meaning: "adj. 有韧性的；能迅速恢复的", analysis: "resilient 强调人在压力后恢复，或系统在故障后继续工作的能力。它常修饰 person、community、system、economy 和 material。理解时可把“承受冲击”与“随后恢复”看成一个完整过程。", phrases: [{ en: "a resilient system", zh: "有韧性的系统；发生故障后仍能恢复" }, { en: "remain resilient", zh: "在压力或变化中保持韧性" }, { en: "a resilient community", zh: "遭遇冲击后能够恢复的社区" }], examples: [{ en: "A resilient system learns from failure.", zh: "有韧性的系统会从失败中学习。" }, { en: "She remained resilient under pressure.", zh: "她在压力下依然坚韧。" }, { en: "The economy is surprisingly resilient.", zh: "该经济体的韧性出人意料。" }, { en: "Resilient materials return to their original shape.", zh: "有弹性的材料会恢复原状。" }, { en: "The community proved resilient after the storm.", zh: "风暴过后，这个社区展现出强大的恢复力。" }], synonyms: [{ word: "robust", note: "强健稳定的" }], confusables: [{ word: "resistant", note: "抵抗的" }], etymology: { root: "resile", rootMeaning: "v. 弹回；恢复", explanation: "来自拉丁语 resilire，字面含义是“向后跳、弹回”；resile + -ent 构成 resilient。", cognates: [{ word: "resilience", note: "韧性；恢复力" }], memory: "把它想成被压弯后仍会弹回原状。" } }] };
      downloadFile("wordbook-sample.json", JSON.stringify(sample, null, 2));
    }

    async function exportProgress() {
      const progress = (await getAll("progress")).filter(p => p.bookId === state.book.id);
      const sessions = (await getAll("sessions")).filter(s => s.bookId === state.book.id);
      const activity = (await getAll("activity")).filter(a => a.bookId === state.book.id);
      const quizResults = (await getAll("quizResults")).filter(result => result.bookId === state.book.id);
      downloadFile(`${state.book.id}-progress.json`, JSON.stringify({ exportedAt: new Date().toISOString(), book: { id: state.book.id, name: state.book.name }, settings: { dailyNew: state.settings.dailyNew }, progress, sessions, activity, quizResults }, null, 2));
      toast("学习数据已导出");
    }

    async function resetProgress() {
      if (!confirm(`确定重置《${state.book.name}》的全部学习进度吗？此操作无法撤销。`)) return;
      const groups = ["progress", "sessions", "activity", "quizResults"];
      for (const store of groups) {
        const rows = await getAll(store);
        for (const row of rows.filter(x => x.bookId === state.book.id)) await remove(store, row.key || row.id);
      }
      state.session = await getSession();
      state.tab = "today"; state.flowOpen = false; state.statsQuiz = null; state.statsMonth = localDate().slice(0, 7);
      $$(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === "today"));
      await refreshHeader(); render(); toast("当前词书进度已重置");
    }

    init();
  })();
  </script>
</body>
</html>
