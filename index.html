<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="词阶：每天复习、学习、测验，进度保存在本机。">
  <title>词阶 · 每日单词学习</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --ink: #141827;
      --muted: #697083;
      --line: #e3e6eb;
      --indigo: #4f46e5;
      --indigo-dark: #3730a3;
      --indigo-soft: #eef2ff;
      --coral: #ff704d;
      --coral-soft: #fff0eb;
      --green: #158466;
      --green-soft: #e7f7f1;
      --red: #d93d55;
      --red-soft: #fff0f2;
      --shadow: 0 12px 30px rgba(28, 33, 48, .08), 0 2px 8px rgba(28, 33, 48, .05);
      --radius: 20px;
      font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -10%, rgba(79,70,229,.08), transparent 32rem),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(79,70,229,.3);
      outline-offset: 2px;
    }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: rgba(255,255,255,.84);
      box-shadow: 0 0 0 1px rgba(20,24,39,.04), 0 0 60px rgba(20,24,39,.08);
      position: relative;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 72px;
      padding: max(14px, env(safe-area-inset-top)) 18px 12px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--indigo);
      font-size: 25px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand img {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
    }

    .book-switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      height: 42px;
      padding: 0 11px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }
    .book-switch:hover { background: var(--surface-2); }
    .book-switch span {
      overflow: hidden;
      color: #353a49;
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .streak {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: max-content;
      color: #3d4251;
      font-size: 13px;
      font-weight: 650;
    }
    .streak b { color: var(--coral); font-size: 17px; }

    main {
      min-height: calc(100dvh - 72px);
      padding: 22px 18px calc(92px + env(safe-area-inset-bottom));
    }

    .screen { animation: enter .18s ease-out both; }
    @keyframes enter { from { opacity: .25; transform: translateY(5px); } }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--indigo);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: 28px; line-height: 1.2; letter-spacing: -.03em; }
    h2 { margin-bottom: 6px; font-size: 20px; line-height: 1.3; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.65; }

    .today-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .today-number { display: flex; align-items: baseline; gap: 8px; }
    .today-number strong { color: var(--indigo); font-size: 42px; line-height: 1; letter-spacing: -.04em; }
    .today-number span { font-size: 21px; font-weight: 750; }
    .completion { color: var(--muted); font-size: 13px; font-weight: 650; }

    .progress-track {
      height: 8px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8e9ee;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--indigo), #7067f4);
      transition: width .3s ease-out;
    }

    .stage-rail {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 18px;
      padding: 12px 10px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
    }
    .stage-item {
      position: relative;
      min-width: 0;
      padding: 3px 8px;
      text-align: center;
    }
    .stage-item + .stage-item { border-left: 1px solid var(--line); }
    .stage-item small { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
    .stage-item b { font-size: 19px; }
    .stage-item.active small, .stage-item.active b { color: var(--indigo); }
    .stage-item.done::after {
      content: "✓";
      position: absolute;
      top: -3px;
      right: 5px;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .dashboard-card { padding: 20px; }
    .flow-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .flow-row:last-of-type { border-bottom: 0; }
    .flow-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background: var(--indigo-soft);
      color: var(--indigo);
      font-size: 18px;
      font-weight: 800;
    }
    .flow-icon--quiz { background: var(--coral-soft); color: var(--coral); }
    .flow-row h3 { margin: 0 0 2px; font-size: 15px; }
    .flow-row p { margin: 0; color: var(--muted); font-size: 12px; }
    .flow-count { font-size: 22px; font-weight: 800; }

    .primary, .secondary, .danger, .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 19px;
      border-radius: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .primary { border: 1px solid var(--indigo); background: var(--indigo); color: #fff; box-shadow: 0 8px 18px rgba(79,70,229,.2); }
    .primary:hover { background: var(--indigo-dark); }
    .primary:active, .secondary:active, .danger:active, .ghost:active { transform: scale(.98); }
    .secondary { border: 1.5px solid var(--indigo); background: #fff; color: var(--indigo); }
    .secondary:hover { background: var(--indigo-soft); }
    .ghost { border: 1px solid var(--line); background: var(--surface); color: #454a5a; }
    .danger { border: 1px solid #f2bdc5; background: #fff; color: var(--red); }
    .block { width: 100%; }
    .start-button { margin-top: 17px; }
    button:disabled { cursor: default; opacity: .55; transform: none !important; }

    .study-card { overflow: hidden; }
    .study-top {
      padding: 24px 22px 18px;
    }
    .word {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(36px, 11vw, 54px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }
    .pronunciation-row { display: flex; align-items: flex-start; gap: 10px; min-height: 32px; margin-top: 8px; }
    .phonetic-list {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-family: ui-serif, Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
    }
    .phonetic-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 30px; }
    .phonetic-text { min-width: 0; }
    .phonetic-audio-group { display: inline-flex; align-items: center; gap: 5px; }
    .phonetic-audio {
      display: inline-grid;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      place-items: center;
      border: 1px solid #d4d2fa;
      border-radius: 9px;
      background: var(--indigo-soft);
      color: var(--indigo-dark);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    .phonetic-audio:hover { border-color: var(--indigo); background: #e3e5ff; }
    .phonetic-audio.playing { animation: pulse .8s ease-in-out infinite alternate; }
    .phonetic-list.compact { gap: 1px; font-size: 13px; line-height: 1.45; }
    .phonetic-list.compact .phonetic-line { min-height: 26px; }
    .phonetic-list.compact .phonetic-audio { min-width: 26px; height: 26px; padding-inline: 5px; font-size: 11px; }
    .audio-btn {
      flex: 0 0 auto;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--indigo);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 0 0 4px var(--indigo-soft);
      margin-top: 2px;
    }
    .audio-btn.playing { animation: pulse .8s ease-in-out infinite alternate; }
    @keyframes pulse { to { box-shadow: 0 0 0 8px rgba(79,70,229,.08); } }

    .tts-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-left: 6px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      vertical-align: middle;
      transition: background .12s ease, color .12s ease;
    }
    .tts-btn::before { content: "🔊"; }
    .tts-btn.playing { color: var(--indigo); }
    .tts-btn.playing::before { content: "⏸"; }
    .tts-btn:hover { background: var(--indigo-soft); color: var(--indigo); }

    .lookup-word {
      display: inline;
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      text-align: inherit;
      cursor: pointer;
      color: var(--indigo);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-color: rgba(79,70,229,.4);
      text-underline-offset: 2px;
    }
    .lookup-word:hover {
      text-decoration-style: solid;
      text-decoration-color: var(--indigo);
    }

    .search-card {
      padding: 20px;
      margin-bottom: 20px;
    }
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 0 16px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 16px;
      transition: border-color .12s ease, background .12s ease;
    }
    .search-input:focus {
      border-color: var(--indigo);
      background: #fff;
      outline: none;
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-btn {
      flex: 0 0 auto;
      min-height: 48px;
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: var(--indigo);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .12s ease, transform .12s ease;
    }
    .search-btn:hover {
      background: var(--indigo-dark);
    }
    .search-btn:active {
      transform: scale(.98);
    }
    .lookup-result-card {
      margin-top: 20px;
      padding: 24px 22px;
    }
    .lookup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .lookup-not-found {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .lookup-status { margin: 0; }
    .lookup-status:not(:empty) { margin-top: 8px; }
    .lookup-not-found, .lookup-note { overflow-wrap: anywhere; }

    .word-detail { padding: 0 22px; }
    .meaning {
      margin: 0;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      font-size: 17px;
      font-weight: 650;
      line-height: 1.6;
    }
    .analysis { color: #4b5161; font-size: 14px; line-height: 1.7; }
    .analysis-section + .analysis-section { margin-top: 10px; }
    .analysis p, .analysis ul, .analysis ol { margin: 0 0 12px; }
    .analysis > :last-child, .analysis-section > :last-child { margin-bottom: 0; }
    .analysis h1, .analysis h2, .analysis h3, .analysis h4, .analysis h5, .analysis h6 {
      margin: 16px 0 7px;
      color: #30364a;
      font-weight: 750;
      line-height: 1.45;
    }
    .analysis h1 { font-size: 17px; }
    .analysis h2 { font-size: 16px; }
    .analysis h3 { font-size: 15px; }
    .analysis h4, .analysis h5, .analysis h6 { font-size: 14px; }
    .analysis > :first-child, .analysis-section > :first-child { margin-top: 0; }
    .analysis ul, .analysis ol { padding-left: 1.5em; }
    .analysis li + li { margin-top: 4px; }
    .analysis a { color: var(--indigo-dark); text-decoration: underline; overflow-wrap: anywhere; }
    .analysis code { padding: 1px 4px; border-radius: 4px; background: var(--surface-2); font-size: .92em; }
    .analysis-label {
      display: block;
      margin-bottom: 2px;
      color: var(--indigo-dark);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
    }
    .analysis-details summary .analysis-label { margin-bottom: 0; }
    .analysis-details summary.icon-only { justify-content: flex-end; }
    .reveal-placeholder {
      display: grid;
      min-height: 138px;
      place-items: center;
      padding: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
    }

    details.info-section { border-top: 1px solid var(--line); }
    details.info-section summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
      padding: 0 22px;
      list-style: none;
      color: #333847;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }
    details.info-section summary::-webkit-details-marker { display: none; }
    details.info-section summary::after { content: "+"; color: var(--indigo); font-size: 20px; }
    details.info-section[open] summary::after { content: "−"; }
    .detail-body { padding: 0 22px 18px; }
    .example { margin-bottom: 13px; padding-left: 12px; border-left: 3px solid #cfd2ff; }
    .example:last-child { margin-bottom: 0; }
    .example p { margin: 0 0 4px; font-size: 14px; line-height: 1.55; }
    .example small { color: var(--muted); line-height: 1.5; }
    .phrase-item { margin-bottom: 11px; padding: 11px 12px; border-left: 3px solid var(--coral); border-radius: 0 10px 10px 0; background: var(--coral-soft); }
    .phrase-item:last-child { margin-bottom: 0; }
    .phrase-item p { margin: 0 0 4px; color: #303544; font-size: 14px; font-weight: 750; line-height: 1.5; }
    .phrase-item small { color: #6a554f; line-height: 1.55; }
    .etymology-card { padding: 13px 14px; border-radius: 12px; background: var(--indigo-soft); color: #42475a; font-size: 13px; line-height: 1.7; }
    .etymology-card p { margin: 0 0 8px; }
    .etymology-card p:last-child { margin-bottom: 0; }
    .etymology-card b { color: var(--indigo-dark); }
    .word-family { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .family-word { padding: 6px 9px; border-radius: 8px; background: #fff; color: #454a59; }
    .family-word b { color: var(--indigo); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 7px 10px; border-radius: 9px; background: var(--surface-2); color: #444a5a; font-size: 13px; }
    .chip b { color: var(--indigo); }

    .actions {
      position: sticky;
      bottom: calc(72px + env(safe-area-inset-bottom));
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
      gap: 10px;
      margin-top: 14px;
      padding: 10px 0;
      background: linear-gradient(transparent, rgba(244,245,247,.96) 25%);
    }
    .actions.single { grid-template-columns: 1fr; }
    .actions.learn-actions {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .learn-actions > button {
      min-width: 0;
      padding-inline: 5px;
      white-space: nowrap;
      font-size: clamp(12px, 3.8vw, 14px);
    }
    .familiar-button { border-color: #9ed8c7; background: var(--green-soft); color: #0e654e; }
    .familiar-button:hover { border-color: var(--green); background: #d9f2e9; }

    .quiz-title { margin-bottom: 16px; text-align: center; }
    .quiz-title .word { font-size: clamp(38px, 12vw, 52px); }
    .quiz-title p { margin: 8px 0 0; color: var(--muted); }
    .options { display: grid; gap: 10px; }
    .option {
      min-height: 58px;
      padding: 12px 15px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: #303544;
      font-size: 15px;
      font-weight: 620;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
    }
    .option:hover { border-color: #b8b4f6; background: #fafaff; }
    .option.unknown-option { border-style: dashed; background: var(--surface-2); color: var(--muted); font-weight: 750; text-align: center; }
    .option.unknown-option:hover { border-color: #aeb2bf; background: #f0f1f4; color: #444a59; }
    .option.correct { border-color: var(--green); background: var(--green-soft); color: #0e654e; }
    .option.wrong { border-color: var(--red); background: var(--red-soft); color: #a7273b; }
    .answer-note {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      color: #454a59;
      font-size: 13px;
      line-height: 1.6;
    }

    .summary-card { overflow: hidden; padding: 24px; text-align: center; }
    .summary-mark {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      place-items: center;
      border-radius: 22px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 33px;
      font-weight: 900;
    }
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
    .score-item { padding: 13px 5px; border-radius: 13px; background: var(--surface-2); }
    .score-item b { display: block; margin-bottom: 3px; font-size: 21px; }
    .score-item small { color: var(--muted); }

    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .section-head h1 { margin: 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .stat-card b { display: block; margin-bottom: 4px; font-size: 28px; }
    .stat-card small { color: var(--muted); }
    .chart-card { padding: 19px 16px 14px; }
    .chart-card h2 { font-size: 16px; }
    .week-chart { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 8px; height: 145px; margin-top: 16px; }
    .day-bar { display: grid; grid-template-rows: 1fr auto; align-items: end; gap: 7px; height: 100%; text-align: center; }
    .bar-wrap { display: flex; align-items: end; justify-content: center; height: 100%; border-radius: 8px; background: var(--surface-2); }
    .bar { width: 100%; min-height: 4px; border-radius: 8px; background: var(--indigo); transition: height .3s ease; }
    .day-bar small { color: var(--muted); font-size: 10px; }

    .calendar-card { margin-bottom: 14px; padding: 18px 14px 15px; }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .calendar-head h2 { margin: 0; font-size: 17px; }
    .month-switch { display: grid; grid-template-columns: 36px minmax(96px, auto) 36px; align-items: center; gap: 4px; }
    .month-switch button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--indigo);
      font-size: 20px;
      cursor: pointer;
    }
    .month-switch button:disabled { color: #a9adba; cursor: default; opacity: .55; }
    .month-switch b { font-size: 14px; text-align: center; }
    .calendar-weekdays, .learning-calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .calendar-weekdays { margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 750; text-align: center; }

    .stats-quiz-card { padding: 19px; }

    .recent-scores { display: grid; gap: 8px; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); }
    .recent-scores h3 { margin: 0 0 2px; font-size: 14px; }
    .score-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); }
    .score-row span { color: var(--muted); font-size: 12px; }

    .standalone-quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .standalone-quiz-head h1 { margin: 0; font-size: 23px; }

    .test-progress { margin-bottom: 22px; }
    .test-result-score { margin: 2px 0 4px; color: var(--indigo); font-size: 58px; line-height: 1; letter-spacing: -.05em; }

    .review-controls {
      position: sticky;
      top: 72px;
      z-index: 8;
      margin: 0 -4px 14px;
      padding: 8px 4px 10px;
      background: rgba(244,245,247,.94);
      backdrop-filter: blur(12px);
    }
    .review-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
    }
    .review-filter {
      min-height: 40px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }
    .review-filter.active { background: var(--indigo); color: #fff; }
    .review-search {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    .review-search::placeholder { color: #9297a5; }
    .review-list { display: grid; gap: 10px; }
    .review-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(28,33,48,.04);
    }
    .review-card summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(54px, max-content);
      align-items: start;
      gap: 12px;
      min-height: 80px;
      padding: 14px 15px;
      list-style: none;
      cursor: pointer;
    }
    .review-card summary::-webkit-details-marker { display: none; }
    .review-card summary > div:first-child { min-width: 0; }
    .review-word { display: grid; align-items: start; gap: 3px; min-width: 0; }
    .review-word b {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: 22px;
      line-height: 1.18;
      letter-spacing: -.02em;

    .review-word b.is-long { font-size: 18px; line-height: 1.25; letter-spacing: -.03em; }

    .review-word .phonetic-list {
      color: var(--muted);
      font-family: ui-serif, Georgia, serif;

      line-height: 1.45;
    }
    .review-meaning { margin: 4px 0 0; color: #4f5564; font-size: 13px; line-height: 1.45; }
    .review-meta { display: grid; justify-items: end; gap: 7px; padding-top: 2px; color: var(--muted); font-size: 11px; text-align: right; }
    .review-action {
      min-width: 48px;
      min-height: 32px;
      padding: 0 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;

    .review-action.relearn { border: 1px solid #c9c7f8; background: var(--indigo-soft); color: var(--indigo-dark); }
    .review-action.skip { border: 1px solid var(--line); background: var(--surface-2); color: #5c6272; }
    .review-action.remember { min-width: 72px; border: 1px solid #a9dfcf; background: var(--green-soft); color: #0e654e; }
    .review-action:disabled { cursor: default; opacity: .55; }
    .review-action-group { display: grid; width: 72px; gap: 6px; }
    .review-action-group .review-action { width: 100%; }
    .review-meta > span { white-space: nowrap; }
    .review-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }

    .review-tag.spelling { background: var(--red-soft); color: #ad2c42; }

    .mini-audio {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;

    .review-result-count { color: var(--muted); font-size: 12px; font-weight: 650; }

    .quiz-kind {

      gap: 6px;
      margin-bottom: 10px;
      padding: 6px 9px;
      border-radius: 9px;

      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;

    .spelling-card { padding: 22px; text-align: center; }
    .spelling-meaning {

      font-size: clamp(22px, 7vw, 30px);
      line-height: 1.4;
      font-weight: 780;
      letter-spacing: -.02em;
    }
    .spelling-hint { color: var(--muted); font-size: 13px; }
    .spelling-meta { display: grid; justify-items: center; gap: 4px; margin-top: 8px; }
    .spelling-meta .phonetic-list, .spelling-answer .phonetic-list, .quiz-phonetic .phonetic-list { justify-items: center; }
    .quiz-phonetic { display: grid; justify-items: center; margin-top: 8px; }
    .spelling-form { margin-top: 19px; }
    .spelling-input {
      width: 100%;
      min-height: 58px;
      padding: 0 16px;
      border: 2px solid #cfd2dc;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 24px;
      font-weight: 720;
      letter-spacing: .04em;
      text-align: center;
      text-transform: lowercase;
    }
    .spelling-input:focus { border-color: var(--indigo); outline: 3px solid rgba(79,70,229,.15); }
    .spelling-input.correct { border-color: var(--green); background: var(--green-soft); color: #0e654e; }
    .spelling-input.wrong { border-color: var(--red); background: var(--red-soft); color: #a7273b; }
    .spelling-answer {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 14px;
      line-height: 1.55;
    }
    .spelling-answer b { color: var(--indigo); font-size: 19px; letter-spacing: .03em; }

    .plan-card { margin-bottom: 13px; padding: 19px; }
    .plan-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .plan-row + .plan-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .plan-row h3 { margin: 0 0 3px; font-size: 15px; }
    .plan-row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .stepper { display: grid; grid-template-columns: 40px 46px 40px; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
    .stepper button { height: 40px; border: 0; background: var(--surface-2); color: var(--indigo); font-size: 20px; cursor: pointer; }
    .stepper b { text-align: center; }
    .plan-meter { margin-top: 16px; }
    .plan-meter .progress-track { margin: 8px 0 0; }
    .small-button { min-height: 42px; padding: 0 13px; border-radius: 11px; font-size: 13px; }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(100%, 560px);
      min-height: calc(66px + env(safe-area-inset-bottom));
      margin: 0 auto;
      padding: 7px 12px env(safe-area-inset-bottom);
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(16px);
    }
    .nav-btn {
      display: grid;
      grid-template-rows: 25px 16px;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #7a7f8d;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn svg { width: 21px; height: 21px; }
    .nav-btn.active { background: var(--indigo-soft); color: var(--indigo); }

    dialog {
      width: min(calc(100% - 24px), 520px);
      max-height: min(82dvh, 720px);
      margin: auto auto 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 22px 22px 0 0;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 -18px 50px rgba(20,24,39,.2);
    }
    dialog::backdrop { background: rgba(20,24,39,.42); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 20px 14px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; }
    .close-btn { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 50%; background: var(--surface-2); cursor: pointer; }
    .dialog-body { max-height: calc(82dvh - 145px); overflow: auto; padding: 14px 18px 22px; }
    .book-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-bottom: 9px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; }
    .book-item.active { border-color: var(--indigo); background: var(--indigo-soft); }
    .book-item h3 { margin: 0 0 3px; font-size: 15px; }
    .book-item p { margin: 0; color: var(--muted); font-size: 12px; }
    .check { color: var(--indigo); font-size: 18px; font-weight: 900; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding-top: 8px; }
    .format-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: calc(82px + env(safe-area-inset-bottom));
      left: 18px;
      z-index: 50;
      max-width: 520px;
      margin: auto;
      padding: 13px 15px;
      border-radius: 12px;
      background: #202433;
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: var(--shadow);
      animation: toast-in .18s ease-out both;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(244,245,247,.78);
      backdrop-filter: blur(8px);
    }
    .loading-panel {
      display: grid;
      min-width: min(270px, calc(100vw - 48px));
      justify-items: center;
      padding: 25px 22px 22px;
      border: 1px solid rgba(79,70,229,.14);
      border-radius: 19px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 13px;
      border: 4px solid #dddffa;
      border-top-color: var(--indigo);
      border-radius: 50%;
      animation: loading-spin .72s linear infinite;
    }
    .loading-panel b { margin-bottom: 5px; font-size: 16px; }
    .loading-panel span { color: var(--muted); font-size: 12px; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    body.is-loading { overflow: hidden; }
    .hidden { display: none !important; }
    .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

    @media (min-width: 620px) {
      body { padding: 18px 0; }
      .app { min-height: calc(100dvh - 36px); border-radius: 24px; overflow: hidden; }
      .bottom-nav { bottom: 18px; border-radius: 0 0 24px 24px; }
      dialog { margin-bottom: max(18px, calc((100dvh - 760px) / 2)); border-radius: 22px; }
    }
    @media (max-width: 380px) {
      .header { padding-right: 13px; padding-left: 13px; }
      main { padding-right: 13px; padding-left: 13px; }
      .streak span { display: none; }
      .book-switch { padding: 0 5px; }
      .stage-item { padding-inline: 4px; }
      .review-card summary { grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; padding-inline: 12px; }
      .stats-quiz-head { display: grid; }
      .stats-quiz-head .primary { width: 100%; }
      .calendar-card { padding-inline: 10px; }
      .calendar-day { min-height: 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand" aria-label="词阶"><img src="favicon.svg" alt="" aria-hidden="true">词阶</div>
      <button class="book-switch" id="bookSwitch" type="button" aria-label="切换单词书">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v16H7.5A2.5 2.5 0 0 0 5 20.5v-16Z" stroke="currentColor" stroke-width="1.8"/><path d="M5 20.5A1.5 1.5 0 0 0 6.5 22H19v-4" stroke="currentColor" stroke-width="1.8"/></svg>
        <span id="bookName">载入中</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 9 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

    <main id="main">

      <div id="lookupView" hidden></div>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn active" data-tab="today" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h16M7 3v3m10-3v3M6 5h12a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m8.5 14 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-btn" data-tab="review" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H19v-4M8 8h7m-7 4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>回顾</span>
      </button>
      <button class="nav-btn" data-tab="stats" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 20v-7h4v7H5Zm5 0V4h4v16h-4Zm5 0v-11h4v11h-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>统计</span>

      <button class="nav-btn" data-tab="plan" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 7v5l3 2M16 3h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>计划</span>
      </button>
    </nav>
  </div>

  <dialog id="bookDialog">
    <div class="dialog-head"><h2>切换单词书</h2><button class="close-btn" type="button" aria-label="关闭" data-close-dialog>✕</button></div>
    <div class="dialog-body">
      <div id="bookList"></div>
      <div class="dialog-actions">
        <button class="secondary small-button" type="button" id="importButton">导入 JSON</button>
        <button class="ghost small-button" type="button" id="templateButton">下载格式样例</button>
      </div>
      <input class="hidden" id="fileInput" type="file" accept="application/json,.json">
      <p class="format-note">音频字段支持纯 Base64 MP3 或 <code>data:audio/mpeg;base64,...</code>。数据只保存在当前浏览器的 IndexedDB 中。</p>
    </div>
  </dialog>
  <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="toast hidden" id="toast" role="status"></div>
  <div class="loading-overlay hidden" id="loadingOverlay" role="status" aria-live="assertive" aria-hidden="true">
    <div class="loading-panel">
      <div class="loading-spinner" aria-hidden="true"></div>
      <b id="loadingTitle">正在加载词书</b>
      <span>首次加载可能需要一点时间，请稍候</span>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const DB_NAME = "wordstep-db";
    const DB_VERSION = 2;
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const main = $("#studyView");
    const lookupView = $("#lookupView");
    const bookDialog = $("#bookDialog");
    const state = { db: null, books: [], book: null, settings: null, session: null, tab: "today", flowOpen: false, revealed: false, quizAnswered: false, selectedAnswer: null, reviewFilter: "consolidate", reviewQuery: "", statsMonth: localDate().slice(0, 7), statsQuiz: null, studyActionPending: false, lookupWord: null, lookupReturnContext: null, ttsPlayback: null };
    let lookupRequestId = 0;
    let lookupPendingStatus = null;
    const bookWordIndexes = new WeakMap();

    const REMOVED_BUILTIN_BOOK_IDS = ["cet6-focus", "business-core"];
    const CUSTOM_BOOK_CATALOG_KEY = "custom-book-catalog";
    const VOICE_ENDPOINT_B64 = "aHR0cHM6Ly9kaWN0LnlvdWRhby5jb20vZGljdHZvaWNlP2F1ZGlvPQ==";

    // hight_school_2000 is a historical ID; keep it stable for saved progress.
    const BUNDLED_BOOKS = [

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("books")) db.createObjectStore("books", { keyPath: "id" });
          if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
          if (!db.objectStoreNames.contains("progress")) db.createObjectStore("progress", { keyPath: "key" });
          if (!db.objectStoreNames.contains("sessions")) db.createObjectStore("sessions", { keyPath: "id" });
          if (!db.objectStoreNames.contains("activity")) db.createObjectStore("activity", { keyPath: "id" });
          if (!db.objectStoreNames.contains("quizResults")) db.createObjectStore("quizResults", { keyPath: "id" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function dbRequest(storeName, mode, action) {
      return new Promise((resolve, reject) => {
        const tx = state.db.transaction(storeName, mode);
      const store = tx.objectStore(Array.isArray(storeName) ? storeName[0] : storeName);
        let request;
      try { request = action(store, tx); } catch (error) { tx.abort(); reject(error); return; }
        let result;
        if (request) {
          request.onsuccess = () => { result = request.result; };
          request.onerror = () => reject(request.error);
        }
        tx.oncomplete = () => resolve(result);
        tx.onabort = () => reject(tx.error || new Error("保存已中止，请重试"));
        tx.onerror = () => reject(tx.error);
      });
    }
    const get = (store, key) => dbRequest(store, "readonly", s => s.get(key));
    const getAll = store => dbRequest(store, "readonly", s => s.getAll());
    const getAllKeys = store => dbRequest(store, "readonly", s => s.getAllKeys());
    const put = (store, value) => dbRequest(store, "readwrite", s => s.put(value));
    const remove = (store, key) => dbRequest(store, "readwrite", s => s.delete(key));

    function storageErrorMessage(error) {
      return error?.name === "QuotaExceededError"
        ? "本机存储空间不足，请释放空间或使用不含音频的较小词书后重试"
        : `保存失败，请重试${error?.message ? `：${error.message}` : ""}`;
    }

    function normalizeSettings(settings) {
      const next = { key: "settings", activeBookId: BUNDLED_BOOKS[0].id, createdAt: localDate(), ...(settings || {}) };
      const daily = Number(next.dailyNew);
      next.dailyNew = Number.isFinite(daily) && daily > 0 ? Math.max(1, Math.min(50, Math.floor(daily))) : 20;
      next.key = "settings";
      if (typeof next.activeBookId !== "string" || !next.activeBookId) next.activeBookId = BUNDLED_BOOKS[0].id;
      if (typeof next.createdAt !== "string" || !next.createdAt) next.createdAt = localDate();
      return next;
    }

    function localDate(offset = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offset);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric" }).format(new Date(y, m - 1, d));
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[c]);
    }
    function pronunciationButtonHTML(word, type, showAccent = false) {
      const accent = type === 1 ? "英" : "美";
      return `<button class="phonetic-audio" type="button" data-pronunciation-word="${esc(word.id)}" data-pronunciation-type="${type}" aria-label="播放 ${esc(word.word)} 的${accent}音" aria-pressed="false">${showAccent ? `${accent} ` : ""}🔊</button>`;
    }
    function phoneticWithAudioHTML(word, compact = false) {
      const raw = String(word?.phonetic || "").trim();
      if (!raw) return "";
      const prepared = raw.replace(/[ \t]+(?=(?:英|美)(?:音|式)?\s*[\/\[])/g, "\n");
      const lines = prepared.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const body = lines.map(line => {
        const isBritish = /^(?:英|英音|英式|UK|British)(?:\s|\/|\[|:|：|$)/i.test(line);
        const isAmerican = /^(?:美|美音|美式|US|American)(?:\s|\/|\[|:|：|$)/i.test(line);
        const buttons = isBritish
          ? pronunciationButtonHTML(word, 1)
          : isAmerican
            ? pronunciationButtonHTML(word, 2)
            : `<span class="phonetic-audio-group">${pronunciationButtonHTML(word, 1, true)}${pronunciationButtonHTML(word, 2, true)}</span>`;
        return `<div class="phonetic-line"><span class="phonetic-text">${esc(line)}</span>${buttons}</div>`;
      }).join("");
      return `<div class="phonetic-list ${compact ? "compact" : ""}">${body}</div>`;
    }
    function hasRecordedAudio(word) {
      return Boolean(String(word?.audioBase64 || word?.audio || "").trim());
    }
    function consolidationTypes(progress) {
      if (!progress) return [];
      if (Object.prototype.hasOwnProperty.call(progress, "consolidation")) {
        const flags = progress.consolidation && typeof progress.consolidation === "object" ? progress.consolidation : {};
        return ["spelling", "fuzzy"].filter(type => Boolean(flags[type]));
      }
      const types = [];
      if ((progress.spellingWrong || 0) > 0) types.push("spelling");
      if ((progress.wrong || 0) > (progress.spellingWrong || 0)) types.push("fuzzy");
      return types;
    }
    function markForConsolidation(progress, type) {
      const flags = {};
      consolidationTypes(progress).forEach(existingType => { flags[existingType] = Date.now(); });
      flags[type] = Date.now();
      progress.consolidation = flags;
    }
    function consolidationTime(progress) {
      const flags = progress?.consolidation;
      if (!flags || typeof flags !== "object") return progress?.lastTestAt || progress?.lastSeenAt || 0;
      return Math.max(0, ...Object.values(flags).map(Number).filter(Number.isFinite));
    }
    function shuffle(items) {
      const a = [...items];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function announce(message) {
      const status = $("#status");
      status.textContent = message;
    }

    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.remove("hidden");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.add("hidden"), 2600);

    function setLoading(active, title = "正在加载词书") {
      const overlay = $("#loadingOverlay");
      $("#loadingTitle").textContent = title;

    function waitForPaint() {
      return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    function withBundledMetadata(book, source) {
      return { ...book, words: normalizeWords(book.words), id: source.id, name: source.name, description: source.description, wordCount: book.words.length, order: source.order, version: source.version, builtin: true };
    }

    function lookupKey(value) {
      return String(value ?? "").trim().toLowerCase().replace(/’/g, "'");
    }

    function bookHeadwords(words) {
      return [...new Set(words.map(word => lookupKey(word?.word)).filter(Boolean))].sort();
    }

    function lookupIndexKey(bookId) {
      return `lookup-headwords:${bookId}`;
    }

    function saveBookWithLookupIndex(book) {
      const index = { key: lookupIndexKey(book.id), headwords: bookHeadwords(book.words) };
      return dbRequest(["books", "meta"], "readwrite", (store, tx) => {
        tx.objectStore("meta").put(index);
        return store.put(book);
      });
    }

    async function cachedLookupHeadwords(bookId) {
      const key = lookupIndexKey(bookId);
      const index = await get("meta", key);
      if (Array.isArray(index?.headwords)) return index.headwords;

      // Build a legacy cache's index once. Recheck inside the transaction in case
      // a book was imported or refreshed in another tab since the initial read.
      let headwords;
      try {
        await dbRequest(["books", "meta"], "readwrite", (books, tx) => {
          const meta = tx.objectStore("meta");
          const existing = meta.get(key);
          existing.onsuccess = () => {
            if (Array.isArray(existing.result?.headwords)) {
              headwords = existing.result.headwords;
              return;
            }
            const book = books.get(bookId);
            book.onsuccess = () => {
              if (!Array.isArray(book.result?.words) || !book.result.words.length) return;
              headwords = bookHeadwords(book.result.words);
              meta.put({ key, headwords });
            };
          };
        });
      } catch (error) {
        if (!headwords) throw error;
        console.warn("无法保存查词索引", error);
      }
      if (!headwords) throw new Error("无法读取词书索引");
      return headwords;
    }

    async function fetchBundledBook(source, cacheOptional = false) {
      const response = await fetch(source.url, { cache: "no-cache" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const book = withBundledMetadata(await response.json(), source);
      try {
        await saveBookWithLookupIndex(book);
      } catch (error) {
        if (!cacheOptional) throw error;
        console.warn(`无法缓存内置词书 ${source.id}`, error);
      }
      return book;
    }

    async function loadBundledBook(source) {
      const existing = await get("books", source.id);
      if (existing?.version === source.version && Array.isArray(existing.words) && existing.words.length) {
        return withBundledMetadata(existing, source);
      }
      try {
        return await fetchBundledBook(source);
      } catch (error) {
        if (Array.isArray(existing?.words) && existing.words.length) {
          console.warn(`无法更新内置词书 ${source.id}，使用本地缓存`, error);
          return withBundledMetadata(existing, source);
        }
        throw error;
      }
    }

    async function loadBookById(id) {
      const source = BUNDLED_BOOKS.find(book => book.id === id);
      if (source) return loadBundledBook(source);
      const book = await get("books", id);
      if (!book?.words?.length) throw new Error("词书不存在或内容为空");
      return { ...book, words: normalizeWords(book.words), wordCount: book.words.length };
    }

    function customBookMetadata(book) {
      return {
        id: book.id,
        name: book.name,
        description: book.description || "自定义 JSON 词书",
        wordCount: book.words?.length || book.wordCount || 0,
        importedAt: book.importedAt || 0,
        builtin: false
      };
    }

    async function getCustomBookCatalog(cachedIds) {
      let catalog = await get("meta", CUSTOM_BOOK_CATALOG_KEY);
      if (!catalog) {
        const bundledIds = new Set(BUNDLED_BOOKS.map(book => book.id));
        const ids = cachedIds ?? await getAllKeys("books");
        const books = (await Promise.all(ids.filter(id => !bundledIds.has(id)).map(id => get("books", id))))
          .filter(book => book && !book.builtin)
          .map(customBookMetadata);
        catalog = { key: CUSTOM_BOOK_CATALOG_KEY, books };
        await put("meta", catalog);
      }
      return Array.isArray(catalog.books) ? catalog.books : [];
    }

    async function saveCustomBookMetadata(book) {
      if (BUNDLED_BOOKS.some(source => source.id === book.id)) return;
      const books = await getCustomBookCatalog();
      const next = books.filter(item => item.id !== book.id);
      next.push(customBookMetadata(book));
      await put("meta", { key: CUSTOM_BOOK_CATALOG_KEY, books: next });
    }

    async function getBookCatalog(cachedIds) {
      const importedBooks = (await getCustomBookCatalog(cachedIds))
        .sort((a, b) => (a.importedAt || 0) - (b.importedAt || 0))
        .map((book, index) => ({
          order: 1000 + index,
          ...book
        }));
      return [...BUNDLED_BOOKS, ...importedBooks].sort((a, b) => a.order - b.order);
    }

    async function init() {
      try {
        state.db = await openDB();
        for (const id of REMOVED_BUILTIN_BOOK_IDS) await remove("books", id);
        state.settings = normalizeSettings(await get("meta", "settings"));
        try {
          state.book = await loadBookById(state.settings.activeBookId);
        } catch (error) {
          console.warn(`无法载入当前词书 ${state.settings.activeBookId}，改用默认词书`, error);
          state.book = await loadBookById(BUNDLED_BOOKS[0].id);
        }
        state.books = BUNDLED_BOOKS.map(book => ({ ...book }));
        state.settings.activeBookId = state.book.id;
        await put("meta", state.settings);
        state.session = await getSession();
        bindStaticEvents();
        await refreshHeader();
        render();
      } catch (error) {
        console.error(error);
        setStudyView(`<section class="screen"><div class="card empty"><h2>无法启动本地数据库</h2><p>请确认浏览器允许 IndexedDB，或换用非隐私浏览模式。</p></div></section>`);
      }
    }

    function recentReviewPlan(allProgress) {
      const availableWordIds = new Set(state.book.words.map(word => word.id));
      const eligible = allProgress.filter(progress => progress.learnedDate
        && progress.learnedDate < localDate()
        && !progress.relearnQueuedAt
        && !progress.skippedAt
        && availableWordIds.has(progress.wordId));
      const sourceDate = eligible.reduce((latest, progress) => progress.learnedDate > latest ? progress.learnedDate : latest, "");
      return {
        sourceDate: sourceDate || null,
        reviewIds: sourceDate ? eligible.filter(progress => progress.learnedDate === sourceDate).map(progress => progress.wordId) : []
      };
    }

    function normalizeSession(session) {
      const s = session;
      if (!Array.isArray(s.newIds)) {
        const familiar = new Set(Array.isArray(s.familiarIds) ? s.familiarIds : []);
        const removed = new Set(Array.isArray(s.removedIds) ? s.removedIds : []);
        s.newIds = [...new Set([s.learnQueue, s.quizQueue, s.learnDone].filter(Array.isArray).flat())]
          .filter(id => typeof id === "string" && !familiar.has(id) && !removed.has(id));
      }
      const array = key => { s[key] = Array.isArray(s[key]) ? s[key].filter(id => typeof id === "string" && id) : []; };
      const missingLearnQueue = !Array.isArray(s.learnQueue);
      const missingQuizQueue = !Array.isArray(s.quizQueue);
      for (const key of ["reviewIds", "reviewDone", "newIds", "learnDone", "familiarIds", "removedIds"]) array(key);
      if (!Array.isArray(s.freshIds)) s.freshIds = [...s.newIds];
      array("freshIds");
      if (!Array.isArray(s.plannedNewIds)) s.plannedNewIds = [...new Set([...s.newIds, ...s.learnDone, ...s.familiarIds])];
      if (!Array.isArray(s.plannedReviewIds)) s.plannedReviewIds = [...new Set([...s.reviewIds, ...s.reviewDone])];
      array("plannedNewIds"); array("plannedReviewIds");
      s.quizAnswers = Array.isArray(s.quizAnswers) ? s.quizAnswers.filter(a => a && typeof a.wordId === "string").map(a => ({ ...a, type: a.type === "spelling" ? "spelling" : "choice" })) : [];
      for (const key of ["repeats", "quizOptions", "quizRetries", "spellingRetries"]) {
        if (!s[key] || typeof s[key] !== "object" || Array.isArray(s[key])) s[key] = {};
      }
      for (const key of ["reviewIndex", "learnIndex", "quizIndex", "reviewKnown", "quizCorrect", "quizWrong", "spellingCorrect", "spellingWrong"]) {
        s[key] = Number.isFinite(s[key]) ? Math.max(0, Math.floor(s[key])) : 0;
      }
      s.completed = s.completed === true || s.stage === "complete";
      if (s.completed) s.stage = "complete";
      else if (!["review", "learn", "quiz"].includes(s.stage)) s.stage = s.reviewIds.length > s.reviewIndex ? "review" : "learn";
      if (!s.completed) s.quizVersion = 2;
      s.quizMode = s.quizMode === "spelling" ? "spelling" : "choice";
      if (missingLearnQueue) s.learnQueue = [...s.newIds];
      if (missingQuizQueue) s.quizQueue = s.stage === "quiz" ? [...s.newIds] : [];
      array("learnQueue"); array("quizQueue");
      if (!s.completed) {
        const available = new Set(state.book.words.map(word => word.id));
        s.removedIds = [...new Set([...s.removedIds, ...s.plannedNewIds.filter(id => !available.has(id)), ...s.plannedReviewIds.filter(id => !available.has(id))])];
        for (const [queue, index] of [["reviewIds", "reviewIndex"], ["learnQueue", "learnIndex"], ["quizQueue", "quizIndex"]]) {
          const old = s[queue];
          const cursor = Math.min(s[index], old.length);
          s[index] = old.slice(0, cursor).filter(id => available.has(id)).length;
          s[queue] = old.filter(id => available.has(id));
        }
        s.newIds = s.newIds.filter(id => available.has(id));
      }
      return s;
    }

    async function upgradeSession(session) {
      const previous = JSON.stringify(session);
      normalizeSession(session);
      if (!Object.prototype.hasOwnProperty.call(session, "reviewSourceDate")) {
        if (session.reviewIds.length) session.reviewSourceDate = localDate(-1);
        else {
          const untouched = !session.completed && session.reviewIndex === 0 && !session.reviewDone.length
            && session.learnIndex === 0 && session.quizIndex === 0 && !session.quizAnswers.length;
          const allProgress = untouched ? (await getAll("progress")).filter(p => p.bookId === state.book.id) : [];
          const plan = recentReviewPlan(allProgress);
          session.reviewSourceDate = plan.sourceDate;
          if (untouched && plan.reviewIds.length) {
            session.reviewIds = plan.reviewIds;
            session.plannedReviewIds = [...plan.reviewIds];
            session.stage = "review";
          }
        }
      }
      if (previous !== JSON.stringify(session)) await put("sessions", session);
      return session;
    }

    async function getSession() {
      const id = `${state.book.id}:${localDate()}`;
      let session = await get("sessions", id);
      if (session) return upgradeSession(session);
      const allProgress = (await getAll("progress")).filter(p => p.bookId === state.book.id);
      const progressByWord = new Map(allProgress.map(p => [p.wordId, p]));
      const reviewPlan = recentReviewPlan(allProgress);
      const reviewIds = reviewPlan.reviewIds;
      const pendingWords = state.book.words.filter(word => {
        const progress = progressByWord.get(word.id);
        return !progress?.skippedAt && (!progress?.learnedDate || progress.relearnQueuedAt);
      });
      pendingWords.sort((a, b) => {
        const aQueued = progressByWord.get(a.id)?.relearnQueuedAt || 0;
        const bQueued = progressByWord.get(b.id)?.relearnQueuedAt || 0;
        if (Boolean(aQueued) !== Boolean(bQueued)) return aQueued ? 1 : -1;
        return aQueued && bQueued ? aQueued - bQueued : 0;
      });
      const newIds = pendingWords.slice(0, state.settings.dailyNew).map(w => w.id);
      const freshIds = newIds.filter(wordId => !progressByWord.get(wordId)?.learnedDate);
      session = {
        id, bookId: state.book.id, date: localDate(), reviewSourceDate: reviewPlan.sourceDate, reviewIds, newIds,
        stage: reviewIds.length ? "review" : newIds.length ? "learn" : "complete",
        plannedNewIds: [...newIds], plannedReviewIds: [...reviewIds], removedIds: [],
        reviewIndex: 0, reviewDone: [], reviewKnown: 0,
        learnQueue: [...newIds], learnIndex: 0, learnDone: [], freshIds, familiarIds: [], repeats: {},
        quizVersion: 2, quizMode: "choice", quizQueue: [], quizIndex: 0, quizCorrect: 0, quizWrong: 0, quizAnswers: [], quizOptions: {}, quizRetries: {}, spellingRetries: {}, spellingCorrect: 0, spellingWrong: 0,
        completed: !reviewIds.length && !newIds.length, createdAt: Date.now()
      };
      await put("sessions", session);
      if (session.completed) await saveActivity(session);
      return session;
    }

    function currentWord() {
      if (!state.session) return null;
      let id;
      if (state.session.stage === "review") id = state.session.reviewIds[state.session.reviewIndex];
      if (state.session.stage === "learn") id = state.session.learnQueue[state.session.learnIndex];
      if (state.session.stage === "quiz") id = state.session.quizQueue[state.session.quizIndex];
      return state.book.words.find(w => w.id === id) || null;
    }

    function sessionCounts() {
      const s = state.session;
      const plannedNew = new Set(s.plannedNewIds || s.newIds);
      const plannedReview = new Set(s.plannedReviewIds || s.reviewIds);
      const removed = new Set(s.removedIds || []);
      const familiar = new Set(s.familiarIds || []);
      const learned = new Set(s.learnDone);
      const reviewed = new Set(s.reviewDone);
      const rounds = s.quizVersion === 2 ? ["choice", "spelling"] : ["choice"];
      const answers = new Set(s.quizAnswers.map(a => `${a.type || "choice"}:${a.wordId}`));
      const total = plannedReview.size + plannedNew.size * (1 + rounds.length);
      let done = [...plannedReview].filter(id => reviewed.has(id) || removed.has(id)).length;
      for (const id of plannedNew) {
        if (removed.has(id)) { done += 1 + rounds.length; continue; }
        if (learned.has(id) || familiar.has(id)) done++;
        for (const type of rounds) if (familiar.has(id) || answers.has(`${type}:${id}`)) done++;
      }
      const percent = s.completed ? 100 : total ? Math.min(99, Math.round(done / total * 100)) : 0;
      return { review: s.reviewIds.length, learn: [...plannedNew].filter(id => !removed.has(id)).length,
        quiz: s.newIds.length * rounds.length, total, done: Math.min(total, done), percent,
        exempt: [...plannedNew].filter(id => familiar.has(id) || removed.has(id)).length };
    }
