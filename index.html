<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="词阶：每天复习、学习、测验，进度保存在本机。">
  <title>词阶 · 每日单词学习</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --ink: #141827;
      --muted: #697083;
      --line: #e3e6eb;
      --guide: #d3d8ee;
      --accent: #4f46e5;
      --accent-dark: #3730a3;
      --accent-soft: #eef2ff;
      --focus: rgba(79,70,229,.3);
      --coral: #ff704d;
      --coral-soft: #fff0eb;
      --green: #158466;
      --green-soft: #e7f7f1;
      --red: #d93d55;
      --red-soft: #fff0f2;
      --shadow: 0 12px 30px rgba(28, 33, 48, .08), 0 2px 8px rgba(28, 33, 48, .05);
      --page-gutter: 18px;
      --main-bottom-padding: calc(92px + env(safe-area-inset-bottom));
      --section-indent: 11px;
      --section-scroll-offset: max(12px, env(safe-area-inset-top));
      --nav-height: calc(66px + env(safe-area-inset-bottom));
      --nav-offset: 0px;
      --actions-bottom: calc(var(--nav-height) + var(--nav-offset));
      font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: min(100%, 560px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--surface);
      position: relative;
    }

    .header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 61px;
      padding: max(8px, env(safe-area-inset-top)) var(--page-gutter) 8px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      font-size: 22px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand img {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
    }

    .book-switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      min-height: 44px;
      padding: 0 11px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }
    .book-switch:hover { background: var(--surface-2); }
    .book-switch svg { flex: none; }
    .book-switch span {
      overflow: hidden;
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .streak {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: max-content;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .streak b { color: var(--coral); font-size: 17px; }

    main {
      flex: 1;
      min-width: 0;
      padding: 20px var(--page-gutter) var(--main-bottom-padding);
    }

    .screen { animation: enter .18s ease-out both; }
    @keyframes enter { from { opacity: .25; transform: translateY(5px); } }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: 28px; line-height: 1.2; letter-spacing: -.03em; }
    h2 { margin-bottom: 6px; font-size: 20px; line-height: 1.3; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.65; }

    .today-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .today-number { display: flex; align-items: baseline; gap: 8px; }
    .today-number { font-variant-numeric: tabular-nums; }
    .today-number strong { color: var(--accent); font-size: 34px; line-height: 1; letter-spacing: -.04em; }
    .today-number span { color: var(--muted); font-size: 16px; font-weight: 650; }
    .completion { color: var(--muted); font-size: 13px; font-weight: 650; }

    .progress-track {
      height: 4px;
      margin-bottom: 14px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--accent-soft);
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .3s ease-out;
    }

    .stage-rail {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 20px;
    }
    .stage-item {
      position: relative;
      min-width: 0;
      padding: 1px 8px 1px var(--section-indent);
      border-inline-start: 1px solid var(--line);
    }
    .stage-item.active { border-inline-start-color: var(--accent); }
    .stage-item small { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
    .stage-item b { font-size: 19px; }
    .stage-item.active small, .stage-item.active b { color: var(--accent); }
    .stage-item.done::after {
      content: "✓";
      position: absolute;
      top: -3px;
      right: 5px;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
    }

    .card { min-width: 0; }
    .word-flash { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
    .word-flash-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; margin-bottom: 4px; }
    .word-flash-head h2 { margin: 0; }
    .word-flash-controls { display: flex; gap: 4px; margin-inline-start: auto; }
    .word-flash-controls button { min-height: 44px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer; }
    .word-flash-controls button:hover:not(:disabled) { background: var(--accent-soft); }
    .word-flash-track { touch-action: pan-y pinch-zoom; }
    .word-flash-entry { display: grid; align-content: center; gap: 4px; min-height: 104px; padding: 4px 0 12px; white-space: pre-line; overflow-wrap: anywhere; }
    .word-flash-word { justify-self: start; max-width: 100%; padding: 0; border: 0; background: transparent; color: var(--accent-dark); font-size: clamp(24px, 6vw, 34px); font-weight: 750; line-height: 1.2; text-align: start; text-decoration: underline dotted var(--guide); text-underline-offset: 4px; overflow-wrap: anywhere; cursor: pointer; }
    .word-flash-word:hover { text-decoration-color: var(--accent); }
    .word-flash-entry .phonetic-list { display: flex; align-items: center; gap: 8px; }
    .word-flash-entry .phonetic-line { min-width: 0; flex-wrap: nowrap; }
    .word-flash-entry .phonetic-audio { min-width: 44px; }

    .primary, .secondary, .danger, .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 19px;
      border-radius: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .primary { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-dark); }
    .primary:active, .secondary:active, .danger:active, .ghost:active { transform: scale(.98); }
    .secondary { border: 1px solid var(--guide); background: var(--accent-soft); color: var(--accent-dark); }
    .secondary:hover { border-color: var(--accent); }
    .ghost { border: 1px solid var(--line); background: var(--surface); color: #454a5a; }
    .danger { border: 1px solid #f2bdc5; background: #fff; color: var(--red); }
    .block { width: 100%; }
    .start-button { margin-top: 17px; }
    button:disabled { cursor: default; opacity: .55; transform: none !important; }

    .study-card, .choice-question { scroll-margin-top: var(--section-scroll-offset); }
    .study-top {
      padding: 8px 0 10px;
    }
    .word {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(39px, 11vw, 54px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }
    .pronunciation-row { display: flex; align-items: center; gap: 8px; padding-inline-start: var(--section-indent); }
    .pronunciation-row:empty { display: none; }
    .pronunciation-row .audio-btn { margin-inline-start: auto; }
    .phonetic-list {
      display: grid;
      min-width: 0;
      color: var(--muted);
      font-family: ui-serif, Georgia, serif;
      font-size: 16px;
      line-height: 1.4;
    }
    .phonetic-line { display: flex; align-items: center; flex-wrap: wrap; column-gap: 3px; }
    .phonetic-text { min-width: 0; overflow-wrap: anywhere; }
    .phonetic-audio-group { display: inline-flex; align-items: center; gap: 2px; }
    .audio-control {
      position: relative;
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 32px;
      min-height: 32px;
      padding: 0 4px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--accent);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .audio-control:hover, .audio-control[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }
    .audio-icon { flex: none; width: 17px; height: 17px; pointer-events: none; }
    .audio-icon .audio-stop,
    .audio-control[aria-pressed="true"] .audio-speaker { display: none; }
    .audio-control[aria-pressed="true"] .audio-stop { display: inline; }
    .phonetic-list.compact { font-size: 13px; line-height: 1.45; }
    .phonetic-list.compact .phonetic-audio { font-size: 11px; }

    .lookup-word {
      display: inline;
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      max-width: 100%;
      overflow-wrap: anywhere;
      text-align: inherit;
      cursor: pointer;
      color: var(--accent);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-color: var(--guide);
      text-underline-offset: 2px;
    }
    .lookup-word:hover {
      text-decoration-style: solid;
      text-decoration-color: var(--accent);
    }

    .search-card {
      margin-bottom: 18px;
    }
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lookup-heading {
      flex: 0 0 auto;
      margin: 0;
      font-size: 16px;
      letter-spacing: normal;
      white-space: nowrap;
    }
    .lookup-heading:focus { outline: none; }
    .search-input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 16px;
      transition: border-color .12s ease, background .12s ease;
    }
    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-btn {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .12s ease, transform .12s ease;
    }
    .search-btn:hover {
      border-color: var(--guide);
    }
    .search-btn:active {
      transform: scale(.98);
    }
    .lookup-result-card {
      margin-top: 14px;
    }
    .lookup-not-found {
      padding: 16px 0 16px var(--section-indent);
      border-inline-start: 1px solid var(--guide);
      color: var(--muted);
    }
    .lookup-status { margin: 0; }
    .lookup-status:not(:empty) { margin-top: 8px; }
    .lookup-not-found, .lookup-note { overflow-wrap: anywhere; }

    .meaning, .review-meaning, .spelling-meaning { white-space: pre-line; overflow-wrap: anywhere; }
    .meaning {
      margin: 0;
      padding: 0 0 12px var(--section-indent);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.6;
    }
    .analysis { color: var(--ink); font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
    .analysis-section + .analysis-section { margin-top: 10px; }
    .analysis p, .analysis ul, .analysis ol { margin: 0 0 12px; }
    .analysis > :last-child, .analysis-section > :last-child { margin-bottom: 0; }
    .analysis h1, .analysis h2, .analysis h3, .analysis h4, .analysis h5, .analysis h6 {
      margin: 16px 0 7px;
      color: var(--ink);
      font-weight: 750;
      line-height: 1.45;
    }
    .analysis h1 { font-size: 17px; }
    .analysis h2 { font-size: 16px; }
    .analysis h3 { font-size: 15px; }
    .analysis h4, .analysis h5, .analysis h6 { font-size: 14px; }
    .analysis > :first-child, .analysis-section > :first-child { margin-top: 0; }
    .analysis ul, .analysis ol { padding-left: 1.5em; }
    .analysis li + li { margin-top: 4px; }
    .analysis a { color: var(--accent-dark); text-decoration: underline; overflow-wrap: anywhere; }
    .analysis code { padding: 1px 4px; border-radius: 4px; background: var(--surface-2); font-size: .92em; }
    .analysis-label {
      display: block;
      margin-bottom: 2px;
      color: var(--accent-dark);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.5;
    }
    .analysis-details summary .analysis-label { margin-bottom: 0; }
    .analysis-details summary.icon-only { justify-content: flex-end; }
    .reveal-placeholder {
      display: grid;
      min-height: 138px;
      place-items: center;
      padding: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
    }

    details.info-section:not([open]) { border-top: 1px solid var(--line); }
    details.info-section summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      list-style: none;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }
    details.info-section summary::-webkit-details-marker { display: none; }
    details.info-section summary::after {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      margin-inline: 6px 4px;
      border: solid var(--muted);
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(-45deg);
    }
    details.info-section[open] summary::after { transform: rotate(45deg); }
    .detail-body {
      margin: 0 0 12px var(--section-indent);
      padding-inline-start: 10px;
      border-inline-start: 1px solid var(--guide);
    }
    .example, .phrase-item {
      display: flex;
      align-items: flex-start;
      gap: 3px;
      margin-bottom: 10px;
    }
    .example:last-child, .phrase-item:last-child { margin-bottom: 0; }
    .bilingual-copy { min-width: 0; padding-block: 5px; overflow-wrap: anywhere; }
    .bilingual-copy p { margin: 0 0 2px; color: var(--accent); font-size: 15px; line-height: 1.55; }
    .bilingual-copy small { display: block; color: var(--muted); line-height: 1.5; }
    .word-highlight { color: var(--accent); }
    .bilingual-copy .word-highlight { color: var(--accent-dark); }
    .phrase-item p { font-weight: 650; }
    .tts-btn { align-items: flex-start; padding-top: 8px; }
    .etymology-card { color: var(--ink); font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
    .etymology-card p { margin: 0 0 8px; }
    .etymology-card p:last-child { margin-bottom: 0; }
    .etymology-card b { color: var(--accent-dark); }
    .word-family { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 6px; }
    .family-word { color: var(--muted); }
    .family-word b { color: var(--accent); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 5px 12px; }
    .chip { max-width: 100%; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .chip b { color: var(--accent); }

    .actions {
      position: sticky;
      bottom: var(--actions-bottom);
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
      gap: 10px;
      margin-top: 14px;
      padding: 10px 0;
      background: linear-gradient(transparent, var(--surface) 30%);
    }
    .actions.single { grid-template-columns: 1fr; }
    .actions.lookup-actions {
      position: fixed;
      inset-inline: 0;
      width: calc(min(100%, 560px) - var(--page-gutter) - var(--page-gutter));
      margin: 0 auto;
    }
    #lookupView { padding-bottom: 72px; }
    .actions.learn-actions {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .learn-actions > button {
      min-width: 0;
      padding-inline: 5px;
      white-space: nowrap;
      font-size: clamp(12px, 3.8vw, 14px);
    }
    .familiar-button { border-color: #9ed8c7; background: var(--green-soft); color: #0e654e; }
    .familiar-button:hover { border-color: var(--green); background: #d9f2e9; }

    .choice-question.with-scroll-space {
      min-height: calc(100vh - var(--main-bottom-padding) - var(--section-scroll-offset) - var(--nav-offset));
      min-height: calc(100dvh - var(--main-bottom-padding) - var(--section-scroll-offset) - var(--nav-offset));
    }
    .quiz-title { margin-bottom: 16px; text-align: center; }
    .quiz-title .word { font-size: clamp(38px, 12vw, 52px); }
    .quiz-title p { margin: 8px 0 0; color: var(--muted); }
    .options { display: grid; gap: 10px; }
    .option {
      min-height: 50px;
      padding: 10px 12px;
      border: 0;
      border-block-end: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 620;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
    }
    .option:hover { background: var(--accent-soft); }
    .option.unknown-option { border: 1px dashed var(--line); border-radius: 12px; background: var(--surface-2); color: var(--muted); font-weight: 750; text-align: center; }
    .option.unknown-option:hover { border-color: #aeb2bf; background: #f0f1f4; color: #444a59; }
    .option.correct, .option.wrong { border-radius: 10px; }
    .option.correct { border-color: var(--green); background: var(--green-soft); color: #0e654e; box-shadow: inset 3px 0 var(--green); }
    .option.wrong { border-color: var(--red); background: var(--red-soft); color: #a7273b; box-shadow: inset 3px 0 var(--red); }
    .answer-note {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      color: #454a59;
      font-size: 13px;
      line-height: 1.6;
    }

    .summary-card { overflow: hidden; padding: 24px; text-align: center; }
    .summary-mark {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      place-items: center;
      border-radius: 22px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 33px;
      font-weight: 900;
    }
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
    .score-item { padding: 9px 5px; border-inline-start: 1px solid var(--line); }
    .score-item b { display: block; margin-bottom: 3px; font-size: 21px; }
    .score-item small { color: var(--muted); }

    .daily-summary-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }
    .daily-summary-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .daily-summary-mark {
      display: grid;
      flex: none;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 14px;
      font-weight: 900;
    }
    .daily-summary-title h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }
    .daily-summary-btn {
      flex: none;
      min-height: 38px;
      padding: 0 11px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
    }
    .daily-summary-sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .daily-summary .score-grid {
      gap: 0;
      margin: 12px 0 0;
    }
    .daily-summary .score-item {
      padding: 1px 8px 1px var(--section-indent);
      text-align: start;
    }
    .daily-summary .score-item b {
      margin-bottom: 2px;
      font-size: 19px;
    }
    .daily-summary .score-item small {
      display: block;
      font-size: 11px;
    }
    .daily-summary + .word-flash {
      margin-top: 18px;
    }

    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .section-head h1 { margin: 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { padding: 5px var(--section-indent); border-inline-start: 1px solid var(--guide); }
    .stat-card b { display: block; margin-bottom: 4px; font-size: 28px; }
    .stat-card small { color: var(--muted); }
    .chart-card { padding: 19px 16px 14px; }
    .chart-card h2 { font-size: 16px; }
    .week-chart { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 8px; height: 145px; margin-top: 16px; }
    .day-bar { display: grid; grid-template-rows: 1fr auto; align-items: end; gap: 7px; height: 100%; text-align: center; }
    .bar-wrap { display: flex; align-items: end; justify-content: center; height: 100%; border-radius: 8px; background: var(--surface-2); }
    .bar { width: 100%; min-height: 4px; border-radius: 8px; background: var(--accent); transition: height .3s ease; }
    .day-bar small { color: var(--muted); font-size: 10px; }

    .calendar-card { margin-bottom: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .calendar-head h2 { margin: 0; font-size: 17px; }
    .month-switch { display: grid; grid-template-columns: 36px minmax(96px, auto) 36px; align-items: center; gap: 4px; }
    .month-switch button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: transparent;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
    }
    .month-switch button:disabled { color: #a9adba; cursor: default; opacity: .55; }
    .month-switch b { font-size: 14px; text-align: center; }
    .calendar-weekdays, .learning-calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .calendar-weekdays { margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 750; text-align: center; }
    .calendar-day {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 55px;
      align-content: space-between;
      justify-items: center;
      padding: 6px 2px 5px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #555b6b;
      font-size: 11px;
    }
    .calendar-day.blank { background: transparent; }
    .calendar-day.today { border-color: var(--guide); color: var(--accent-dark); }
    .calendar-day.has-learning { background: var(--accent-soft); }
    .calendar-day b { color: var(--accent); font-size: 16px; line-height: 1; }
    .calendar-day small { color: var(--muted); font-size: 10px; }

    .stats-quiz-card { padding-top: 16px; border-top: 1px solid var(--line); }
    .stats-quiz-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .stats-quiz-head h2 { margin-bottom: 4px; font-size: 17px; }
    .stats-quiz-head p { margin: 0; }
    .stats-quiz-card .primary { flex: 0 0 auto; }
    .quiz-source-options { display: grid; gap: 9px; margin-top: 16px; }
    .quiz-source-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 68px;
      padding: 10px var(--section-indent);
      border: 0;
      border-inline-start: 1px solid var(--guide);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .quiz-source-option:hover { border-color: var(--accent); background: var(--accent-soft); }
    .quiz-source-option b { display: block; margin-bottom: 3px; font-size: 14px; }
    .quiz-source-option small { display: block; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .quiz-source-option .quiz-source-action { color: var(--accent); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .quiz-source-option:disabled { border-color: var(--line); background: var(--surface-2); color: #8b909e; cursor: not-allowed; opacity: .72; }
    .quiz-source-option:disabled .quiz-source-action { color: #969ba8; }
    .recent-scores { display: grid; gap: 8px; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); }
    .recent-scores h3 { margin: 0 0 2px; font-size: 14px; }
    .score-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 8px var(--section-indent); border-bottom: 1px solid var(--line); }
    .score-row span { color: var(--muted); font-size: 12px; }
    .score-row b { color: var(--accent-dark); font-size: 16px; }
    .standalone-quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .standalone-quiz-head h1 { margin: 0; font-size: 23px; }
    .standalone-quiz-head .ghost { min-height: 38px; padding: 0 11px; border-radius: 10px; font-size: 12px; }
    .test-progress { margin-bottom: 22px; }
    .test-result-score { margin: 2px 0 4px; color: var(--accent); font-size: 58px; line-height: 1; letter-spacing: -.05em; }

    .review-controls {
      position: sticky;
      top: env(safe-area-inset-top);
      z-index: 8;
      margin: 0 -4px 14px;
      padding: 8px 4px 10px;
      background: var(--surface);
    }
    .review-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      border-bottom: 1px solid var(--line);
    }
    .review-filter {
      min-height: 44px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }
    .review-filter.active { border-bottom-color: var(--accent); color: var(--accent); }
    .review-search {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--ink);
    }
    .review-search::placeholder { color: #9297a5; }
    .review-card { border-top: 1px solid var(--line); }
    .review-card > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(54px, max-content);
      align-items: start;
      gap: 12px;
      min-height: 72px;
      padding: 12px 0;
      list-style: none;
      cursor: pointer;
    }
    .review-card > summary::-webkit-details-marker { display: none; }
    .review-card > summary > div:first-child { min-width: 0; }
    .review-word { display: grid; align-items: start; gap: 3px; min-width: 0; }
    .review-word b {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: 22px;
      line-height: 1.18;
      letter-spacing: -.02em;
    }
    .review-word b.is-long { font-size: 18px; line-height: 1.25; letter-spacing: -.03em; }
    .review-word b.is-very-long { font-size: 16px; line-height: 1.3; letter-spacing: -.025em; }
    .review-word .phonetic-list {
      color: var(--muted);
      font-family: ui-serif, Georgia, serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .review-meaning { margin: 4px 0 0; color: #4f5564; font-size: 13px; line-height: 1.45; }
    .review-meta { display: grid; justify-items: end; gap: 7px; padding-top: 2px; color: var(--muted); font-size: 11px; text-align: right; }
    .review-action {
      min-width: 48px;
      min-height: 32px;
      padding: 0 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
    }
    .review-action.relearn { border: 1px solid var(--guide); background: var(--accent-soft); color: var(--accent-dark); }
    .review-action.skip { border: 1px solid var(--line); background: var(--surface-2); color: #5c6272; }
    .review-action.remember { min-width: 72px; border: 1px solid #a9dfcf; background: var(--green-soft); color: #0e654e; }
    .review-action:disabled { cursor: default; opacity: .55; }
    .review-action-group { display: grid; width: 72px; gap: 6px; }
    .review-action-group .review-action { width: 100%; }
    .review-meta > span { white-space: nowrap; }
    .review-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .review-tag { display: inline-flex; align-items: center; min-height: 23px; padding: 0 7px; border-radius: 7px; font-size: 10px; font-weight: 800; }
    .review-tag.spelling { background: var(--red-soft); color: #ad2c42; }
    .review-tag.fuzzy { background: var(--coral-soft); color: #ae452d; }
    .review-detail { margin: 0 0 14px var(--section-indent); padding-inline-start: 10px; border-inline-start: 1px solid var(--guide); }
    .review-detail .analysis-details { margin-bottom: 14px; }
    .review-detail .analysis-details .detail-body { margin-inline-start: 0; padding-inline-start: 0; border-inline-start: 0; }
    .review-result-count { color: var(--muted); font-size: 12px; font-weight: 650; }

    .quiz-kind {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding: 6px 9px;
      border-radius: 9px;
      background: var(--coral-soft);
      color: #b3442a;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
    }
    .spelling-card { padding: 22px; text-align: center; }
    .spelling-meaning {
      margin: 5px 0 7px;
      font-size: clamp(22px, 7vw, 30px);
      line-height: 1.4;
      font-weight: 780;
      letter-spacing: -.02em;
    }
    .spelling-hint { color: var(--muted); font-size: 13px; }
    .spelling-meta { display: grid; justify-items: center; gap: 4px; margin-top: 8px; }
    .spelling-meta .phonetic-list, .quiz-phonetic .phonetic-list { justify-items: center; }
    .quiz-phonetic { display: grid; justify-items: center; margin-top: 8px; }
    .spelling-form { margin-top: 19px; }
    .spelling-input {
      width: 100%;
      min-height: 58px;
      padding: 0 16px;
      border: 2px solid #cfd2dc;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 24px;
      font-weight: 720;
      letter-spacing: .04em;
      text-align: center;
      text-transform: lowercase;
    }
    .spelling-input:focus { border-color: var(--accent); outline: 2px solid var(--focus); }
    .spelling-input.correct { border-color: var(--green); background: var(--green-soft); color: #0e654e; }
    .spelling-input.wrong { border-color: var(--red); background: var(--red-soft); color: #a7273b; }
    .spelling-answer {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 14px;
      line-height: 1.55;
    }
    .spelling-answer b { color: var(--accent); font-size: 19px; letter-spacing: .03em; }

    .plan-card { margin-bottom: 14px; padding: 14px 0 0 var(--section-indent); border-top: 1px solid var(--line); }
    .plan-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .plan-row + .plan-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .plan-row h3 { margin: 0 0 3px; font-size: 15px; }
    .plan-row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .stepper { display: grid; grid-template-columns: 40px 46px 40px; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
    .stepper button { height: 40px; border: 0; background: var(--surface-2); color: var(--accent); font-size: 20px; cursor: pointer; }
    .stepper b { text-align: center; }
    .plan-meter { margin-top: 16px; }
    .plan-meter .progress-track { margin: 8px 0 0; }
    .small-button { min-height: 42px; padding: 0 13px; border-radius: 11px; font-size: 13px; }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: var(--nav-offset);
      left: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(100%, 560px);
      height: var(--nav-height);
      margin: 0 auto;
      padding: 7px 12px env(safe-area-inset-bottom);
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .nav-btn {
      display: grid;
      grid-template-rows: 25px 16px;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn svg { width: 21px; height: 21px; }
    .nav-btn.active { color: var(--accent); font-weight: 800; }

    dialog {
      width: min(calc(100% - 24px), 520px);
      max-height: min(82dvh, 720px);
      margin: auto auto 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 22px 22px 0 0;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 -18px 50px rgba(20,24,39,.2);
    }
    dialog::backdrop { background: rgba(20,24,39,.42); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 20px 14px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; }
    .close-btn { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 50%; background: var(--surface-2); cursor: pointer; }
    .dialog-body { max-height: calc(82dvh - 145px); overflow: auto; padding: 14px 18px 22px; }
    .book-item { display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px var(--section-indent); border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: start; cursor: pointer; }
    .book-item:hover, .book-item.active { background: var(--accent-soft); }
    .book-item h3 { margin: 0 0 3px; font-size: 15px; }
    .book-item p { margin: 0; color: var(--muted); font-size: 12px; }
    .check { color: var(--accent); font-size: 18px; font-weight: 900; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding-top: 8px; }
    .format-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: calc(82px + env(safe-area-inset-bottom) + var(--nav-offset));
      left: 18px;
      z-index: 50;
      max-width: 520px;
      margin: auto;
      padding: 13px 15px;
      border-radius: 12px;
      background: #202433;
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: var(--shadow);
      animation: toast-in .18s ease-out both;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(244,245,247,.78);
      backdrop-filter: blur(8px);
    }
    .loading-panel {
      display: grid;
      min-width: min(270px, calc(100vw - 48px));
      justify-items: center;
      padding: 25px 22px 22px;
      border: 1px solid var(--guide);
      border-radius: 19px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 13px;
      border: 4px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: loading-spin .72s linear infinite;
    }
    .loading-panel b { margin-bottom: 5px; font-size: 16px; }
    .loading-panel span { color: var(--muted); font-size: 12px; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    body.is-loading { overflow: hidden; }
    .hidden { display: none !important; }
    .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

    @media (min-width: 620px) {
      :root { --nav-offset: 18px; }
      body { padding: 18px 0; }
      .app { min-height: calc(100dvh - 36px); border-radius: 24px; }
      .bottom-nav { border-radius: 0 0 24px 24px; }
      .bottom-nav::after {
        content: "";
        position: absolute;
        inset: 100% 0 auto;
        height: var(--nav-offset);
        background: var(--bg);
        pointer-events: none;
      }
      dialog { margin-bottom: max(18px, calc((100dvh - 760px) / 2)); border-radius: 22px; }
    }
    @media (pointer: coarse) {
      .audio-control::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: max(100%, 44px);
        height: 44px;
        transform: translate(-50%, -50%);
      }
      /* Keep adjacent accent rows' touch areas separate. */
      .phonetic-audio::after { height: 100%; }
      .phonetic-audio-group { gap: 6px; }
      /* Expand into the left gutter without covering quick-lookup words. */
      .tts-btn::after { inset: 0 0 auto auto; transform: none; }
      .example, .phrase-item { min-height: 44px; }
    }
    @media (max-width: 380px) {
      :root { --page-gutter: 14px; --section-indent: 9px; }
      .header { gap: 6px; }
      .search-input { padding-inline: 9px; }
      .search-btn { padding-inline: 12px; }
      .streak span { display: none; }
      .book-switch { padding: 0 5px; }
      .review-card > summary { grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; }
      .stats-quiz-head { display: grid; }
      .stats-quiz-head .primary { width: 100%; }
      .calendar-day { min-height: 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="icon-audio-speaker" viewBox="0 0 24 24">
      <path d="M11 5 6 9H3v6h3l5 4V5M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
    </symbol>
    <symbol id="icon-audio-stop" viewBox="0 0 24 24">
      <path d="M9 5v14m6-14v14"/>
    </symbol>
  </svg>
  <div class="app">
    <header class="header">
      <div class="brand" aria-label="词阶"><img src="favicon.svg" alt="" aria-hidden="true">词阶</div>
      <button class="book-switch" id="bookSwitch" type="button" aria-label="切换单词书">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v16H7.5A2.5 2.5 0 0 0 5 20.5v-16Z" stroke="currentColor" stroke-width="1.8"/><path d="M5 20.5A1.5 1.5 0 0 0 6.5 22H19v-4" stroke="currentColor" stroke-width="1.8"/></svg>
        <span id="bookName">载入中</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 9 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="streak" aria-label="连续学习天数"><span>🔥 连续</span><b id="streakCount">0</b><span>天</span></div>
    </header>

    <main id="main">
      <div id="studyView"></div>
      <div id="lookupView" hidden></div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn active" data-tab="today" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h16M7 3v3m10-3v3M6 5h12a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m8.5 14 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-btn" data-tab="review" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H19v-4M8 8h7m-7 4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>回顾</span>
      </button>
      <button class="nav-btn" data-tab="stats" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 20v-7h4v7H5Zm5 0V4h4v16h-4Zm5 0v-11h4v11h-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>统计</span>
      </button>
      <button class="nav-btn" data-tab="plan" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 7v5l3 2M16 3h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>计划</span>
      </button>
    </nav>
  </div>

  <dialog id="bookDialog">
    <div class="dialog-head"><h2>切换单词书</h2><button class="close-btn" type="button" aria-label="关闭" data-close-dialog>✕</button></div>
    <div class="dialog-body">
      <div id="bookList"></div>
      <div class="dialog-actions">
        <button class="secondary small-button" type="button" id="importButton">导入 JSON</button>
        <button class="ghost small-button" type="button" id="templateButton">下载格式样例</button>
      </div>
      <input class="hidden" id="fileInput" type="file" accept="application/json,.json">
      <p class="format-note">音频字段支持纯 Base64 MP3 或 <code>data:audio/mpeg;base64,...</code>。数据只保存在当前浏览器的 IndexedDB 中。</p>
    </div>
  </dialog>
  <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="toast hidden" id="toast" role="status"></div>
  <div class="loading-overlay hidden" id="loadingOverlay" role="status" aria-live="assertive" aria-hidden="true">
    <div class="loading-panel">
      <div class="loading-spinner" aria-hidden="true"></div>
      <b id="loadingTitle">正在加载词书</b>
      <span>首次加载可能需要一点时间，请稍候</span>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const DB_NAME = "wordstep-db";
    const DB_VERSION = 2;
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const main = $("#studyView");
    const lookupView = $("#lookupView");
    const bookDialog = $("#bookDialog");
    const state = { db: null, books: [], book: null, settings: null, session: null, tab: "today", flowOpen: false, revealed: false, quizAnswered: false, selectedAnswer: null, reviewFilter: "consolidate", reviewQuery: "", statsMonth: localDate().slice(0, 7), statsQuiz: null, studyActionPending: false, lookupWord: null, lookupReturnContext: null, ttsPlayback: null };
    let lookupRequestId = 0;
    let lookupPendingStatus = null;

    const REMOVED_BUILTIN_BOOK_IDS = ["cet6-focus", "business-core"];
    const CUSTOM_BOOK_CATALOG_KEY = "custom-book-catalog";
    const VOICE_ENDPOINT_B64 = "aHR0cHM6Ly9kaWN0LnlvdWRhby5jb20vZGljdHZvaWNlP2F1ZGlvPQ==";

    // hight_school_2000 is a historical ID; keep it stable for saved progress.
    const BUNDLED_BOOKS = [
      { order: 1, id: "middle_school", name: "初中英语 2000", description: "初中英语核心词汇，含英美音标、核心释义、详细解析、短语、双语例句、辨析与构词记忆", wordCount: 1839, version: "2026.11.27.1", url: "./middle_school_2000.json" },
      { order: 2, id: "hight_school_2000", name: "高中英语 2000", description: "高中英语、高考核心词汇，不含初中阶段的词汇。增加了AI讲解，更全面解析单词含义。", wordCount: 2239, version: "2026.11.26.2", url: "./hight_school_2000.json" },
      { order: 3, id: "cet4_1000", name: "CET4 1000", description: "大学英语四级词汇，共 999 词；四级词汇与初中、高中词汇重合度很高，本词书不包含初中、高中词汇，如需完整学习四级词汇，请先学初中、高中词汇。", wordCount: 999, version: "2026.11.27.1", url: "./cet4_1000.json" },
      { order: 4, id: "cet6_3000", name: "CET6 3000", description: "大学英语六级词汇，不包含四级的词汇，面向已具备四级英语能力的进阶学习者。", wordCount: 3166, version: "2026.11.27.1", url: "./cet6_3000.json" },
      { order: 5, id: "toefl_4000", name: "TOEFL 4000", description: "面向中高级英语学习者和准备出国留学的学生；已剔除初中、高中、CET4及CET6词书中已有的词汇，实际收录3983词。", wordCount: 3983, version: "2026.11.27.1", url: "./toefl_4000.json" },
      { order: 6, id: "gre_2000", name: "GRE 2000", description: "GRE进阶词汇；已剔除初中、高中、CET4、CET6及TOEFL词书中已有的词汇，实际收录1902词。", wordCount: 1902, version: "2026.11.27.1", url: "./gre_2000.json" },
      { order: 7, id: "kaoyan_2", name: "考研英语二", description: "按主题模块排列的考研英语二进阶高频词汇，覆盖宏观经济与市场现象、企业管理与债务、数据分析与研究方法三大主题。", wordCount: 484, version: "2026.09.23.1", url: "./kaoyan_2.json" },
      { order: 8, id: "n2607", name: "N2607", description: "AI、技术、商业与通识阅读词汇，含短语、词源与多义例句", wordCount: 748, version: "2026.11.27.1", url: "./n2607.json" },
      { order: 9, id: "n2608", name: "N2608", description: "AI、技术、商业与通识阅读进阶词汇，含短语和例句", wordCount: 1361, version: "2026.11.27.1", url: "./n2608.json" },
      { order: 10, id: "plant1000", name: "Plant 1000", description: "植物主题词汇，涵盖花卉、树木、蔬果与药用植物，含分类、形态、分布、典故、特性及例句", wordCount: 1000, version: "2026.11.27.1", url: "./plant1000.json" }
    ];

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("books")) db.createObjectStore("books", { keyPath: "id" });
          if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
          if (!db.objectStoreNames.contains("progress")) db.createObjectStore("progress", { keyPath: "key" });
          if (!db.objectStoreNames.contains("sessions")) db.createObjectStore("sessions", { keyPath: "id" });
          if (!db.objectStoreNames.contains("activity")) db.createObjectStore("activity", { keyPath: "id" });
          if (!db.objectStoreNames.contains("quizResults")) db.createObjectStore("quizResults", { keyPath: "id" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function dbRequest(storeName, mode, action) {
      return new Promise((resolve, reject) => {
        const tx = state.db.transaction(storeName, mode);
      const store = tx.objectStore(Array.isArray(storeName) ? storeName[0] : storeName);
        let request;
      try { request = action(store, tx); } catch (error) { tx.abort(); reject(error); return; }
        let result;
        if (request) {
          request.onsuccess = () => { result = request.result; };
          request.onerror = () => reject(request.error);
        }
        tx.oncomplete = () => resolve(result);
        tx.onabort = () => reject(tx.error || new Error("保存已中止，请重试"));
        tx.onerror = () => reject(tx.error);
      });
    }
    const get = (store, key) => dbRequest(store, "readonly", s => s.get(key));
    const getAll = store => dbRequest(store, "readonly", s => s.getAll());
    const getAllKeys = store => dbRequest(store, "readonly", s => s.getAllKeys());
    const put = (store, value) => dbRequest(store, "readwrite", s => s.put(value));
    const remove = (store, key) => dbRequest(store, "readwrite", s => s.delete(key));

    function storageErrorMessage(error) {
      return error?.name === "QuotaExceededError"
        ? "本机存储空间不足，请释放空间或使用不含音频的较小词书后重试"
        : `保存失败，请重试${error?.message ? `：${error.message}` : ""}`;
    }

    function normalizeSettings(settings) {
      const next = { key: "settings", activeBookId: BUNDLED_BOOKS[0].id, createdAt: localDate(), ...(settings || {}) };
      const daily = Number(next.dailyNew);
      next.dailyNew = Number.isFinite(daily) && daily > 0 ? Math.max(1, Math.min(50, Math.floor(daily))) : 20;
      next.key = "settings";
      if (typeof next.activeBookId !== "string" || !next.activeBookId) next.activeBookId = BUNDLED_BOOKS[0].id;
      if (typeof next.createdAt !== "string" || !next.createdAt) next.createdAt = localDate();
      return next;
    }

    function localDate(offset = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offset);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric" }).format(new Date(y, m - 1, d));
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[c]);
    }
    function audioIconHTML() {
      return '<svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use class="audio-speaker" href="#icon-audio-speaker"/><use class="audio-stop" href="#icon-audio-stop"/></svg>';
    }

    function pronunciationButtonHTML(word, type, showAccent = false) {
      const accent = type === 1 ? "英" : "美";
      return `<button class="audio-control phonetic-audio" type="button" data-pronunciation-word="${esc(word.id)}" data-pronunciation-type="${type}" aria-label="播放 ${esc(word.word)} 的${accent}音" aria-pressed="false">${showAccent ? accent : ""}${audioIconHTML()}</button>`;
    }
    function phoneticWithAudioHTML(word, compact = false, showBothAccents = false) {
      const raw = String(word?.phonetic || "").trim();
      if (!raw && !showBothAccents) return "";
      const prepared = raw.replace(/[ \t]+(?=(?:英|美)(?:音|式)?\s*[\/\[])/g, "\n");
      const lines = prepared.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const missingAccents = new Set(showBothAccents ? [1, 2] : []);
      const body = lines.map(line => {
        const isBritish = /^(?:英|英音|英式|UK|British)(?:\s|\/|\[|:|：|$)/i.test(line);
        const isAmerican = /^(?:美|美音|美式|US|American)(?:\s|\/|\[|:|：|$)/i.test(line);
        if (!isAmerican) missingAccents.delete(1);
        if (!isBritish) missingAccents.delete(2);
        const buttons = isBritish
          ? pronunciationButtonHTML(word, 1)
          : isAmerican
            ? pronunciationButtonHTML(word, 2)
            : `<span class="phonetic-audio-group">${pronunciationButtonHTML(word, 1, true)}${pronunciationButtonHTML(word, 2, true)}</span>`;
        return `<div class="phonetic-line"><span class="phonetic-text">${esc(line)}</span>${buttons}</div>`;
      }).join("");
      const extraButtons = [...missingAccents].map(type => pronunciationButtonHTML(word, type, true)).join("");
      return `<div class="phonetic-list ${compact ? "compact" : ""}">${body}${extraButtons ? `<div class="phonetic-line">${extraButtons}</div>` : ""}</div>`;
    }
    function hasRecordedAudio(word) {
      return Boolean(String(word?.audioBase64 || word?.audio || "").trim());
    }
    function consolidationTypes(progress) {
      if (!progress) return [];
      if (Object.prototype.hasOwnProperty.call(progress, "consolidation")) {
        const flags = progress.consolidation && typeof progress.consolidation === "object" ? progress.consolidation : {};
        return ["spelling", "fuzzy"].filter(type => Boolean(flags[type]));
      }
      const types = [];
      if ((progress.spellingWrong || 0) > 0) types.push("spelling");
      if ((progress.wrong || 0) > (progress.spellingWrong || 0)) types.push("fuzzy");
      return types;
    }
    function markForConsolidation(progress, type) {
      const flags = {};
      consolidationTypes(progress).forEach(existingType => { flags[existingType] = Date.now(); });
      flags[type] = Date.now();
      progress.consolidation = flags;
    }
    function consolidationTime(progress) {
      const flags = progress?.consolidation;
      if (!flags || typeof flags !== "object") return progress?.lastTestAt || progress?.lastSeenAt || 0;
      return Math.max(0, ...Object.values(flags).map(Number).filter(Number.isFinite));
    }
    function shuffle(items) {
      const a = [...items];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function announce(message) {
      const status = $("#status");
      status.textContent = message;
    }

    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.remove("hidden");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.add("hidden"), 2600);
    }

    function setLoading(active, title = "正在加载词书") {
      const overlay = $("#loadingOverlay");
      $("#loadingTitle").textContent = title;
      overlay.classList.toggle("hidden", !active);
      overlay.setAttribute("aria-hidden", String(!active));
      document.body.classList.toggle("is-loading", active);
    }

    function waitForPaint() {
      return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    function withBundledMetadata(book, source) {
      return { ...book, words: normalizeWords(book.words), id: source.id, name: source.name, description: source.description, wordCount: book.words.length, order: source.order, version: source.version, builtin: true };
    }

    function lookupKey(value) {
      return String(value ?? "").trim().toLowerCase().replace(/’/g, "'");
    }

    function bookHeadwords(words) {
      return [...new Set(words.map(word => lookupKey(word?.word)).filter(Boolean))].sort();
    }

    function lookupIndexKey(bookId) {
      return `lookup-headwords:${bookId}`;
    }

    function saveBookWithLookupIndex(book) {
      const index = { key: lookupIndexKey(book.id), headwords: bookHeadwords(book.words) };
      return dbRequest(["books", "meta"], "readwrite", (store, tx) => {
        tx.objectStore("meta").put(index);
        return store.put(book);
      });
    }

    async function cachedLookupHeadwords(bookId) {
      const key = lookupIndexKey(bookId);
      const index = await get("meta", key);
      if (Array.isArray(index?.headwords)) return index.headwords;

      // Build a legacy cache's index once. Recheck inside the transaction in case
      // a book was imported or refreshed in another tab since the initial read.
      let headwords;
      try {
        await dbRequest(["books", "meta"], "readwrite", (books, tx) => {
          const meta = tx.objectStore("meta");
          const existing = meta.get(key);
          existing.onsuccess = () => {
            if (Array.isArray(existing.result?.headwords)) {
              headwords = existing.result.headwords;
              return;
            }
            const book = books.get(bookId);
            book.onsuccess = () => {
              if (!Array.isArray(book.result?.words) || !book.result.words.length) return;
              headwords = bookHeadwords(book.result.words);
              meta.put({ key, headwords });
            };
          };
        });
      } catch (error) {
        if (!headwords) throw error;
        console.warn("无法保存查词索引", error);
      }
      if (!headwords) throw new Error("无法读取词书索引");
      return headwords;
    }

    async function loadBundledBook(source) {
      const existing = await get("books", source.id);
      if (existing?.version === source.version && Array.isArray(existing.words) && existing.words.length) {
        return withBundledMetadata(existing, source);
      }
      try {
        const response = await fetch(source.url, { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const book = withBundledMetadata(await response.json(), source);
        await saveBookWithLookupIndex(book);
        return book;
      } catch (error) {
        if (Array.isArray(existing?.words) && existing.words.length) {
          console.warn(`无法更新内置词书 ${source.id}，使用本地缓存`, error);
          return withBundledMetadata(existing, source);
        }
        throw error;
      }
    }

    async function loadBookById(id) {
      const source = BUNDLED_BOOKS.find(book => book.id === id);
      if (source) return loadBundledBook(source);
      const book = await get("books", id);
      if (!book?.words?.length) throw new Error("词书不存在或内容为空");
      return { ...book, words: normalizeWords(book.words), wordCount: book.words.length };
    }

    function customBookMetadata(book) {
      return {
        id: book.id,
        name: book.name,
        description: book.description || "自定义 JSON 词书",
        wordCount: book.words?.length || book.wordCount || 0,
        importedAt: book.importedAt || 0,
        builtin: false
      };
    }

    async function getCustomBookCatalog(cachedIds) {
      let catalog = await get("meta", CUSTOM_BOOK_CATALOG_KEY);
      if (!catalog) {
        const bundledIds = new Set(BUNDLED_BOOKS.map(book => book.id));
        const ids = cachedIds ?? await getAllKeys("books");
        const books = (await Promise.all(ids.filter(id => !bundledIds.has(id)).map(id => get("books", id))))
          .filter(book => book && !book.builtin)
          .map(customBookMetadata);
        catalog = { key: CUSTOM_BOOK_CATALOG_KEY, books };
        await put("meta", catalog);
      }
      return Array.isArray(catalog.books) ? catalog.books : [];
    }

    async function saveCustomBookMetadata(book) {
      if (BUNDLED_BOOKS.some(source => source.id === book.id)) return;
      const books = await getCustomBookCatalog();
      const next = books.filter(item => item.id !== book.id);
      next.push(customBookMetadata(book));
      await put("meta", { key: CUSTOM_BOOK_CATALOG_KEY, books: next });
    }

    async function getBookCatalog(cachedIds) {
      const importedBooks = (await getCustomBookCatalog(cachedIds))
        .sort((a, b) => (a.importedAt || 0) - (b.importedAt || 0))
        .map((book, index) => ({
          order: 1000 + index,
          ...book
        }));
      return [...BUNDLED_BOOKS, ...importedBooks].sort((a, b) => a.order - b.order);
    }

    async function init() {
      try {
        state.db = await openDB();
        for (const id of REMOVED_BUILTIN_BOOK_IDS) {
          await dbRequest(["books", "meta"], "readwrite", (books, tx) => {
            tx.objectStore("meta").delete(lookupIndexKey(id));
            return books.delete(id);
          });
        }
        state.settings = normalizeSettings(await get("meta", "settings"));
        try {
          state.book = await loadBookById(state.settings.activeBookId);
        } catch (error) {
          console.warn(`无法载入当前词书 ${state.settings.activeBookId}，改用默认词书`, error);
          state.book = await loadBookById(BUNDLED_BOOKS[0].id);
        }
        state.books = BUNDLED_BOOKS.map(book => ({ ...book }));
        state.settings.activeBookId = state.book.id;
        await put("meta", state.settings);
        state.session = await getSession();
        bindStaticEvents();
        await refreshHeader();
        render();
      } catch (error) {
        console.error(error);
        setStudyView(`<section class="screen"><div class="card empty"><h2>无法启动本地数据库</h2><p>请确认浏览器允许 IndexedDB，或换用非隐私浏览模式。</p></div></section>`);
      }
    }

    function bindStaticEvents() {
      $("#bookSwitch").addEventListener("click", openBooks);
      $("[data-close-dialog]").addEventListener("click", () => bookDialog.close());
      $("#importButton").addEventListener("click", () => $("#fileInput").click());
      $("#fileInput").addEventListener("change", importBook);
      $("#templateButton").addEventListener("click", downloadTemplate);
      const appMain = $("#main");
      appMain.addEventListener("submit", event => {
        const form = event.target;
        if (!form.matches("[data-lookup-form]")) return;
        event.preventDefault();
        const input = form.elements.namedItem("query");
        return performLookup(input.value, input, $("[role=status]", form));
      });
      appMain.addEventListener("click", event => {
        const lookupButton = event.target.closest?.("[data-lookup-word]");
        if (lookupButton) return openLookupFromContext(lookupButton.dataset.lookupWord, lookupButton);
        const ttsButton = event.target.closest?.("[data-tts-text]");
        if (ttsButton) return playTTS(ttsButton.dataset.ttsText, ttsButton);
        const button = event.target.closest?.("[data-pronunciation-type]");
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        const word = lookupView.contains(button)
          ? state.lookupWord?.word
          : state.book.words.find(item => item.id === button.dataset.pronunciationWord);
        if (word) return playRemotePronunciation(word, Number(button.dataset.pronunciationType), button);
      });
      appMain.addEventListener("toggle", event => {
        const card = event.target;
        if (card.matches("details") && !card.open && card.contains(state.ttsPlayback?.button ?? null)) stopTTS();
      }, true);
      $$(".nav-btn").forEach(btn => btn.addEventListener("click", () => navigateToTab(btn.dataset.tab)));
    }

    function recentReviewPlan(allProgress) {
      const availableWordIds = new Set(state.book.words.map(word => word.id));
      const eligible = allProgress.filter(progress => progress.learnedDate
        && progress.learnedDate < localDate()
        && !progress.relearnQueuedAt
        && !progress.skippedAt
        && availableWordIds.has(progress.wordId));
      const sourceDate = eligible.reduce((latest, progress) => progress.learnedDate > latest ? progress.learnedDate : latest, "");
      return {
        sourceDate: sourceDate || null,
        reviewIds: sourceDate ? eligible.filter(progress => progress.learnedDate === sourceDate).map(progress => progress.wordId) : []
      };
    }

    function normalizeSession(session) {
      const s = session;
      if (!Array.isArray(s.newIds)) {
        const familiar = new Set(Array.isArray(s.familiarIds) ? s.familiarIds : []);
        const removed = new Set(Array.isArray(s.removedIds) ? s.removedIds : []);
        s.newIds = [...new Set([s.learnQueue, s.quizQueue, s.learnDone].filter(Array.isArray).flat())]
          .filter(id => typeof id === "string" && !familiar.has(id) && !removed.has(id));
      }
      const array = key => { s[key] = Array.isArray(s[key]) ? s[key].filter(id => typeof id === "string" && id) : []; };
      const missingLearnQueue = !Array.isArray(s.learnQueue);
      const missingQuizQueue = !Array.isArray(s.quizQueue);
      for (const key of ["reviewIds", "reviewDone", "newIds", "learnDone", "familiarIds", "removedIds"]) array(key);
      if (!Array.isArray(s.freshIds)) s.freshIds = [...s.newIds];
      array("freshIds");
      if (!Array.isArray(s.plannedNewIds)) s.plannedNewIds = [...new Set([...s.newIds, ...s.learnDone, ...s.familiarIds])];
      if (!Array.isArray(s.plannedReviewIds)) s.plannedReviewIds = [...new Set([...s.reviewIds, ...s.reviewDone])];
      array("plannedNewIds"); array("plannedReviewIds");
      s.quizAnswers = Array.isArray(s.quizAnswers) ? s.quizAnswers.filter(a => a && typeof a.wordId === "string").map(a => ({ ...a, type: a.type === "spelling" ? "spelling" : "choice" })) : [];
      for (const key of ["repeats", "quizOptions", "quizRetries", "spellingRetries"]) {
        if (!s[key] || typeof s[key] !== "object" || Array.isArray(s[key])) s[key] = {};
      }
      for (const key of ["reviewIndex", "learnIndex", "quizIndex", "reviewKnown", "quizCorrect", "quizWrong", "spellingCorrect", "spellingWrong"]) {
        s[key] = Number.isFinite(s[key]) ? Math.max(0, Math.floor(s[key])) : 0;
      }
      s.completed = s.completed === true || s.stage === "complete";
      if (s.completed) s.stage = "complete";
      else if (!["review", "learn", "quiz"].includes(s.stage)) s.stage = s.reviewIds.length > s.reviewIndex ? "review" : "learn";
      if (!s.completed) s.quizVersion = 2;
      s.quizMode = s.quizMode === "spelling" ? "spelling" : "choice";
      if (missingLearnQueue) s.learnQueue = [...s.newIds];
      if (missingQuizQueue) s.quizQueue = s.stage === "quiz" ? [...s.newIds] : [];
      array("learnQueue"); array("quizQueue");
      if (!s.completed) {
        const available = new Set(state.book.words.map(word => word.id));
        s.removedIds = [...new Set([...s.removedIds, ...s.plannedNewIds.filter(id => !available.has(id)), ...s.plannedReviewIds.filter(id => !available.has(id))])];
        for (const [queue, index] of [["reviewIds", "reviewIndex"], ["learnQueue", "learnIndex"], ["quizQueue", "quizIndex"]]) {
          const old = s[queue];
          const cursor = Math.min(s[index], old.length);
          s[index] = old.slice(0, cursor).filter(id => available.has(id)).length;
          s[queue] = old.filter(id => available.has(id));
        }
        s.newIds = s.newIds.filter(id => available.has(id));
      }
      return s;
    }

    async function upgradeSession(session) {
      const previous = JSON.stringify(session);
      normalizeSession(session);
      if (!Object.prototype.hasOwnProperty.call(session, "reviewSourceDate")) {
        if (session.reviewIds.length) session.reviewSourceDate = localDate(-1);
        else {
          const untouched = !session.completed && session.reviewIndex === 0 && !session.reviewDone.length
            && session.learnIndex === 0 && session.quizIndex === 0 && !session.quizAnswers.length;
          const allProgress = untouched ? (await getAll("progress")).filter(p => p.bookId === state.book.id) : [];
          const plan = recentReviewPlan(allProgress);
          session.reviewSourceDate = plan.sourceDate;
          if (untouched && plan.reviewIds.length) {
            session.reviewIds = plan.reviewIds;
            session.plannedReviewIds = [...plan.reviewIds];
            session.stage = "review";
          }
        }
      }
      if (previous !== JSON.stringify(session)) await put("sessions", session);
      return session;
    }

    async function getSession() {
      const id = `${state.book.id}:${localDate()}`;
      let session = await get("sessions", id);
      if (session) return upgradeSession(session);
      const allProgress = (await getAll("progress")).filter(p => p.bookId === state.book.id);
      const progressByWord = new Map(allProgress.map(p => [p.wordId, p]));
      const reviewPlan = recentReviewPlan(allProgress);
      const reviewIds = reviewPlan.reviewIds;
      const pendingWords = state.book.words.filter(word => {
        const progress = progressByWord.get(word.id);
        return !progress?.skippedAt && (!progress?.learnedDate || progress.relearnQueuedAt);
      });
      pendingWords.sort((a, b) => {
        const aQueued = progressByWord.get(a.id)?.relearnQueuedAt || 0;
        const bQueued = progressByWord.get(b.id)?.relearnQueuedAt || 0;
        if (Boolean(aQueued) !== Boolean(bQueued)) return aQueued ? 1 : -1;
        return aQueued && bQueued ? aQueued - bQueued : 0;
      });
      const newIds = pendingWords.slice(0, state.settings.dailyNew).map(w => w.id);
      const freshIds = newIds.filter(wordId => !progressByWord.get(wordId)?.learnedDate);
      session = {
        id, bookId: state.book.id, date: localDate(), reviewSourceDate: reviewPlan.sourceDate, reviewIds, newIds,
        stage: reviewIds.length ? "review" : newIds.length ? "learn" : "complete",
        plannedNewIds: [...newIds], plannedReviewIds: [...reviewIds], removedIds: [],
        reviewIndex: 0, reviewDone: [], reviewKnown: 0,
        learnQueue: [...newIds], learnIndex: 0, learnDone: [], freshIds, familiarIds: [], repeats: {},
        quizVersion: 2, quizMode: "choice", quizQueue: [], quizIndex: 0, quizCorrect: 0, quizWrong: 0, quizAnswers: [], quizOptions: {}, quizRetries: {}, spellingRetries: {}, spellingCorrect: 0, spellingWrong: 0,
        completed: !reviewIds.length && !newIds.length, createdAt: Date.now()
      };
      await put("sessions", session);
      if (session.completed) await saveActivity(session);
      return session;
    }

    function currentWord() {
      if (!state.session) return null;
      let id;
      if (state.session.stage === "review") id = state.session.reviewIds[state.session.reviewIndex];
      if (state.session.stage === "learn") id = state.session.learnQueue[state.session.learnIndex];
      if (state.session.stage === "quiz") id = state.session.quizQueue[state.session.quizIndex];
      return state.book.words.find(w => w.id === id) || null;
    }

    function sessionCounts() {
      const s = state.session;
      const plannedNew = new Set(s.plannedNewIds || s.newIds);
      const plannedReview = new Set(s.plannedReviewIds || s.reviewIds);
      const removed = new Set(s.removedIds || []);
      const familiar = new Set(s.familiarIds || []);
      const learned = new Set(s.learnDone);
      const reviewed = new Set(s.reviewDone);
      const rounds = s.quizVersion === 2 ? ["choice", "spelling"] : ["choice"];
      const answers = new Set(s.quizAnswers.map(a => `${a.type || "choice"}:${a.wordId}`));
      const total = plannedReview.size + plannedNew.size * (1 + rounds.length);
      let done = [...plannedReview].filter(id => reviewed.has(id) || removed.has(id)).length;
      for (const id of plannedNew) {
        if (removed.has(id)) { done += 1 + rounds.length; continue; }
        if (learned.has(id) || familiar.has(id)) done++;
        for (const type of rounds) if (familiar.has(id) || answers.has(`${type}:${id}`)) done++;
      }
      const percent = s.completed ? 100 : total ? Math.min(99, Math.round(done / total * 100)) : 0;
      return { review: s.reviewIds.length, learn: [...plannedNew].filter(id => !removed.has(id)).length,
        quiz: s.newIds.length * rounds.length, total, done: Math.min(total, done), percent,
        exempt: [...plannedNew].filter(id => familiar.has(id) || removed.has(id)).length };
    }

    async function wordFlashPools(book) {
      const [progress, keys] = await Promise.all([getAll("progress"), getAllKeys("books")]);
      const progressByWord = new Map(progress.filter(item => item.bookId === book.id).map(item => [item.wordId, item]));
      const outside = [], unlearned = [], learned = [], consolidate = [];
      for (const word of book.words) {
        const item = progressByWord.get(word.id);
        if (item?.skippedAt) continue;
        const pool = consolidationTypes(item).length ? consolidate : item?.learnedDate && !item.relearnQueuedAt ? learned : unlearned;
        pool.push({ word, bookName: book.name });
      }
      const localTerms = new Set(bookHeadwords(book.words));
      const otherKeys = keys.filter(id => id !== book.id && !REMOVED_BUILTIN_BOOK_IDS.includes(id));
      const catalog = otherKeys.length ? await getBookCatalog(keys) : [];
      const otherBooks = catalog.filter(item => otherKeys.includes(item.id));
      const indexes = await Promise.allSettled(otherBooks.map(item => cachedLookupHeadwords(item.id)));
      indexes.forEach((index, i) => {
        if (index.status !== "fulfilled") return;
        const { id: bookId, name: bookName } = otherBooks[i];
        for (const term of index.value) {
          if (localTerms.has(term)) continue;
          localTerms.add(term);
          outside.push({ term, bookId, bookName });
        }
      });
      return [{ items: outside, weight: 30 }, { items: unlearned, weight: 20 },
        { items: learned, weight: 30 }, { items: consolidate, weight: 20 }].filter(pool => pool.items.length);
    }

    function pickFlashWord(pools, previous = null) {
      let roll = Math.random() * pools.reduce((sum, pool) => sum + pool.weight, 0);
      for (const { items, weight } of pools) {
        if (roll < weight) {
          const skip = items.length > 1 ? items.indexOf(previous) : -1;
          const index = Math.floor(Math.random() * (items.length - Number(skip >= 0)));
          return items[skip >= 0 && index >= skip ? index + 1 : index];
        }
        roll -= weight;
      }
      return null;
    }

    function bindWordFlash() {
      const track = $("#wordFlashTrack");
      const entry = $("#wordFlashEntry");
      const prevButton = $("#previousFlashWord");
      const nextButton = $("#nextFlashWord");
      const book = state.book;
      const history = [];
      let position = -1, pools, pending = false, gesture, ignoreSwipeClick = false;
      const isCurrent = () => track.isConnected && state.book === book && state.tab === "today" && !state.lookupWord;
      const show = () => {
        const { word, bookName } = history[position];
        stopScreenPlayback();
        entry.innerHTML = `<button class="word-flash-word" type="button" lang="en" aria-label="查询 ${esc(word.word)}">${esc(word.word)}</button>
          ${phoneticWithAudioHTML(word, true, true)}
          ${word.meaning ? `<span>${esc(word.meaning)}</span>` : ""}
          <span class="sub">${esc(bookName)}</span>`;
      };
      const move = async direction => {
        if (!isCurrent() || pending || position + direction < 0) return;
        if (position + direction < history.length) {
          position += direction;
          show();
          prevButton.disabled = position === 0;
          return;
        }
        pending = true;
        try {
          pools ??= await wordFlashPools(book);
          if (!isCurrent()) return;
          const pick = pickFlashWord(pools, history[position]?.pick);
          if (!pick) {
            entry.textContent = "暂无可抽取的单词";
            return;
          }
          const word = pick.word ?? await loadLookupWord(pick.bookId, pick.term).catch(() => ({ word: pick.term }));
          if (!isCurrent()) return;
          history.push({ pick, word, bookName: pick.bookName });
          position += 1;
          show();
        } catch (error) {
          console.warn("无法读取单词快闪", error);
          if (isCurrent()) entry.textContent = "暂时无法抽词，请重试";
        } finally {
          pending = false;
          if (isCurrent()) {
            prevButton.disabled = position <= 0;
            nextButton.disabled = pools?.length === 0;
          }
        }
      };
      prevButton.addEventListener("click", () => move(-1));
      nextButton.addEventListener("click", () => move(1));
      entry.addEventListener("click", event => {
        const current = history[position];
        if (!isCurrent() || !current) return;
        const audioButton = event.target.closest("[data-pronunciation-type]");
        if (audioButton) {
          event.stopPropagation();
          return playRemotePronunciation(current.word, Number(audioButton.dataset.pronunciationType), audioButton);
        }
        const wordButton = event.target.closest(".word-flash-word");
        if (!wordButton) return;
        const { word, pick, bookName } = current;
        const match = word.id != null ? { word, bookId: pick.bookId ?? book.id, bookName } : null;
        return performLookup(word.word, wordButton, null, match);
      });
      track.addEventListener("click", event => {
        if (!ignoreSwipeClick || !event.detail) return;
        event.stopPropagation();
        ignoreSwipeClick = false;
      }, true);
      track.addEventListener("pointerdown", event => {
        ignoreSwipeClick = false;
        if (event.pointerType !== "touch" || !event.isPrimary) return;
        gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
        if (!event.target.closest("button")) track.setPointerCapture(event.pointerId);
      });
      track.addEventListener("pointerup", event => {
        if (gesture?.id !== event.pointerId) return;
        const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
        gesture = null;
        if (Math.abs(dx) < 36 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;
        ignoreSwipeClick = true;
        return move(dx < 0 ? 1 : -1);
      });
      track.addEventListener("lostpointercapture", event => {
        if (gesture?.id === event.pointerId) gesture = null;
      });
      return move(1);
    }
