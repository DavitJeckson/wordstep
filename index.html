<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="词阶：每天复习、学习、测验，进度保存在本机。">
  <title>词阶 · 每日单词学习</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --ink: #141827;
      --muted: #697083;
      --line: #e3e6eb;
      --indigo: #4f46e5;
      --indigo-dark: #3730a3;
      --indigo-soft: #eef2ff;
      --coral: #ff704d;
      --coral-soft: #fff0eb;
      --green: #158466;
      --green-soft: #e7f7f1;
      --red: #d93d55;
      --red-soft: #fff0f2;
      --shadow: 0 12px 30px rgba(28, 33, 48, .08), 0 2px 8px rgba(28, 33, 48, .05);
      --radius: 20px;
      font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -10%, rgba(79,70,229,.08), transparent 32rem),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(79,70,229,.3);
      outline-offset: 2px;
    }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: rgba(255,255,255,.84);
      box-shadow: 0 0 0 1px rgba(20,24,39,.04), 0 0 60px rgba(20,24,39,.08);
      position: relative;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 72px;
      padding: max(14px, env(safe-area-inset-top)) 18px 12px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--indigo);
      font-size: 25px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand img {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
    }

    .book-switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      height: 42px;
      padding: 0 11px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }
    .book-switch:hover { background: var(--surface-2); }
    .book-switch span {
      overflow: hidden;
      color: #353a49;
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .streak {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: max-content;
      color: #3d4251;
      font-size: 13px;
      font-weight: 650;
    }
    .streak b { color: var(--coral); font-size: 17px; }

    main {
      min-height: calc(100dvh - 72px);
      padding: 22px 18px calc(92px + env(safe-area-inset-bottom));
    }

    .screen { animation: enter .18s ease-out both; }
    @keyframes enter { from { opacity: .25; transform: translateY(5px); } }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--indigo);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: 28px; line-height: 1.2; letter-spacing: -.03em; }
    h2 { margin-bottom: 6px; font-size: 20px; line-height: 1.3; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.65; }

    .today-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .today-number { display: flex; align-items: baseline; gap: 8px; }
    .today-number strong { color: var(--indigo); font-size: 42px; line-height: 1; letter-spacing: -.04em; }
    .today-number span { font-size: 21px; font-weight: 750; }
    .completion { color: var(--muted); font-size: 13px; font-weight: 650; }

    .progress-track {
      height: 8px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8e9ee;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--indigo), #7067f4);
      transition: width .3s ease-out;
    }

    .stage-rail {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 18px;
      padding: 12px 10px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
    }
    .stage-item {
      position: relative;
      min-width: 0;
      padding: 3px 8px;
      text-align: center;
    }
    .stage-item + .stage-item { border-left: 1px solid var(--line); }
    .stage-item small { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
    .stage-item b { font-size: 19px; }
    .stage-item.active small, .stage-item.active b { color: var(--indigo); }
    .stage-item.done::after {
      content: "✓";
      position: absolute;
      top: -3px;
      right: 5px;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .dashboard-card { padding: 20px; }
    .flow-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .flow-row:last-of-type { border-bottom: 0; }
    .flow-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background: var(--indigo-soft);
      color: var(--indigo);
      font-size: 18px;
      font-weight: 800;
    }
    .flow-row:nth-child(3) .flow-icon { background: var(--coral-soft); color: var(--coral); }
    .flow-row h3 { margin: 0 0 2px; font-size: 15px; }
    .flow-row p { margin: 0; color: var(--muted); font-size: 12px; }
    .flow-count { font-size: 22px; font-weight: 800; }

    .primary, .secondary, .danger, .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 19px;
      border-radius: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .primary { border: 1px solid var(--indigo); background: var(--indigo); color: #fff; box-shadow: 0 8px 18px rgba(79,70,229,.2); }
    .primary:hover { background: var(--indigo-dark); }
    .primary:active, .secondary:active, .danger:active, .ghost:active { transform: scale(.98); }
    .secondary { border: 1.5px solid var(--indigo); background: #fff; color: var(--indigo); }
    .secondary:hover { background: var(--indigo-soft); }
    .ghost { border: 1px solid var(--line); background: var(--surface); color: #454a5a; }
    .danger { border: 1px solid #f2bdc5; background: #fff; color: var(--red); }
    .block { width: 100%; }
    .start-button { margin-top: 17px; }
    button:disabled { cursor: default; opacity: .55; transform: none !important; }

    .study-card { overflow: hidden; }
    .study-top {
      padding: 24px 22px 18px;
    }
    .word {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(36px, 11vw, 54px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }
    .pronunciation-row { display: flex; align-items: flex-start; gap: 10px; min-height: 32px; margin-top: 8px; }
    .phonetic-list {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-family: ui-serif, Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
    }
    .phonetic-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 30px; }
    .phonetic-text { min-width: 0; }
    .phonetic-audio-group { display: inline-flex; align-items: center; gap: 5px; }
    .phonetic-audio {
      display: inline-grid;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      place-items: center;
      border: 1px solid #d4d2fa;
      border-radius: 9px;
      background: var(--indigo-soft);
      color: var(--indigo-dark);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    .phonetic-audio:hover { border-color: var(--indigo); background: #e3e5ff; }
    .phonetic-audio.playing { animation: pulse .8s ease-in-out infinite alternate; }
    .phonetic-list.compact { gap: 1px; font-size: 13px; line-height: 1.45; }
    .phonetic-list.compact .phonetic-line { min-height: 26px; }
    .phonetic-list.compact .phonetic-audio { min-width: 26px; height: 26px; padding-inline: 5px; font-size: 11px; }
    .audio-btn {
      flex: 0 0 auto;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--indigo);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 0 0 4px var(--indigo-soft);
      margin-top: 2px;
    }
    .audio-btn.playing { animation: pulse .8s ease-in-out infinite alternate; }
    @keyframes pulse { to { box-shadow: 0 0 0 8px rgba(79,70,229,.08); } }
    .word-detail { padding: 0 22px 22px; }
    .meaning {
      margin: 0;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 17px;
      font-weight: 650;
      line-height: 1.6;
    }
    .analysis { margin: 13px 0 0; color: #4b5161; font-size: 14px; line-height: 1.7; }
    .analysis-sectioned { display: grid; gap: 10px; }
    .analysis-sectioned p { margin: 0; }
    .analysis-label {
      display: block;
      margin-bottom: 2px;
      color: var(--indigo-dark);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }
    .reveal-placeholder {
      display: grid;
      min-height: 138px;
      place-items: center;
      padding: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
    }

    details.info-section { border-top: 1px solid var(--line); }
    details.info-section summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
      padding: 0 22px;
      list-style: none;
      color: #333847;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }
    details.info-section summary::-webkit-details-marker { display: none; }
    details.info-section summary::after { content: "+"; color: var(--indigo); font-size: 20px; }
    details.info-section[open] summary::after { content: "−"; }
    .detail-body { padding: 0 22px 18px; }
    .example { margin-bottom: 13px; padding-left: 12px; border-left: 3px solid #cfd2ff; }
    .example:last-child { margin-bottom: 0; }
    .example p { margin: 0 0 4px; font-size: 14px; line-height: 1.55; }
    .example small { color: var(--muted); line-height: 1.5; }
    .phrase-item { margin-bottom: 11px; padding: 11px 12px; border-left: 3px solid var(--coral); border-radius: 0 10px 10px 0; background: var(--coral-soft); }
    .phrase-item:last-child { margin-bottom: 0; }
    .phrase-item p { margin: 0 0 4px; color: #303544; font-size: 14px; font-weight: 750; line-height: 1.5; }
    .phrase-item small { color: #6a554f; line-height: 1.55; }
    .etymology-card { padding: 13px 14px; border-radius: 12px; background: var(--indigo-soft); color: #42475a; font-size: 13px; line-height: 1.7; }
    .etymology-card p { margin: 0 0 8px; }
    .etymology-card p:last-child { margin-bottom: 0; }
    .etymology-card b { color: var(--indigo-dark); }
    .word-family { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .family-word { padding: 6px 9px; border-radius: 8px; background: #fff; color: #454a59; }
    .family-word b { color: var(--indigo); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 7px 10px; border-radius: 9px; background: var(--surface-2); color: #444a5a; font-size: 13px; }
    .chip b { color: var(--indigo); }

    .actions {
      position: sticky;
      bottom: calc(72px + env(safe-area-inset-bottom));
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
      gap: 10px;
      margin-top: 14px;
      padding: 10px 0;
      background: linear-gradient(transparent, rgba(244,245,247,.96) 25%);
    }
    .actions.single { grid-template-columns: 1fr; }

    .quiz-title { margin-bottom: 16px; text-align: center; }
    .quiz-title .word { font-size: clamp(38px, 12vw, 52px); }
    .quiz-title p { margin: 8px 0 0; color: var(--muted); }
    .options { display: grid; gap: 10px; }
    .option {
      min-height: 58px;
      padding: 12px 15px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: #303544;
      font-size: 15px;
      font-weight: 620;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
    }
    .option:hover { border-color: #b8b4f6; background: #fafaff; }
    .option.unknown-option { border-style: dashed; background: var(--surface-2); color: var(--muted); font-weight: 750; text-align: center; }
    .option.unknown-option:hover { border-color: #aeb2bf; background: #f0f1f4; color: #444a59; }
    .option.correct { border-color: var(--green); background: var(--green-soft); color: #0e654e; }
    .option.wrong { border-color: var(--red); background: var(--red-soft); color: #a7273b; }
    .answer-note {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      color: #454a59;
      font-size: 13px;
      line-height: 1.6;
    }

    .summary-card { overflow: hidden; padding: 24px; text-align: center; }
    .summary-mark {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      place-items: center;
      border-radius: 22px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 33px;
      font-weight: 900;
    }
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
    .score-item { padding: 13px 5px; border-radius: 13px; background: var(--surface-2); }
    .score-item b { display: block; margin-bottom: 3px; font-size: 21px; }
    .score-item small { color: var(--muted); }

    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .section-head h1 { margin: 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .stat-card b { display: block; margin-bottom: 4px; font-size: 28px; }
    .stat-card small { color: var(--muted); }
    .chart-card { padding: 19px 16px 14px; }
    .chart-card h2 { font-size: 16px; }
    .week-chart { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 8px; height: 145px; margin-top: 16px; }
    .day-bar { display: grid; grid-template-rows: 1fr auto; align-items: end; gap: 7px; height: 100%; text-align: center; }
    .bar-wrap { display: flex; align-items: end; justify-content: center; height: 100%; border-radius: 8px; background: var(--surface-2); }
    .bar { width: 100%; min-height: 4px; border-radius: 8px; background: var(--indigo); transition: height .3s ease; }
    .day-bar small { color: var(--muted); font-size: 10px; }

    .calendar-card { margin-bottom: 14px; padding: 18px 14px 15px; }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .calendar-head h2 { margin: 0; font-size: 17px; }
    .month-switch { display: grid; grid-template-columns: 36px minmax(96px, auto) 36px; align-items: center; gap: 4px; }
    .month-switch button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--indigo);
      font-size: 20px;
      cursor: pointer;
    }
    .month-switch button:disabled { color: #a9adba; cursor: default; opacity: .55; }
    .month-switch b { font-size: 14px; text-align: center; }
    .calendar-weekdays, .learning-calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .calendar-weekdays { margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 750; text-align: center; }
    .calendar-day {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 55px;
      align-content: space-between;
      justify-items: center;
      padding: 6px 2px 5px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--surface-2);
      color: #555b6b;
      font-size: 11px;
    }
    .calendar-day.blank { background: transparent; }
    .calendar-day.today { border-color: #aaa6f5; background: var(--indigo-soft); color: var(--indigo-dark); }
    .calendar-day.has-learning { background: #f0efff; }
    .calendar-day b { color: var(--indigo); font-size: 16px; line-height: 1; }
    .calendar-day small { color: var(--muted); font-size: 8px; }

    .stats-quiz-card { padding: 19px; }
    .stats-quiz-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .stats-quiz-head h2 { margin-bottom: 4px; font-size: 17px; }
    .stats-quiz-head p { margin: 0; }
    .stats-quiz-card .primary { flex: 0 0 auto; }
    .quiz-source-options { display: grid; gap: 9px; margin-top: 16px; }
    .quiz-source-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 68px;
      padding: 12px 14px;
      border: 1.5px solid #cfccfa;
      border-radius: 13px;
      background: #fafaff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .quiz-source-option:hover { border-color: var(--indigo); background: var(--indigo-soft); }
    .quiz-source-option b { display: block; margin-bottom: 3px; font-size: 14px; }
    .quiz-source-option small { display: block; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .quiz-source-option .quiz-source-action { color: var(--indigo); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .quiz-source-option:disabled { border-color: var(--line); background: var(--surface-2); color: #8b909e; cursor: not-allowed; opacity: .72; }
    .quiz-source-option:disabled .quiz-source-action { color: #969ba8; }
    .recent-scores { display: grid; gap: 8px; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); }
    .recent-scores h3 { margin: 0 0 2px; font-size: 14px; }
    .score-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); }
    .score-row span { color: var(--muted); font-size: 12px; }
    .score-row b { color: var(--indigo-dark); font-size: 16px; }
    .standalone-quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .standalone-quiz-head h1 { margin: 0; font-size: 23px; }
    .standalone-quiz-head .ghost { min-height: 38px; padding: 0 11px; border-radius: 10px; font-size: 12px; }
    .test-progress { margin-bottom: 22px; }
    .test-result-score { margin: 2px 0 4px; color: var(--indigo); font-size: 58px; line-height: 1; letter-spacing: -.05em; }

    .review-controls {
      position: sticky;
      top: 72px;
      z-index: 8;
      margin: 0 -4px 14px;
      padding: 8px 4px 10px;
      background: rgba(244,245,247,.94);
      backdrop-filter: blur(12px);
    }
    .review-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
    }
    .review-filter {
      min-height: 40px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }
    .review-filter.active { background: var(--indigo); color: #fff; }
    .review-search {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    .review-search::placeholder { color: #9297a5; }
    .review-list { display: grid; gap: 10px; }
    .review-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(28,33,48,.04);
    }
    .review-card summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(54px, max-content);
      align-items: start;
      gap: 12px;
      min-height: 80px;
      padding: 14px 15px;
      list-style: none;
      cursor: pointer;
    }
    .review-card summary::-webkit-details-marker { display: none; }
    .review-card summary > div:first-child { min-width: 0; }
    .review-word { display: grid; align-items: start; gap: 3px; min-width: 0; }
    .review-word b {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: 22px;
      line-height: 1.18;
      letter-spacing: -.02em;
    }
    .review-word b.is-long { font-size: 18px; line-height: 1.25; letter-spacing: -.03em; }
    .review-word b.is-very-long { font-size: 16px; line-height: 1.3; letter-spacing: -.025em; }
    .review-word .phonetic-list {
      color: var(--muted);
      font-family: ui-serif, Georgia, serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .review-meaning { margin: 4px 0 0; color: #4f5564; font-size: 13px; line-height: 1.45; }
    .review-meta { display: grid; justify-items: end; gap: 7px; padding-top: 2px; color: var(--muted); font-size: 11px; text-align: right; }
    .review-action {
      min-width: 48px;
      min-height: 32px;
      padding: 0 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
    }
    .review-action.relearn { border: 1px solid #c9c7f8; background: var(--indigo-soft); color: var(--indigo-dark); }
    .review-action.skip { border: 1px solid var(--line); background: var(--surface-2); color: #5c6272; }
    .review-action.remember { min-width: 72px; border: 1px solid #a9dfcf; background: var(--green-soft); color: #0e654e; }
    .review-action:disabled { cursor: default; opacity: .55; }
    .review-action-group { display: grid; width: 72px; gap: 6px; }
    .review-action-group .review-action { width: 100%; }
    .review-meta > span { white-space: nowrap; }
    .review-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .review-tag { display: inline-flex; align-items: center; min-height: 23px; padding: 0 7px; border-radius: 7px; font-size: 10px; font-weight: 800; }
    .review-tag.spelling { background: var(--red-soft); color: #ad2c42; }
    .review-tag.fuzzy { background: var(--coral-soft); color: #ae452d; }
    .mini-audio {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--indigo-soft);
      color: var(--indigo);
      cursor: pointer;
    }
    .review-detail { padding: 0 15px 16px; border-top: 1px solid var(--line); }
    .review-detail .analysis { margin-bottom: 14px; }
    .review-result-count { color: var(--muted); font-size: 12px; font-weight: 650; }

    .quiz-kind {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding: 6px 9px;
      border-radius: 9px;
      background: var(--coral-soft);
      color: #b3442a;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
    }
    .spelling-card { padding: 22px; text-align: center; }
    .spelling-meaning {
      margin: 5px 0 7px;
      font-size: clamp(22px, 7vw, 30px);
      line-height: 1.4;
      font-weight: 780;
      letter-spacing: -.02em;
    }
    .spelling-hint { color: var(--muted); font-size: 13px; }
    .spelling-meta { display: grid; justify-items: center; gap: 4px; margin-top: 8px; }
    .spelling-meta .phonetic-list, .spelling-answer .phonetic-list, .quiz-phonetic .phonetic-list { justify-items: center; }
    .quiz-phonetic { display: grid; justify-items: center; margin-top: 8px; }
    .spelling-form { margin-top: 19px; }
    .spelling-input {
      width: 100%;
      min-height: 58px;
      padding: 0 16px;
      border: 2px solid #cfd2dc;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 24px;
      font-weight: 720;
      letter-spacing: .04em;
      text-align: center;
      text-transform: lowercase;
    }
    .spelling-input:focus { border-color: var(--indigo); outline: 3px solid rgba(79,70,229,.15); }
    .spelling-input.correct { border-color: var(--green); background: var(--green-soft); color: #0e654e; }
    .spelling-input.wrong { border-color: var(--red); background: var(--red-soft); color: #a7273b; }
    .spelling-answer {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 14px;
      line-height: 1.55;
    }
    .spelling-answer b { color: var(--indigo); font-size: 19px; letter-spacing: .03em; }

    .plan-card { margin-bottom: 13px; padding: 19px; }
    .plan-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .plan-row + .plan-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .plan-row h3 { margin: 0 0 3px; font-size: 15px; }
    .plan-row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .stepper { display: grid; grid-template-columns: 40px 46px 40px; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
    .stepper button { height: 40px; border: 0; background: var(--surface-2); color: var(--indigo); font-size: 20px; cursor: pointer; }
    .stepper b { text-align: center; }
    .plan-meter { margin-top: 16px; }
    .plan-meter .progress-track { margin: 8px 0 0; }
    .small-button { min-height: 42px; padding: 0 13px; border-radius: 11px; font-size: 13px; }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(100%, 560px);
      min-height: calc(66px + env(safe-area-inset-bottom));
      margin: 0 auto;
      padding: 7px 12px env(safe-area-inset-bottom);
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(16px);
    }
    .nav-btn {
      display: grid;
      grid-template-rows: 25px 16px;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #7a7f8d;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn svg { width: 21px; height: 21px; }
    .nav-btn.active { background: var(--indigo-soft); color: var(--indigo); }

    dialog {
      width: min(calc(100% - 24px), 520px);
      max-height: min(82dvh, 720px);
      margin: auto auto 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 22px 22px 0 0;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 -18px 50px rgba(20,24,39,.2);
    }
    dialog::backdrop { background: rgba(20,24,39,.42); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 20px 14px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; }
    .close-btn { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 50%; background: var(--surface-2); cursor: pointer; }
    .dialog-body { max-height: calc(82dvh - 145px); overflow: auto; padding: 14px 18px 22px; }
    .book-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-bottom: 9px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; }
    .book-item.active { border-color: var(--indigo); background: var(--indigo-soft); }
    .book-item h3 { margin: 0 0 3px; font-size: 15px; }
    .book-item p { margin: 0; color: var(--muted); font-size: 12px; }
    .check { color: var(--indigo); font-size: 18px; font-weight: 900; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding-top: 8px; }
    .format-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: calc(82px + env(safe-area-inset-bottom));
      left: 18px;
      z-index: 50;
      max-width: 520px;
      margin: auto;
      padding: 13px 15px;
      border-radius: 12px;
      background: #202433;
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: var(--shadow);
      animation: toast-in .18s ease-out both;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(244,245,247,.78);
      backdrop-filter: blur(8px);
    }
    .loading-panel {
      display: grid;
      min-width: min(270px, calc(100vw - 48px));
      justify-items: center;
      padding: 25px 22px 22px;
      border: 1px solid rgba(79,70,229,.14);
      border-radius: 19px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 13px;
      border: 4px solid #dddffa;
      border-top-color: var(--indigo);
      border-radius: 50%;
      animation: loading-spin .72s linear infinite;
    }
    .loading-panel b { margin-bottom: 5px; font-size: 16px; }
    .loading-panel span { color: var(--muted); font-size: 12px; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    body.is-loading { overflow: hidden; }
    .hidden { display: none !important; }
    .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

    @media (min-width: 620px) {
      body { padding: 18px 0; }
      .app { min-height: calc(100dvh - 36px); border-radius: 24px; overflow: hidden; }
      .bottom-nav { bottom: 18px; border-radius: 0 0 24px 24px; }
      dialog { margin-bottom: max(18px, calc((100dvh - 760px) / 2)); border-radius: 22px; }
    }
    @media (max-width: 380px) {
      .header { padding-right: 13px; padding-left: 13px; }
      main { padding-right: 13px; padding-left: 13px; }
      .streak span { display: none; }
      .book-switch { padding: 0 5px; }
      .stage-item { padding-inline: 4px; }
      .review-card summary { grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; padding-inline: 12px; }
      .stats-quiz-head { display: grid; }
      .stats-quiz-head .primary { width: 100%; }
      .calendar-card { padding-inline: 10px; }
      .calendar-day { min-height: 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand" aria-label="词阶"><img src="favicon.svg" alt="" aria-hidden="true">词阶</div>
      <button class="book-switch" id="bookSwitch" type="button" aria-label="切换单词书">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v16H7.5A2.5 2.5 0 0 0 5 20.5v-16Z" stroke="currentColor" stroke-width="1.8"/><path d="M5 20.5A1.5 1.5 0 0 0 6.5 22H19v-4" stroke="currentColor" stroke-width="1.8"/></svg>
        <span id="bookName">载入中</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 9 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="streak" aria-label="连续学习天数"><span>🔥 连续</span><b id="streakCount">0</b><span>天</span></div>
    </header>

    <main id="main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn active" data-tab="today" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h16M7 3v3m10-3v3M6 5h12a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m8.5 14 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-btn" data-tab="review" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H19v-4M8 8h7m-7 4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>回顾</span>
      </button>
      <button class="nav-btn" data-tab="stats" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 20v-7h4v7H5Zm5 0V4h4v16h-4Zm5 0v-11h4v11h-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>统计</span>
      </button>
      <button class="nav-btn" data-tab="plan" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 7v5l3 2M16 3h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>计划</span>
      </button>
    </nav>
  </div>

  <dialog id="bookDialog">
    <div class="dialog-head"><h2>切换单词书</h2><button class="close-btn" type="button" aria-label="关闭" data-close-dialog>✕</button></div>
    <div class="dialog-body">
      <div id="bookList"></div>
      <div class="dialog-actions">
        <button class="secondary small-button" type="button" id="importButton">导入 JSON</button>
        <button class="ghost small-button" type="button" id="templateButton">下载格式样例</button>
      </div>
      <input class="hidden" id="fileInput" type="file" accept="application/json,.json">
      <p class="format-note">音频字段支持纯 Base64 MP3 或 <code>data:audio/mpeg;base64,...</code>。数据只保存在当前浏览器的 IndexedDB 中。</p>
    </div>
  </dialog>
  <div class="toast hidden" id="toast" role="status"></div>
  <div class="loading-overlay hidden" id="loadingOverlay" role="status" aria-live="assertive" aria-hidden="true">
    <div class="loading-panel">
      <div class="loading-spinner" aria-hidden="true"></div>
      <b id="loadingTitle">正在加载词书</b>
      <span>首次加载可能需要一点时间，请稍候</span>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const DB_NAME = "wordstep-db";
    const DB_VERSION = 2;
    const STORES = ["books", "meta", "progress", "sessions", "activity", "quizResults"];
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const main = $("#main");
    const bookDialog = $("#bookDialog");
    const state = { db: null, books: [], book: null, settings: null, session: null, tab: "today", flowOpen: false, revealed: false, quizAnswered: false, selectedAnswer: null, reviewFilter: "consolidate", reviewQuery: "", statsMonth: localDate().slice(0, 7), statsQuiz: null };

    const REMOVED_BUILTIN_BOOK_IDS = ["cet6-focus", "business-core"];
    const CUSTOM_BOOK_CATALOG_KEY = "custom-book-catalog";
    const VOICE_ENDPOINT_B64 = "aHR0cHM6Ly9kaWN0LnlvdWRhby5jb20vZGljdHZvaWNlP2F1ZGlvPQ==";

    const BUNDLED_BOOKS = [
      { order: 1, id: "middle_school", name: "初中英语 2000", description: "初中英语核心词汇，含英美音标、核心释义、详细解析、短语、双语例句、辨析与构词记忆", wordCount: 1950, version: "2026.08.09.1", url: "./middle_school_2000.json" },
      { order: 2, id: "hight_school_2000", name: "高中英语 2000", description: "高中英语、高考核心词汇，不含初中阶段的词汇。", wordCount: 2240, version: "2026.08.09.1", url: "./hight_school_2000.json" },
      { order: 3, id: "cet6_2000", name: "CET6 2000", description: "大学英语六级核心词汇，含短语、详细解析、同义词辨析、易混词、词源与例句", wordCount: 2306, version: "2026.07.25.1", url: "./cet6_2000.json" },
      { order: 4, id: "gre3000", name: "GRE 3000", description: "GRE 核心词汇，含短语、详细解析、同义词辨析、易混词、词源典故与多义例句", wordCount: 3312, version: "2026.07.24.1", url: "./gre3000.json" },
      { order: 5, id: "n2512", name: "N2512", description: "综合阅读与表达词汇，含短语、词源、辨析与多义例句", wordCount: 1014, version: "2026.07.24.1", url: "./n2512.json" },
      { order: 6, id: "n2607", name: "N2607", description: "AI、技术、商业与通识阅读词汇，含短语、词源与多义例句", wordCount: 748, version: "2026.07.24.1", url: "./n2607.json" },
      { order: 7, id: "plant1000", name: "Plant 1000", description: "植物主题词汇，涵盖花卉、树木、蔬果与药用植物，含分类、形态、分布、典故、特性及例句", wordCount: 1000, version: "2026.07.25.1", url: "./plant1000.json" }
    ];

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("books")) db.createObjectStore("books", { keyPath: "id" });
          if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
          if (!db.objectStoreNames.contains("progress")) db.createObjectStore("progress", { keyPath: "key" });
          if (!db.objectStoreNames.contains("sessions")) db.createObjectStore("sessions", { keyPath: "id" });
          if (!db.objectStoreNames.contains("activity")) db.createObjectStore("activity", { keyPath: "id" });
          if (!db.objectStoreNames.contains("quizResults")) db.createObjectStore("quizResults", { keyPath: "id" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function dbRequest(storeName, mode, action) {
      return new Promise((resolve, reject) => {
        const tx = state.db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        let request;
        try { request = action(store); } catch (error) { reject(error); return; }
        if (request) {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        } else {
          tx.oncomplete = () => resolve();
        }
        tx.onerror = () => reject(tx.error);
      });
    }
    const get = (store, key) => dbRequest(store, "readonly", s => s.get(key));
    const getAll = store => dbRequest(store, "readonly", s => s.getAll());
    const put = (store, value) => dbRequest(store, "readwrite", s => s.put(value));
    const remove = (store, key) => dbRequest(store, "readwrite", s => s.delete(key));

    function localDate(offset = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offset);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric" }).format(new Date(y, m - 1, d));
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[c]);
    }
    function pronunciationButtonHTML(word, type, showAccent = false) {
      const accent = type === 1 ? "英" : "美";
      return `<button class="phonetic-audio" type="button" data-pronunciation-word="${esc(word.id)}" data-pronunciation-type="${type}" aria-label="播放 ${esc(word.word)} 的${accent}音" aria-pressed="false">${showAccent ? `${accent} ` : ""}🔊</button>`;
    }
    function phoneticWithAudioHTML(word, compact = false) {
      const raw = String(word?.phonetic || "").trim();
      if (!raw) return "";
      const prepared = raw.replace(/[ \t]+(?=(?:英|美)(?:音|式)?\s*[\/\[])/g, "\n");
      const lines = prepared.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const body = lines.map(line => {
        const isBritish = /^(?:英|英音|英式|UK|British)(?:\s|\/|\[|:|：|$)/i.test(line);
        const isAmerican = /^(?:美|美音|美式|US|American)(?:\s|\/|\[|:|：|$)/i.test(line);
        const buttons = isBritish
          ? pronunciationButtonHTML(word, 1)
          : isAmerican
            ? pronunciationButtonHTML(word, 2)
            : `<span class="phonetic-audio-group">${pronunciationButtonHTML(word, 1, true)}${pronunciationButtonHTML(word, 2, true)}</span>`;
        return `<div class="phonetic-line"><span class="phonetic-text">${esc(line)}</span>${buttons}</div>`;
      }).join("");
      return `<div class="phonetic-list ${compact ? "compact" : ""}">${body}</div>`;
    }
    function hasRecordedAudio(word) {
      return Boolean(String(word?.audioBase64 || word?.audio || "").trim());
    }
    function consolidationTypes(progress) {
      if (!progress) return [];
      if (Object.prototype.hasOwnProperty.call(progress, "consolidation")) {
        const flags = progress.consolidation && typeof progress.consolidation === "object" ? progress.consolidation : {};
        return ["spelling", "fuzzy"].filter(type => Boolean(flags[type]));
      }
      const types = [];
      if ((progress.spellingWrong || 0) > 0) types.push("spelling");
      if ((progress.wrong || 0) > (progress.spellingWrong || 0)) types.push("fuzzy");
      return types;
    }
    function markForConsolidation(progress, type) {
      const flags = {};
      consolidationTypes(progress).forEach(existingType => { flags[existingType] = Date.now(); });
      flags[type] = Date.now();
      progress.consolidation = flags;
    }
    function consolidationTime(progress) {
      const flags = progress?.consolidation;
      if (!flags || typeof flags !== "object") return progress?.lastTestAt || progress?.lastSeenAt || 0;
      return Math.max(0, ...Object.values(flags).map(Number).filter(Number.isFinite));
    }
    function shuffle(items) {
      const a = [...items];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.remove("hidden");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.add("hidden"), 2600);
    }

    function setLoading(active, title = "正在加载词书") {
      const overlay = $("#loadingOverlay");
      $("#loadingTitle").textContent = title;
      overlay.classList.toggle("hidden", !active);
      overlay.setAttribute("aria-hidden", String(!active));
      document.body.classList.toggle("is-loading", active);
    }

    function waitForPaint() {
      return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    function withBundledMetadata(book, source) {
      return { ...book, id: source.id, name: source.name, description: source.description, wordCount: source.wordCount, order: source.order, version: source.version, builtin: true };
    }

    async function loadBundledBook(source) {
      const existing = await get("books", source.id);
      if (existing?.version === source.version && Array.isArray(existing.words) && existing.words.length) {
        return withBundledMetadata(existing, source);
      }
      try {
        const response = await fetch(source.url, { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const rawBook = await response.json();
        if (!Array.isArray(rawBook.words) || !rawBook.words.length) throw new Error("词书格式无效");
        const book = withBundledMetadata(rawBook, source);
        await put("books", book);
        return book;
      } catch (error) {
        if (Array.isArray(existing?.words) && existing.words.length) {
          console.warn(`无法更新内置词书 ${source.id}，使用本地缓存`, error);
          return withBundledMetadata(existing, source);
        }
        throw error;
      }
    }

    async function loadBookById(id) {
      const source = BUNDLED_BOOKS.find(book => book.id === id);
      if (source) return loadBundledBook(source);
      const book = await get("books", id);
      if (!book?.words?.length) throw new Error("词书不存在或内容为空");
      return book;
    }

    function customBookMetadata(book) {
      return {
        id: book.id,
        name: book.name,
        description: book.description || "自定义 JSON 词书",
        wordCount: book.words?.length || book.wordCount || 0,
        importedAt: book.importedAt || 0,
        builtin: false
      };
    }

    async function getCustomBookCatalog() {
      let catalog = await get("meta", CUSTOM_BOOK_CATALOG_KEY);
      if (!catalog) {
        const bundledIds = new Set(BUNDLED_BOOKS.map(book => book.id));
        const books = (await getAll("books"))
          .filter(book => !bundledIds.has(book.id) && !book.builtin)
          .map(customBookMetadata);
        catalog = { key: CUSTOM_BOOK_CATALOG_KEY, books };
        await put("meta", catalog);
      }
      return Array.isArray(catalog.books) ? catalog.books : [];
    }

    async function saveCustomBookMetadata(book) {
      if (BUNDLED_BOOKS.some(source => source.id === book.id)) return;
      const books = await getCustomBookCatalog();
      const next = books.filter(item => item.id !== book.id);
      next.push(customBookMetadata(book));
      await put("meta", { key: CUSTOM_BOOK_CATALOG_KEY, books: next });
    }

    async function getBookCatalog() {
      const importedBooks = (await getCustomBookCatalog())
        .sort((a, b) => (a.importedAt || 0) - (b.importedAt || 0))
        .map((book, index) => ({
          order: 1000 + index,
          ...book
        }));
      return [...BUNDLED_BOOKS, ...importedBooks].sort((a, b) => a.order - b.order);
    }

    async function init() {
      try {
        state.db = await openDB();
        for (const id of REMOVED_BUILTIN_BOOK_IDS) await remove("books", id);
        state.settings = await get("meta", "settings");
        if (!state.settings) {
          state.settings = { key: "settings", activeBookId: BUNDLED_BOOKS[0].id, dailyNew: 20, createdAt: localDate() };
          await put("meta", state.settings);
        }
        try {
          state.book = await loadBookById(state.settings.activeBookId);
        } catch (error) {
          console.warn(`无法载入当前词书 ${state.settings.activeBookId}，改用默认词书`, error);
          state.book = await loadBookById(BUNDLED_BOOKS[0].id);
        }
        state.books = BUNDLED_BOOKS.map(book => ({ ...book }));
        state.settings.activeBookId = state.book.id;
        await put("meta", state.settings);
        state.session = await getSession();
        bindStaticEvents();
        await refreshHeader();
        render();
      } catch (error) {
        console.error(error);
        main.innerHTML = `<section class="screen"><div class="card empty"><h2>无法启动本地数据库</h2><p>请确认浏览器允许 IndexedDB，或换用非隐私浏览模式。</p></div></section>`;
      }
    }

    function bindStaticEvents() {
      $("#bookSwitch").addEventListener("click", openBooks);
      $("[data-close-dialog]").addEventListener("click", () => bookDialog.close());
      $("#importButton").addEventListener("click", () => $("#fileInput").click());
