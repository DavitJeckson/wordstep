<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; worker-src blob:; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>本地文本对比工具</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f8;
      --surface: #ffffff;
      --surface-muted: #f7f8fa;
      --border: #d8dee7;
      --border-strong: #aab4c2;
      --text: #172033;
      --muted: #596579;
      --primary: #175cd3;
      --primary-hover: #124aa8;
      --focus: #84adff;
      --delete-bg: #fff0f1;
      --delete-strong: #ffd3d7;
      --delete-text: #9f1821;
      --insert-bg: #eafbf0;
      --insert-strong: #bdebc9;
      --insert-text: #176b34;
      --modify-bg: #fff8dc;
      --modify-strong: #ffe49a;
      --modify-text: #7a4b00;
      --ignored-bg: #fff8dc;
      --warning-bg: #fff8e6;
      --warning-border: #e9b949;
      --error-bg: #fff0f1;
      --error-border: #d92d3f;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    button, select, textarea, input { font: inherit; }
    button, select, textarea, .drop-zone { border-radius: 8px; }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    input[type="number"]:focus-visible,
    .file-input:focus-visible + .drop-zone {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app { width: min(1600px, 100%); margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: clamp(23px, 3vw, 32px); letter-spacing: -.025em; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .privacy-note { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .source-card,
    .toolbar,
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .source-card { padding: 16px; border-radius: 12px; }
    .source-card.drag-over { border-color: var(--primary); background: #f3f7ff; }
    .source-title { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 700; }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .drop-zone {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1.5px dashed var(--border-strong);
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }

    .drop-zone:hover { border-color: var(--primary); color: var(--primary); background: #f8faff; }
    .file-meta { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .divider { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--border); }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 11px 12px;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
      font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    textarea::placeholder { color: #7b8798; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin: 16px 0;
      padding: 12px 14px;
      border-radius: 12px;
    }

    .toolbar-group { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .field-inline { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }

    button {
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid transparent;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button.secondary { color: var(--text); background: var(--surface); border-color: var(--border); }
    button.secondary:hover:not(:disabled) { color: var(--primary); background: #f5f8ff; border-color: #a9c4f4; }
    button.secondary[aria-pressed="true"] { color: var(--primary); background: #edf4ff; border-color: #8eb5f5; }
    button.danger { color: #b42331; }

    select {
      min-height: 36px;
      padding: 6px 30px 6px 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .message { display: none; margin: 0 0 14px; padding: 10px 12px; border-left: 4px solid; border-radius: 6px; font-size: 13px; }
    .message.visible { display: block; }
    .message.warning { background: var(--warning-bg); border-color: var(--warning-border); }
    .message.error { background: var(--error-bg); border-color: var(--error-border); }

    .status-row {
      display: flex;
      min-height: 28px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: -4px 2px 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-copy { display: inline-flex; align-items: center; gap: 8px; }
    .spinner { display: none; width: 14px; height: 14px; border: 2px solid #c9d7ef; border-top-color: var(--primary); border-radius: 50%; animation: spin .75s linear infinite; }
    [aria-busy="true"] .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-color: var(--primary); } }

    .stats { display: flex; flex-wrap: wrap; gap: 10px; }
    .stat-insert { color: var(--insert-text); font-weight: 700; }
    .stat-delete { color: var(--delete-text); font-weight: 700; }
    .stat-modify { color: var(--modify-text); font-weight: 700; }

    .result-card { overflow: visible; border-radius: 12px; }
    .result-tools { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; background: var(--surface-muted); }
    .pager { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .pager button { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    .pager input, .result-footer input {
      width: 76px;
      min-height: 32px;
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface);
    }

    .diff-viewport { overflow: visible; max-height: none; }
    .diff-table { width: 100%; min-width: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .diff-header, .diff-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

    .diff-header {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #eef1f5;
      color: #435066;
      border-bottom: 1px solid var(--border-strong);
      font-family: Inter, ui-sans-serif, sans-serif;
      font-size: 13px;
      font-weight: 700;
    }

    .column-title { min-width: 0; padding: 9px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .column-title:first-child { border-right: 1px solid var(--border-strong); }
    .diff-row { min-height: 26px; border-bottom: 1px solid #e9edf2; }
    .diff-row:last-child { border-bottom: 0; }

    .diff-cell { display: grid; grid-template-columns: 48px 22px minmax(0, 1fr); min-width: 0; }
    .diff-cell:first-child { border-right: 1px solid var(--border); }
    .line-num { padding: 3px 7px 3px 2px; border-right: 1px solid rgba(120, 132, 151, .22); color: #68758a; text-align: right; user-select: none; }
    .change-mark { padding: 3px 2px; color: #68758a; text-align: center; user-select: none; }
    .line-content { min-width: 0; padding: 3px 8px 3px 2px; white-space: pre-wrap; overflow-wrap: anywhere; }

    .line-delete { background: var(--delete-bg); color: var(--delete-text); }
    .line-delete .line-num { background: var(--delete-strong); }
    .line-insert { background: var(--insert-bg); color: var(--insert-text); }
    .line-insert .line-num { background: var(--insert-strong); }
    .line-modify { background: var(--modify-bg); color: var(--modify-text); }
    .line-modify .line-num { background: var(--modify-strong); }
    .line-empty { background: #f7f8fa; }
    .line-ignored { background: var(--ignored-bg); }
    .char-delete { background: #f3a9b0; border-radius: 2px; }
    .char-insert { background: #8ed9a3; border-radius: 2px; }

    .fold-row { padding: 8px 12px; border-bottom: 1px solid #cbdcf8; background: #eef5ff; text-align: center; }
    .fold-row button { min-height: 30px; padding: 3px 10px; color: var(--primary); background: transparent; border-color: transparent; font-size: 13px; font-weight: 600; }
    .fold-row button:hover:not(:disabled) { background: #dceaff; }

    .empty-state { padding: 72px 20px; color: var(--muted); text-align: center; font-family: Inter, ui-sans-serif, sans-serif; }

    .result-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      border-radius: 0 0 12px 12px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 13px;
    }

    .result-footer button { min-height: 32px; padding: 4px 10px; font-size: 13px; }

    @media (max-width: 900px) {
      body { padding: 14px; }
      .page-header { display: block; }
      .privacy-note { display: block; margin-top: 7px; white-space: normal; }
      .input-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; }
      .toolbar-group { width: 100%; }
      .toolbar-group.actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div>
        <h1>本地文本对比工具</h1>
        <p class="subtitle">针对大型文本优化，支持逐行与字符级差异查看</p>
      </div>
      <span class="privacy-note">文件仅在当前浏览器中处理，不会上传</span>
    </header>

    <section class="input-grid" aria-label="待比较文本">
      <article class="source-card" id="cardA">
        <label class="source-title" for="textA">旧文本（原版）</label>
        <input class="file-input visually-hidden" id="fileA" type="file" accept="text/*,.js,.ts,.jsx,.tsx,.html,.css,.json,.md,.xml,.csv,.py,.java,.cpp,.c,.h,.log,.yaml,.yml,.toml,.ini">
        <label class="drop-zone" id="dropA" for="fileA" aria-describedby="fileHelpA">
          <span class="file-meta" id="fileMetaA">选择文件，或拖放到这里（最大 10 MiB）</span>
        </label>
        <span class="visually-hidden" id="fileHelpA">支持文本文件，单个文件最大十 MiB</span>
        <div class="divider">或粘贴文本</div>
        <textarea id="textA" spellcheck="false" placeholder="在此粘贴旧版本内容"></textarea>
      </article>

      <article class="source-card" id="cardB">
        <label class="source-title" for="textB">新文本（修改后）</label>
        <input class="file-input visually-hidden" id="fileB" type="file" accept="text/*,.js,.ts,.jsx,.tsx,.html,.css,.json,.md,.xml,.csv,.py,.java,.cpp,.c,.h,.log,.yaml,.yml,.toml,.ini">
        <label class="drop-zone" id="dropB" for="fileB" aria-describedby="fileHelpB">
          <span class="file-meta" id="fileMetaB">选择文件，或拖放到这里（最大 10 MiB）</span>
        </label>
        <span class="visually-hidden" id="fileHelpB">支持文本文件，单个文件最大十 MiB</span>
        <div class="divider">或粘贴文本</div>
        <textarea id="textB" spellcheck="false" placeholder="在此粘贴新版本内容"></textarea>
      </article>
    </section>

    <section class="toolbar" aria-label="比较设置">
      <div class="toolbar-group actions">
        <button id="compareButton" type="button">开始对比</button>
        <button class="secondary" id="cancelButton" type="button" hidden>取消计算</button>
        <button class="secondary" id="swapButton" type="button">交换两侧</button>
        <button class="secondary danger" id="clearButton" type="button">清空</button>
      </div>
      <div class="toolbar-group">
        <label class="field-inline" for="whitespaceMode">
          空白处理
          <select id="whitespaceMode">
            <option value="exact">精确比较</option>
            <option value="trailing" selected>忽略行尾空白</option>
            <option value="all">忽略每行的全部空白</option>
          </select>
        </label>
        <label class="field-inline" for="encoding">
          文件编码
          <select id="encoding">
            <option value="utf-8" selected>UTF-8 / 自动 BOM</option>
            <option value="gb18030">GB18030 / GBK</option>
            <option value="utf-16le">UTF-16 LE</option>
            <option value="utf-16be">UTF-16 BE</option>
          </select>
        </label>
      </div>
    </section>

    <div class="message error" id="errorMessage" role="alert"></div>
    <div class="message warning" id="warningMessage" role="status"></div>

    <section class="status-row" id="statusRegion" aria-live="polite" aria-busy="false">
      <span class="status-copy"><span class="spinner" aria-hidden="true"></span><span id="statusText">等待输入</span></span>
      <span class="stats" id="stats"></span>
    </section>

    <section class="result-card" id="resultCard" aria-label="比较结果" aria-busy="false">
      <div class="result-tools">
        <button class="secondary" id="foldButton" type="button" aria-pressed="true" disabled>折叠大段相同内容</button>
        <div class="pager">
          <label for="pageSize">每页</label>
          <select id="pageSize">
            <option value="2000" selected>2,000 行</option>
            <option value="5000">5,000 行</option>
            <option value="10000">10,000 行</option>
          </select>
          <button class="secondary" id="prevPage" type="button" disabled>上一页</button>
          <span id="pageInfo">第 1 / 1 页</span>
          <button class="secondary" id="nextPage" type="button" disabled>下一页</button>
          <label for="pageJump">跳至</label>
          <input id="pageJump" type="number" min="1" step="1" value="1" inputmode="numeric" disabled>
          <button class="secondary" id="pageJumpButton" type="button" disabled>跳转</button>
        </div>
      </div>

      <div class="diff-viewport" id="diffViewport">
        <div class="diff-table" role="table" aria-label="逐行差异">
          <div class="diff-header" role="row">
            <div class="column-title" id="titleA" role="columnheader">旧文本</div>
            <div class="column-title" id="titleB" role="columnheader">新文本</div>
          </div>
          <div id="diffBody" role="rowgroup">
            <div class="empty-state">请选择文件或粘贴文本，然后开始对比。</div>
          </div>
        </div>
      </div>
      <div class="result-footer" aria-label="页底翻页">
        <button class="secondary" id="prevPageBottom" type="button" disabled>上一页</button>
        <span id="pageInfoBottom">第 1 / 1 页</span>
        <button class="secondary" id="nextPageBottom" type="button" disabled>下一页</button>
        <label for="pageJumpBottom">跳至</label>
        <input id="pageJumpBottom" type="number" min="1" step="1" value="1" inputmode="numeric" disabled>
        <button class="secondary" id="pageJumpButtonBottom" type="button" disabled>跳转</button>
        <button class="secondary" id="backToResultTop" type="button">返回结果顶部</button>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    const MAX_BYTES = 10 * 1024 * 1024;
    const CONTEXT_LINES = 3;
    const INLINE_DP_CELLS = 160000;
    const INLINE_MAX_CODEPOINTS = 2400;
    const INLINE_PAGE_DP_BUDGET = 2000000;

    const elements = {
      fileA: document.getElementById('fileA'),
      fileB: document.getElementById('fileB'),
      textA: document.getElementById('textA'),
      textB: document.getElementById('textB'),
      cardA: document.getElementById('cardA'),
      cardB: document.getElementById('cardB'),
      fileMetaA: document.getElementById('fileMetaA'),
      fileMetaB: document.getElementById('fileMetaB'),
      compareButton: document.getElementById('compareButton'),
      cancelButton: document.getElementById('cancelButton'),
      swapButton: document.getElementById('swapButton'),
      clearButton: document.getElementById('clearButton'),
      whitespaceMode: document.getElementById('whitespaceMode'),
      encoding: document.getElementById('encoding'),
      foldButton: document.getElementById('foldButton'),
      pageSize: document.getElementById('pageSize'),
      prevPage: document.getElementById('prevPage'),
      nextPage: document.getElementById('nextPage'),
      pageInfo: document.getElementById('pageInfo'),
      pageJump: document.getElementById('pageJump'),
      pageJumpButton: document.getElementById('pageJumpButton'),
      prevPageBottom: document.getElementById('prevPageBottom'),
      nextPageBottom: document.getElementById('nextPageBottom'),
      pageInfoBottom: document.getElementById('pageInfoBottom'),
      pageJumpBottom: document.getElementById('pageJumpBottom'),
      pageJumpButtonBottom: document.getElementById('pageJumpButtonBottom'),
      backToResultTop: document.getElementById('backToResultTop'),
      titleA: document.getElementById('titleA'),
      titleB: document.getElementById('titleB'),
      diffBody: document.getElementById('diffBody'),
      diffViewport: document.getElementById('diffViewport'),
      resultCard: document.getElementById('resultCard'),
      statusRegion: document.getElementById('statusRegion'),
      statusText: document.getElementById('statusText'),
      stats: document.getElementById('stats'),
      errorMessage: document.getElementById('errorMessage'),
      warningMessage: document.getElementById('warningMessage')
    };

    const state = {
      selectedA: null,
      selectedB: null,
      rawA: null,
      rawB: null,
      linesA: [],
      linesB: [],
      titleA: '旧文本',
      titleB: '新文本',
      hunks: [],
      blocks: [],
      visibleItems: [],
      visibleRows: 0,
      page: 1,
      pageSize: Number(elements.pageSize.value),
      foldEnabled: true,
      expandedBlocks: new Set(),
      worker: null,
      runId: 0,
      busy: false
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KiB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MiB';
    }

    function splitLines(text) {
      if (text === '') return [];
      return text.replace(/\r\n?|\u2028|\u2029/g, '\n').split('\n');
    }

    function setMessage(kind, message) {
      const target = kind === 'error' ? elements.errorMessage : elements.warningMessage;
      target.textContent = message || '';
      target.classList.toggle('visible', Boolean(message));
    }

    function clearMessages() {
      setMessage('error', '');
      setMessage('warning', '');
    }

    function setStatus(message) {
      elements.statusText.textContent = message;
    }

    function setBusy(isBusy) {
      state.busy = isBusy;
      elements.statusRegion.setAttribute('aria-busy', String(isBusy));
      elements.resultCard.setAttribute('aria-busy', String(isBusy));
      elements.compareButton.disabled = isBusy;
      elements.swapButton.disabled = isBusy;
      elements.fileA.disabled = isBusy;
      elements.fileB.disabled = isBusy;
      elements.textA.disabled = isBusy;
      elements.textB.disabled = isBusy;
      elements.whitespaceMode.disabled = isBusy;
      elements.encoding.disabled = isBusy;
      elements.cancelButton.hidden = !isBusy;
    }

    function sourceLabel(file) {
      return file ? file.name + ' · ' + formatBytes(file.size) : '选择文件，或拖放到这里（最大 10 MiB）';
    }

    function refreshSourceUi(side) {
      const file = state['selected' + side];
      elements['fileMeta' + side].textContent = sourceLabel(file);
    }

    function chooseFile(side, file, fromDrop) {
      if (!file) return;
      if (state.busy) {
        setMessage('warning', '正在比较；请先取消当前任务，再更换文件。');
        return;
      }
      clearMessages();
      if (file.size > MAX_BYTES) {
        setMessage('error', file.name + ' 为 ' + formatBytes(file.size) + '，超过 10 MiB 限制。');
        return;
      }
      state['selected' + side] = file;
      elements['text' + side].value = '';
      if (fromDrop) elements['file' + side].value = '';
      refreshSourceUi(side);
    }

    function setupSource(side) {
      const fileInput = elements['file' + side];
      const textArea = elements['text' + side];
      const card = elements['card' + side];

      fileInput.addEventListener('change', () => chooseFile(side, fileInput.files[0], false));
      textArea.addEventListener('input', () => {
        if (textArea.value.length > 0) {
          state['selected' + side] = null;
          fileInput.value = '';
          refreshSourceUi(side);
        }
      });

      ['dragenter', 'dragover'].forEach(type => card.addEventListener(type, event => {
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
        card.classList.add('drag-over');
      }));

      ['dragleave', 'drop'].forEach(type => card.addEventListener(type, event => {
        event.preventDefault();
        card.classList.remove('drag-over');
      }));

      card.addEventListener('drop', event => {
        const files = event.dataTransfer && event.dataTransfer.files;
        if (!files || files.length === 0) return;
        if (files.length > 1) setMessage('warning', '每侧一次只支持一个文件，已使用第一个文件。');
        chooseFile(side, files[0], true);
      });
    }

    setupSource('A');
    setupSource('B');

    function detectBom(bytes, fallback) {
      if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) return { encoding: 'utf-8', offset: 3 };
      if (bytes.length >= 2 && bytes[0] === 0xff && bytes[1] === 0xfe) return { encoding: 'utf-16le', offset: 2 };
      if (bytes.length >= 2 && bytes[0] === 0xfe && bytes[1] === 0xff) return { encoding: 'utf-16be', offset: 2 };
      return { encoding: fallback, offset: 0 };
    }

    async function readFile(file) {
      if (file.size > MAX_BYTES) throw new Error(file.name + ' 超过 10 MiB 限制。');
      const bytes = new Uint8Array(await file.arrayBuffer());
      const detected = detectBom(bytes, elements.encoding.value);
      let decoder;
      try {
        decoder = new TextDecoder(detected.encoding, { fatal: false });
      } catch (error) {
        throw new Error('当前浏览器不支持所选编码：' + detected.encoding);
      }
      const text = decoder.decode(bytes.subarray(detected.offset));
      const sample = text.slice(0, 20000);
      const nulCount = (sample.match(/\0/g) || []).length;
      if (sample.length > 0 && nulCount / sample.length > 0.01) {
        throw new Error(file.name + ' 看起来不是文本文件，或文件编码选择不正确。');
      }
      return text;
    }

    function pastedTextSize(text) {
      return new Blob([text]).size;
    }

    async function readSide(side) {
      const file = state['selected' + side];
      const pasted = elements['text' + side].value;
      if (file) return readFile(file);
      const size = pastedTextSize(pasted);
      if (size > MAX_BYTES) throw new Error((side === 'A' ? '旧文本' : '新文本') + '的粘贴内容超过 10 MiB 限制。');
      return pasted;
    }

    const WORKER_SOURCE = String.raw`
      'use strict';
      const EXACT_DP_CELLS = 1800000;
      const MAX_ANCHOR_DEPTH = 24;

      function splitLines(text) {
        if (text === '') return [];
        return text.replace(/\r\n?|\u2028|\u2029/g, '\n').split('\n');
      }

      function normalizeLine(line, mode) {
        if (mode === 'trailing') return line.replace(/[ \t\u00a0\ufeff]+$/g, '');
        if (mode === 'all') return line.trim().replace(/[\s\u00a0\ufeff]+/g, ' ');
        return line;
      }

      self.onmessage = event => {
        const data = event.data;
        try {
          self.postMessage({ id: data.id, type: 'progress', message: '正在建立行索引…' });
          const linesA = splitLines(data.textA);
          const linesB = splitLines(data.textB);
          const idsA = new Int32Array(linesA.length);
          const idsB = new Int32Array(linesB.length);
          const dictionary = new Map();
          let nextId = 1;

          function encode(lines, target) {
            for (let index = 0; index < lines.length; index++) {
              const normalized = normalizeLine(lines[index], data.mode);
              let id = dictionary.get(normalized);
              if (id === undefined) {
                id = nextId++;
                dictionary.set(normalized, id);
              }
              target[index] = id;
            }
          }

          encode(linesA, idsA);
          encode(linesB, idsB);
          self.postMessage({ id: data.id, type: 'progress', message: '正在匹配差异区块…' });

          const hunks = [];
          let approximateRanges = 0;

          function push(type, aStart, bStart, length) {
            if (length <= 0) return;
            const last = hunks[hunks.length - 1];
            const mergeEqual = type === 0 && last && last[0] === 0 && last[1] + last[3] === aStart && last[2] + last[3] === bStart;
            const mergeDelete = type === 1 && last && last[0] === 1 && last[1] + last[3] === aStart && last[2] === bStart;
            const mergeInsert = type === 2 && last && last[0] === 2 && last[1] === aStart && last[2] + last[3] === bStart;
            if (mergeEqual || mergeDelete || mergeInsert) last[3] += length;
            else hunks.push([type, aStart, bStart, length]);
          }

          function exactDiff(a0, a1, b0, b1) {
            const aLength = a1 - a0;
            const bLength = b1 - b0;
            const columns = bLength + 1;
            const dp = new Uint16Array((aLength + 1) * columns);
            for (let ai = aLength - 1; ai >= 0; ai--) {
              const row = ai * columns;
              const nextRow = (ai + 1) * columns;
              for (let bi = bLength - 1; bi >= 0; bi--) {
                dp[row + bi] = idsA[a0 + ai] === idsB[b0 + bi]
                  ? dp[nextRow + bi + 1] + 1
                  : Math.max(dp[nextRow + bi], dp[row + bi + 1]);
              }
            }

            let ai = 0;
            let bi = 0;
            while (ai < aLength && bi < bLength) {
              if (idsA[a0 + ai] === idsB[b0 + bi]) {
                push(0, a0 + ai, b0 + bi, 1);
                ai++;
                bi++;
              } else if (dp[(ai + 1) * columns + bi] >= dp[ai * columns + bi + 1]) {
                push(1, a0 + ai, b0 + bi, 1);
                ai++;
              } else {
                push(2, a0 + ai, b0 + bi, 1);
                bi++;
              }
            }
            if (ai < aLength) push(1, a0 + ai, b0 + bi, aLength - ai);
            if (bi < bLength) push(2, a0 + ai, b0 + bi, bLength - bi);
          }

          function uniquePositions(ids, start, end) {
            const positions = new Map();
            for (let index = start; index < end; index++) {
              const id = ids[index];
              positions.set(id, positions.has(id) ? -1 : index);
            }
            return positions;
          }

          function patienceAnchors(a0, a1, b0, b1) {
            const positionsA = uniquePositions(idsA, a0, a1);
            const positionsB = uniquePositions(idsB, b0, b1);
            const pairs = [];
            positionsA.forEach((aPosition, id) => {
              const bPosition = positionsB.get(id);
              if (aPosition >= 0 && bPosition >= 0) pairs.push([aPosition, bPosition]);
            });
            pairs.sort((left, right) => left[0] - right[0]);
            if (pairs.length === 0) return pairs;

            const tails = [];
            const tailIndexes = [];
            const previous = new Int32Array(pairs.length);
            previous.fill(-1);
            for (let index = 0; index < pairs.length; index++) {
              const bPosition = pairs[index][1];
              let low = 0;
              let high = tails.length;
              while (low < high) {
                const middle = (low + high) >>> 1;
                if (tails[middle] < bPosition) low = middle + 1;
                else high = middle;
              }
              if (low > 0) previous[index] = tailIndexes[low - 1];
              tails[low] = bPosition;
              tailIndexes[low] = index;
            }

            const anchors = [];
            let cursor = tailIndexes[tails.length - 1];
            while (cursor >= 0) {
              anchors.push(pairs[cursor]);
              cursor = previous[cursor];
            }
            anchors.reverse();
            return anchors;
          }

          function diffRange(a0, a1, b0, b1, depth) {
            let prefix = 0;
            while (a0 + prefix < a1 && b0 + prefix < b1 && idsA[a0 + prefix] === idsB[b0 + prefix]) prefix++;
            if (prefix) {
              push(0, a0, b0, prefix);
              a0 += prefix;
              b0 += prefix;
            }

            let suffix = 0;
            while (a1 - suffix > a0 && b1 - suffix > b0 && idsA[a1 - suffix - 1] === idsB[b1 - suffix - 1]) suffix++;
            a1 -= suffix;
            b1 -= suffix;

            const aLength = a1 - a0;
            const bLength = b1 - b0;
            if (aLength === 0) push(2, a0, b0, bLength);
            else if (bLength === 0) push(1, a0, b0, aLength);
            else if (aLength * bLength <= EXACT_DP_CELLS) exactDiff(a0, a1, b0, b1);
            else if (depth < MAX_ANCHOR_DEPTH) {
              const anchors = patienceAnchors(a0, a1, b0, b1);
              if (anchors.length > 0) {
                let nextA = a0;
                let nextB = b0;
                for (const anchor of anchors) {
                  diffRange(nextA, anchor[0], nextB, anchor[1], depth + 1);
                  push(0, anchor[0], anchor[1], 1);
                  nextA = anchor[0] + 1;
                  nextB = anchor[1] + 1;
                }
                diffRange(nextA, a1, nextB, b1, depth + 1);
              } else {
                push(1, a0, b0, aLength);
                push(2, a1, b0, bLength);
                approximateRanges++;
              }
            } else {
              push(1, a0, b0, aLength);
              push(2, a1, b0, bLength);
              approximateRanges++;
            }

            if (suffix) push(0, a1, b1, suffix);
          }

          diffRange(0, idsA.length, 0, idsB.length, 0);
          self.postMessage({
            id: data.id,
            type: 'complete',
            hunks,
            approximateRanges,
            lineCountA: linesA.length,
            lineCountB: linesB.length
          });
        } catch (error) {
          self.postMessage({ id: data.id, type: 'error', message: error && error.message ? error.message : String(error) });
        }
      };
    `;

    function stopWorker() {
      if (state.worker) {
        state.worker.terminate();
        state.worker = null;
      }
    }

    function cancelCompare(announce) {
      const wasBusy = state.busy;
      state.runId++;
      stopWorker();
      setBusy(false);
      if (announce && wasBusy) setStatus('已取消计算');
    }

    async function startCompare(useCachedText) {
      clearMessages();
      const hasAnyInput = state.selectedA || state.selectedB || elements.textA.value.length > 0 || elements.textB.value.length > 0;
      if (!useCachedText && !hasAnyInput) {
        setMessage('error', '请至少选择一个文件或粘贴一段文本。另一侧可以留空。');
        elements.textA.focus();
        return;
      }

      cancelCompare(false);
      const runId = ++state.runId;
      setBusy(true);
      setStatus(useCachedText ? '正在按新设置重新比较…' : '正在读取文本…');

      try {
        if (!useCachedText) {
          const values = await Promise.all([readSide('A'), readSide('B')]);
          if (runId !== state.runId) return;
          state.rawA = values[0];
          state.rawB = values[1];
          state.linesA = splitLines(state.rawA);
          state.linesB = splitLines(state.rawB);
          state.titleA = state.selectedA ? state.selectedA.name : (state.rawA ? '粘贴的旧文本' : '空白');
          state.titleB = state.selectedB ? state.selectedB.name : (state.rawB ? '粘贴的新文本' : '空白');
        }

        if (!window.Worker || !window.Blob || !window.URL) throw new Error('当前浏览器不支持后台比较，请升级到较新的浏览器。');
        setStatus('正在启动后台比较…');
        const workerUrl = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'text/javascript' }));
        const worker = new Worker(workerUrl);
        URL.revokeObjectURL(workerUrl);
        state.worker = worker;

        worker.onmessage = event => {
          const data = event.data;
          if (data.id !== state.runId) return;
          if (data.type === 'progress') {
            setStatus(data.message);
            return;
          }
          if (data.type === 'error') {
            stopWorker();
            setBusy(false);
            setMessage('error', '比较失败：' + data.message);
            setStatus('比较失败');
            return;
          }
          if (data.type === 'complete') {
            stopWorker();
            state.hunks = data.hunks;
            state.expandedBlocks.clear();
            buildBlocks();
            state.page = 1;
            rebuildVisibleItems();
            renderPage();
            updateStats(data.lineCountA, data.lineCountB);
            elements.titleA.textContent = state.titleA;
            elements.titleB.textContent = state.titleB;
            elements.foldButton.disabled = false;
            setBusy(false);
            setStatus('比较完成');
            if (data.approximateRanges > 0) {
              setMessage('warning', '有 ' + data.approximateRanges + ' 个超大且缺少稳定锚点的差异区块采用了整体替换显示；结果可完整反映增删内容，但该区块未进行最小行级配对。');
            }
          }
        };

        worker.onerror = event => {
          if (runId !== state.runId) return;
          stopWorker();
          setBusy(false);
          setMessage('error', '后台比较发生错误：' + (event.message || '未知错误'));
          setStatus('比较失败');
        };

        worker.postMessage({
          id: runId,
          textA: state.rawA,
          textB: state.rawB,
          mode: elements.whitespaceMode.value
        });
      } catch (error) {
        if (runId !== state.runId) return;
        stopWorker();
        setBusy(false);
        setMessage('error', error.message || String(error));
        setStatus('处理失败');
      }
    }

    function buildBlocks() {
      const blocks = [];
      let index = 0;
      while (index < state.hunks.length) {
        const hunk = state.hunks[index];
        if (hunk[0] === 0) {
          blocks.push({ id: blocks.length, type: 'equal', aStart: hunk[1], bStart: hunk[2], length: hunk[3] });
          index++;
          continue;
        }

        let aStart = null;
        let bStart = null;
        let deleteLength = 0;
        let insertLength = 0;
        while (index < state.hunks.length && state.hunks[index][0] !== 0) {
          const change = state.hunks[index];
          if (change[0] === 1) {
            if (aStart === null) aStart = change[1];
            deleteLength += change[3];
          } else {
            if (bStart === null) bStart = change[2];
            insertLength += change[3];
          }
          index++;
        }
        if (aStart === null) aStart = index < state.hunks.length ? state.hunks[index][1] : state.linesA.length;
        if (bStart === null) bStart = index < state.hunks.length ? state.hunks[index][2] : state.linesB.length;
        blocks.push({
          id: blocks.length,
          type: 'change',
          aStart,
          bStart,
          deleteLength,
          insertLength,
          length: Math.max(deleteLength, insertLength)
        });
      }
      state.blocks = blocks;
    }

    function rebuildVisibleItems() {
      const items = [];
      let visibleRows = 0;
      function add(item) {
        item.visibleStart = visibleRows;
        visibleRows += item.length;
        items.push(item);
      }

      state.blocks.forEach(block => {
        if (block.type === 'change') {
          add({ type: 'change', block, offset: 0, length: block.length });
          return;
        }
        const shouldFold = state.foldEnabled && block.length > CONTEXT_LINES * 2 && !state.expandedBlocks.has(block.id);
        if (!shouldFold) {
          add({ type: 'equal', block, offset: 0, length: block.length });
          return;
        }
        add({ type: 'equal', block, offset: 0, length: CONTEXT_LINES });
        add({ type: 'fold', block, hidden: block.length - CONTEXT_LINES * 2, length: 1 });
        add({ type: 'equal', block, offset: block.length - CONTEXT_LINES, length: CONTEXT_LINES });
      });

      state.visibleItems = items;
      state.visibleRows = visibleRows;
      const pageCount = Math.max(1, Math.ceil(visibleRows / state.pageSize));
      state.page = Math.min(Math.max(1, state.page), pageCount);
    }

    function renderRuns(tokens) {
      if (tokens.length === 0) return '';
      let output = '';
      let currentType = tokens[0][1];
      let buffer = '';
      function flush() {
        if (!buffer) return;
        const escaped = escapeHtml(buffer);
        output += currentType ? '<span class="' + currentType + '">' + escaped + '</span>' : escaped;
        buffer = '';
      }
      for (const token of tokens) {
        if (token[1] !== currentType) {
          flush();
          currentType = token[1];
        }
        buffer += token[0];
      }
      flush();
      return output;
    }

    function inlineDiff(left, right, pageBudget) {
      const estimatedCells = left.length * right.length;
      if (estimatedCells > pageBudget.remaining) {
        return { left: escapeHtml(left), right: escapeHtml(right) };
      }
      const a = Array.from(left);
      const b = Array.from(right);
      if (a.length === 0 || b.length === 0 || a.length > INLINE_MAX_CODEPOINTS || b.length > INLINE_MAX_CODEPOINTS || a.length * b.length > INLINE_DP_CELLS) {
        return { left: escapeHtml(left), right: escapeHtml(right) };
      }
      pageBudget.remaining -= a.length * b.length;
      const columns = b.length + 1;
      const dp = new Uint16Array((a.length + 1) * columns);
      for (let ai = a.length - 1; ai >= 0; ai--) {
        const row = ai * columns;
        const next = (ai + 1) * columns;
        for (let bi = b.length - 1; bi >= 0; bi--) {
          dp[row + bi] = a[ai] === b[bi] ? dp[next + bi + 1] + 1 : Math.max(dp[next + bi], dp[row + bi + 1]);
        }
      }
      const leftTokens = [];
      const rightTokens = [];
      let ai = 0;
      let bi = 0;
      while (ai < a.length && bi < b.length) {
        if (a[ai] === b[bi]) {
          leftTokens.push([a[ai], '']);
          rightTokens.push([b[bi], '']);
          ai++;
          bi++;
        } else if (dp[(ai + 1) * columns + bi] >= dp[ai * columns + bi + 1]) {
          leftTokens.push([a[ai], 'char-delete']);
          ai++;
        } else {
          rightTokens.push([b[bi], 'char-insert']);
          bi++;
        }
      }
      while (ai < a.length) leftTokens.push([a[ai++], 'char-delete']);
      while (bi < b.length) rightTokens.push([b[bi++], 'char-insert']);
      return { left: renderRuns(leftTokens), right: renderRuns(rightTokens) };
    }

    function cellHtml(kind, lineNumber, marker, content, accessibleLabel) {
      const className = kind ? 'diff-cell line-' + kind : 'diff-cell';
      return '<div class="' + className + '" role="cell">' +
        '<span class="visually-hidden">' + escapeHtml(accessibleLabel) + '</span>' +
        '<span class="line-num" aria-hidden="true">' + (lineNumber || '') + '</span>' +
        '<span class="change-mark" aria-hidden="true">' + marker + '</span>' +
        '<span class="line-content" aria-hidden="true">' + content + '</span></div>';
    }

    function rowHtml(left, right) {
      return '<div class="diff-row" role="row">' + left + right + '</div>';
    }

    function renderEqualRow(block, offset) {
      const aIndex = block.aStart + offset;
      const bIndex = block.bStart + offset;
      const left = state.linesA[aIndex] || '';
      const right = state.linesB[bIndex] || '';
      const ignoredDifference = left !== right;
      const kind = ignoredDifference ? 'ignored' : '';
      const marker = ignoredDifference ? '≈' : '';
      const hint = ignoredDifference ? '；空白差异已忽略' : '';
      return rowHtml(
        cellHtml(kind, aIndex + 1, marker, escapeHtml(left), '旧文本第 ' + (aIndex + 1) + ' 行' + hint + '：' + left),
        cellHtml(kind, bIndex + 1, marker, escapeHtml(right), '新文本第 ' + (bIndex + 1) + ' 行' + hint + '：' + right)
      );
    }

    function renderChangeRow(block, offset, inlineBudget) {
      const hasDelete = offset < block.deleteLength;
      const hasInsert = offset < block.insertLength;
      const aIndex = block.aStart + offset;
      const bIndex = block.bStart + offset;
      const oldLine = hasDelete ? (state.linesA[aIndex] || '') : '';
      const newLine = hasInsert ? (state.linesB[bIndex] || '') : '';
      const inline = hasDelete && hasInsert ? inlineDiff(oldLine, newLine, inlineBudget) : { left: escapeHtml(oldLine), right: escapeHtml(newLine) };
      let left;
      let right;
      if (hasDelete && hasInsert) {
        left = cellHtml('modify', aIndex + 1, '~', inline.left, '修改前，旧文本第 ' + (aIndex + 1) + ' 行：' + oldLine);
        right = cellHtml('modify', bIndex + 1, '~', inline.right, '修改后，新文本第 ' + (bIndex + 1) + ' 行：' + newLine);
      } else {
        left = hasDelete
          ? cellHtml('delete', aIndex + 1, '−', inline.left, '删除旧文本第 ' + (aIndex + 1) + ' 行：' + oldLine)
          : cellHtml('empty', '', '', '', '旧文本无对应行');
        right = hasInsert
          ? cellHtml('insert', bIndex + 1, '+', inline.right, '新增新文本第 ' + (bIndex + 1) + ' 行：' + newLine)
          : cellHtml('empty', '', '', '', '新文本无对应行');
      }
      return rowHtml(left, right);
    }

    function renderPage() {
      const totalPages = Math.max(1, Math.ceil(state.visibleRows / state.pageSize));
      const start = (state.page - 1) * state.pageSize;
      const end = Math.min(state.visibleRows, start + state.pageSize);
      const parts = [];
      const inlineBudget = { remaining: INLINE_PAGE_DP_BUDGET };

      for (const item of state.visibleItems) {
        const itemEnd = item.visibleStart + item.length;
        if (itemEnd <= start || item.visibleStart >= end) continue;
        const localStart = Math.max(0, start - item.visibleStart);
        const localEnd = Math.min(item.length, end - item.visibleStart);
        if (item.type === 'fold') {
          parts.push('<div class="fold-row" role="row"><button type="button" data-expand-block="' + item.block.id + '" aria-expanded="false">展开隐藏的 ' + item.hidden + ' 行相同内容</button></div>');
          continue;
        }
        for (let local = localStart; local < localEnd; local++) {
          const offset = item.offset + local;
          parts.push(item.type === 'equal' ? renderEqualRow(item.block, offset) : renderChangeRow(item.block, offset, inlineBudget));
        }
      }

      elements.diffBody.innerHTML = parts.length ? parts.join('') : '<div class="empty-state">两侧内容均为空，没有可显示的行。</div>';
      elements.pageInfo.textContent = '第 ' + state.page + ' / ' + totalPages + ' 页';
      elements.pageInfoBottom.textContent = '第 ' + state.page + ' / ' + totalPages + ' 页';
      elements.pageJump.value = String(state.page);
      elements.pageJumpBottom.value = String(state.page);
      elements.pageJump.max = String(totalPages);
      elements.pageJumpBottom.max = String(totalPages);
      elements.pageJump.disabled = totalPages <= 1;
      elements.pageJumpBottom.disabled = totalPages <= 1;
      elements.pageJumpButton.disabled = totalPages <= 1;
      elements.pageJumpButtonBottom.disabled = totalPages <= 1;
      elements.prevPage.disabled = state.page <= 1;
      elements.nextPage.disabled = state.page >= totalPages;
      elements.prevPageBottom.disabled = state.page <= 1;
      elements.nextPageBottom.disabled = state.page >= totalPages;
      elements.foldButton.setAttribute('aria-pressed', String(state.foldEnabled));
      elements.foldButton.textContent = state.foldEnabled ? '折叠大段相同内容' : '显示全部相同内容';
    }

    function updateStats(lineCountA, lineCountB) {
      let inserted = 0;
      let deleted = 0;
      let modified = 0;
      state.blocks.forEach(block => {
        if (block.type !== 'change') return;
        const pairedLines = Math.min(block.deleteLength, block.insertLength);
        modified += pairedLines;
        deleted += block.deleteLength - pairedLines;
        inserted += block.insertLength - pairedLines;
      });
      elements.stats.innerHTML = '<span>' + lineCountA + ' → ' + lineCountB + ' 行</span>' +
        '<span class="stat-insert">+' + inserted + ' 新增</span>' +
        '<span class="stat-delete">−' + deleted + ' 删除</span>' +
        '<span class="stat-modify">~' + modified + ' 修改</span>';
    }

    function resetResult() {
      state.rawA = null;
      state.rawB = null;
      state.linesA = [];
      state.linesB = [];
      state.hunks = [];
      state.blocks = [];
      state.visibleItems = [];
      state.visibleRows = 0;
      state.page = 1;
      state.expandedBlocks.clear();
      elements.titleA.textContent = '旧文本';
      elements.titleB.textContent = '新文本';
      elements.diffBody.innerHTML = '<div class="empty-state">请选择文件或粘贴文本，然后开始对比。</div>';
      elements.stats.textContent = '';
      elements.pageInfo.textContent = '第 1 / 1 页';
      elements.pageInfoBottom.textContent = '第 1 / 1 页';
      elements.pageJump.value = '1';
      elements.pageJumpBottom.value = '1';
      elements.pageJump.max = '1';
      elements.pageJumpBottom.max = '1';
      elements.pageJump.disabled = true;
      elements.pageJumpBottom.disabled = true;
      elements.pageJumpButton.disabled = true;
      elements.pageJumpButtonBottom.disabled = true;
      elements.prevPage.disabled = true;
      elements.nextPage.disabled = true;
      elements.prevPageBottom.disabled = true;
      elements.nextPageBottom.disabled = true;
      elements.foldButton.disabled = true;
    }

    function clearAll() {
      cancelCompare(false);
      state.selectedA = null;
      state.selectedB = null;
      elements.fileA.value = '';
      elements.fileB.value = '';
      elements.textA.value = '';
      elements.textB.value = '';
      refreshSourceUi('A');
      refreshSourceUi('B');
      clearMessages();
      resetResult();
      setStatus('已清空');
      elements.textA.focus();
    }

    function swapSides() {
      const selected = state.selectedA;
      state.selectedA = state.selectedB;
      state.selectedB = selected;
      const pasted = elements.textA.value;
      elements.textA.value = elements.textB.value;
      elements.textB.value = pasted;
      elements.fileA.value = '';
      elements.fileB.value = '';
      refreshSourceUi('A');
      refreshSourceUi('B');
      clearMessages();
      if (state.rawA !== null) startCompare(false);
    }

    elements.compareButton.addEventListener('click', () => startCompare(false));
    elements.cancelButton.addEventListener('click', () => cancelCompare(true));
    elements.clearButton.addEventListener('click', clearAll);
    elements.swapButton.addEventListener('click', swapSides);

    elements.whitespaceMode.addEventListener('change', () => {
      if (state.rawA !== null && !state.busy) startCompare(true);
    });

    elements.foldButton.addEventListener('click', () => {
      state.foldEnabled = !state.foldEnabled;
      state.expandedBlocks.clear();
      state.page = 1;
      rebuildVisibleItems();
      renderPage();
    });

    elements.diffBody.addEventListener('click', event => {
      const button = event.target.closest('[data-expand-block]');
      if (!button) return;
      state.expandedBlocks.add(Number(button.dataset.expandBlock));
      rebuildVisibleItems();
      renderPage();
    });

    elements.pageSize.addEventListener('change', () => {
      state.pageSize = Number(elements.pageSize.value);
      state.page = 1;
      rebuildVisibleItems();
      renderPage();
    });

    function navigateToPage(targetPage) {
      const totalPages = Math.max(1, Math.ceil(state.visibleRows / state.pageSize));
      const nextPage = Math.min(totalPages, Math.max(1, targetPage));
      if (nextPage === state.page) {
        renderPage();
        return;
      }
      state.page = nextPage;
      renderPage();
      requestAnimationFrame(() => elements.resultCard.scrollIntoView({ block: 'start' }));
    }

    function changePage(direction) {
      navigateToPage(state.page + direction);
    }

    function jumpToPage(input) {
      const value = Number(input.value);
      const totalPages = Math.max(1, Math.ceil(state.visibleRows / state.pageSize));
      if (!Number.isInteger(value) || value < 1) {
        setMessage('warning', '请输入 1 到 ' + totalPages + ' 之间的整数页码。');
        input.focus();
        return;
      }
      if (value > totalPages) {
        setMessage('warning', '最大页码为 ' + totalPages + '，已定位到最后一页。');
      }
      navigateToPage(value);
    }

    elements.prevPage.addEventListener('click', () => changePage(-1));
    elements.nextPage.addEventListener('click', () => changePage(1));
    elements.prevPageBottom.addEventListener('click', () => changePage(-1));
    elements.nextPageBottom.addEventListener('click', () => changePage(1));
    elements.pageJumpButton.addEventListener('click', () => jumpToPage(elements.pageJump));
    elements.pageJumpButtonBottom.addEventListener('click', () => jumpToPage(elements.pageJumpBottom));
    [elements.pageJump, elements.pageJumpBottom].forEach(input => input.addEventListener('keydown', event => {
      if (event.key === 'Enter') jumpToPage(input);
    }));
    elements.backToResultTop.addEventListener('click', () => elements.resultCard.scrollIntoView({ block: 'start' }));
  </script>
</body>
</html>
